<style>
/* Layout: Prüfprotokoll-Optik – linke Navigationsleiste (oben auf dem Handy), rechts Arbeitsfläche mit Tabellen und Karten */
:root{

  color-scheme:dark}}

  --ok:#6cc58f; --ok-soft:#1d3527; --warn:#e2b04f; --warn-soft:#3a2f17; --bad:#f08a7e; --bad-soft:#40211d; --off:#7f8b97; --off-soft:#252f39;
  color-scheme:dark}

_MorphKasten_Bewertungskriterien, Analyse_Abgleich_PH_Cockpit und Entwurf_Herstellerfragen (alle 2026-11-22) sowie 20 Postfach-Vorschläge, dazu eine Prüftabelle der 11 offenen Fragen aus dem Statusbericht (Abschnitt 5). Fachlicher Text: %GRR-Rechnung mit Szenarien, Umrechnung der Herstellerangaben (σ, Mittelungszeit, Messzeit), Schätzung ohne Mittelung, Vergleichskriterien Messprinzip, Lückenanalyse Morphologischer Kasten, Kriterienliste, Fragenkatalog an Hersteller. Korrektur zweier Aussagen im Statusbericht (Linearität gegen %GRR; 2D-Schattenbild und Zylinderform).","fach":true,"updated":"2026-11-22T15:37:58.270Z"},{"id":"mws0ll6eekuxu","date":"2026-11-22","help":"KI (Claude Code) hat am 22.11.2026 drei Sensor-Kandidaten aus der Web-Suche als Vorschläge für den Sensorvergleich angelegt (Mitutoyo LSM-501S, LSM-503S, Aeroel XLS13XY). Hersteller, Modell, Prinzip und Link zum Datenblatt sind eingetragen, die Messwerte sind leer, weil das Datenblatt nicht eingesehen ist. Die Liste der offenen Punkte ist ergänzt.","fach":false,"updated":"2026-11-22T15:51:45.014Z"},{"id":"mws13l08urlwl","date":"2026-11-22","help":"KI (Claude Code) hat am 22.11.2026 die von Janek gelieferten Datenblätter ausgewertet: Mitutoyo Bulletin 2101 (LSM-501S, -503S, -506S, -512S, -516S, -6902H/6900, -9506) und Aeroel XLS13XY/XLS35XY D00105_D rev. 2,2. Sie hat 11 Sensoren mit allen 9 Punkten und Seitenangaben in den Sensorvergleich eingetragen und die Archiv-Einträge angelegt. Bei allen 26 vorhandenen Sensoren hat sie Notizen ergänzt: Umrechnung auf σ, Vergleich mit den Szenarien A–C, offene Fragen. Außerdem hat sie die Linearität ODC1200/1201 aus dem Katalog zugeordnet und bei RIFTEK die Bedingung ergänzt. Fachlicher Text: Bewertungsnotizen je Sensor.","fach":true,"updated":"2026-11-22T16:05:44.600Z"},{"id":"mws7ats0iu6xy","date":"2026-11-22","help":"KI (Claude Code) hat am 22.11.2026 im Netz zu Nutzwertanalyse, Bewertungskriterien und Messmittelauswahl recherchiert (sechs Suchen, drei Seiten-Abrufe, zwei davon gesperrt). Die Methode wurde mit zwei Quellen geprüft. Erstellt: projekt/Analyse_Bewertungskriterien_Recherche_2026-11-22.md und der Vorschlag pv-ent-bewertungsmatrix. Fachlicher Text: Auswahl und Formulierung der acht Bewertungskriterien, Belegeinstufung.","fach":true,"updated":"2026-11-22T18:59:20.256Z"},{"id":"mwsam6y03l66t","date":"2026-11-22","help":"KI (Claude Code) hat die Bewertungskriterien mit der Anforderungsliste PH V1.2 abgeglichen (Tantal ist dort 1.5, nicht 1.2), die gewichtbaren Anforderungen herausgefiltert und zwei Vorschläge aus der Internetrecherche ergänzt. Ergebnis: projekt/Analyse_Bewertungskriterien_PH-Abgleich_2026-11-22.md. Umbau im Cockpit: Übernahme-Knopf mit PH-Liste. Fachlicher Text: Auswahl und Begründung der Kriterien, Belegstand der Vorschläge.","fach":true,"updated":"2026-11-22T20:32:09.384Z"},{"id":"mwsam7a81g535","date":"2026-11-22","help":"KI (Claude Code) hat auf Janeks Frage geantwortet, ob ein 2D-Schattenbild bei 360°-Drehung die Zylinderform liefert. Ergebnis als Nachtrag (2) in projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md und als Frage pv-ent-drehung-stationen. Fachlicher Text: Herleitung, Winkelauflösung je Sensor, Stationszahl und Schätzung der Zeit, Korrektur der früheren Messzeit.","fach":true,"updated":"2026-11-22T20:32:09.824Z"},{"id":"mwsam7ii0eom8","date":"2026-11-22","help":"KI (Claude Code) hat auf Janeks Hinweis (keine Helix, Zylinderform je 2-mm-Punkt) die nötige Bildrate und den Winkelschritt hergeleitet: Formfehler durch Abtastung, Bildrate je Drehzeit, Auslösung über Drehgeber, Stationszeit. Ergebnis als Nachtrag (3) in der Sensorik-Analyse und als Frage pv-ent-oberwellen. Fachlicher Text: Herleitung Winkelschritt, Tabellen, Korrektur der Bildrate des RF656.2D (50/s mit SuM).","fach":true,"updated":"2026-11-22T20:32:10.122Z"},{"id":"mwsam7rmcch1c","date":"2026-11-22","help":"KI (Claude Code) hat auf Janeks Hinweis das Taktzeitmodell korrigiert: Der Servo bremst nicht; Umdrehungszeit = Bild pdated":"2026-11-22T13:12:01.479Z","fach":false,"beleg":"","ziel":"tasks/mwruw6h1zap2q"},{"id":"kl-2026-11-22-statusbericht","kind":"kilog","status":"übernommen","vorschlag":"KI (Claude Code)","title":"Statusbericht Technikerarbeit mit Abgleich PH V1.2 und Vorprüfung Sensorik","detail":"KI hat den Statusbericht projekt/Statusbericht_2026-11-22.md erstellt: Abgleich mit dem Pflichtenheft V1.2 (Stand 20.11.2026) und den Cockpit-Daten, Vorprüfung der Sensoren nach Katalogwerten (ohne Messung), Vorschläge für die nächsten Arbeitspakete und ein Auftrag für eine weitere Sitzung. Fachlicher Text: Sensor-Vorprüfung und Herleitung der %GRR-Grenze.","date":"2026-11-22","fach":true,"updated":"2026-11-22T14:05:50.032Z","who":"","ask":"","due":"","prio":"1","stand":"offen","beleg":"","ziel":"kilog/mwrwtdn1f8nyi"},{"id":"pv-ent-toleranz-grr","kind":"entscheidung","title":"KI-Vorschlag: Toleranzwerte Zylinderform (NiTi, Edelstahl) und Bezug der %GRR-Grenze festlegen","detail":"PH V1.2 Anf. 2.1 führt die Toleranzen NiTi und Edelstahl als [?]. Nach Anf. 2.4 und AIAG MSA 4. Aufl. (Tab. II-D 1, S. 78; Seite nur aus einer Sekundärquelle) gilt %GRR = 6·σ/T ≤ 10 %, also σ_GRR ≤ 0,1·T/6. Eigene Rechnung: Szenario A, Ø ± 13 µm (T = 26 µm): σ ≤ 0,43 µm. Szenario B, Zylinderform 10 µm (früherer NiTi-Wert, nur Platzhalter): σ ≤ 0,17 µm. Szenario C, 25 µm (früherer Edelstahl-Wert, nur Platzhalter): σ ≤ 0,42 µm. Zu klären: (1) Toleranzwerte je Werkstoff mit dem QM; (2) welche Toleranzbreite bei der einseitigen Zylinderform (nur Obergrenze) gilt; (3) welches Szenario bis zur Klärung als Arbeitsannahme dient. Hinweis: Die Zylinderform ist eine Differenz zweier Werte; bei unabhängigen Werten gilt σ_Diff = √2·σ (Annahme). Ersetzt den Toleranzteil der Entscheidung „Zylinderform“. Details: projekt/Analyse_Toleranz_GRR_2026-11-22.md","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:50.763Z","fach":true,"who":"Janek Bauer","ask":"Simon Hochstuhl; QM, Paul Baidinger","due":"2026-11-27","prio":"1","stand":"offen","ziel":"tasks/mwrzsqvo6daky"},{"id":"pv-ent-mittelung","kind":"entscheidung","title":"Frage an den Betrieb: Verbietet Anf. 2.5 „Mittelwerte unzulässig“ auch die Mittelung im Sensor an einem Messpunkt?","detail":"Alle Herstellerwerte zur Wiederholgenauigkeit gelten nur mit starker Mittelung am ruhenden Normal: Keyence LS-9030 ±0,1 µm (±2σ, 2048-fach, Datenblatt S. 1 Fn. *2); Micro-Epsilon ODC2700-10 ≤ 0,03 µm (95 %, 1024 Werte, Katalog S. 13 Fn. 6). Eine grobe KI-Schätzung (weißes Rauschen, √N) ergibt ohne Mittelung für LS-9030 ca. 2,3 µm und für ODC2700-10 ca. 0,5 µm. Das ist zu viel für jedes Szenario. Frage: Meint 2.5 nur „nicht über mehrere Messpunkte oder die Rohrlänge mitteln“, oder auch „keine zeitliche Mittelung an einem Messpunkt“? Die Antwort entscheidet, ob ein Sensor die Anforderung 2.4 erfüllen kann. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Abschnitt 2.2","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:29.643Z","fach":false,"who":"Janek Bauer","ask":"Simon Hochstuhl; QM, Paul Baidinger","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mwrzs399nkva2"},{"id":"pv-ent-zylinderform-bezug","kind":"entscheidung","title":"Frage an den Betrieb: Zylinderform je Querschnitt oder über das ganze Rohr? Wie viele Winkellagen?","detail":"Das PH V1.2 (Kap. 5.3) definiert Zylinderform = Ø max − Ø min. Offen ist, worüber Ø max und Ø min gebildet werden: (a) je Messpunkt bzw. Querschnitt über den Umfang oder (b) über alle Messwerte des Rohres, dann einschließlich des Verlaufs über die Länge. Offen ist auch, wie viele Winkellagen je Querschnitt ausreichen. Laut PH misst der Lieferant bei NiTi an vier Punkten im Abstand von etwa 90° an einem Ende. Die Antwort bestimmt Messprinzip und Messzeit (Morphologischer Kasten TF3/TF4).","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:43.588Z","fach":false,"who":"Janek Bauer","ask":"Simon Hochstuhl; QM, Paul Baidinger","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mws03jxa2hz0e"},{"id":"pv-ent-messprinzip","kind":"entscheidung","title":"KI-Vorschlag: Entscheidungsgrundlage Messprinzip (Winkellagen und Längenerfassung)","detail":"Ergebnis der Analyse: Ein 2D-Schattenbild (RIFTEK RF65x.2D) ist eine Projektion aus einer Richtung. Es liefert kein Ø max − Ø min über den Umfang. Auch das 2D-Prinzip braucht also mehrere Winkellagen. Die Entscheidung lautet daher nicht „ThruBeam oder 2D-Bild“. Zu entscheiden ist (1) wie die Winkellagen entstehen (TF3) und (2) wie viele Längenpositionen ein Messvorgang erfasst. Eigene Rechnung Messzeit bei 3 m und 2 mm (1501 Punkte), je Winkellage, ohne Verfahren und Drehen: LS-9030 mit voller Mittelung ≈ 192 s, ODC2700 ≈ 103 s, RF656.2D ≥ 23 s, RF657.2D ≥ 63 s. Vergleichskriterien und Quellen: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Abschnitt 4. Voraussetzung: pv-ent-zylinderform-bezug und pv-ent-mittelung. Korrigiert die Aussage im Statusbericht vom 22.11. (Abschnitt 4.2).","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:46.366Z","fach":true,"who":"Janek Bauer","ask":"","due":"2026-12-11","prio":"1","stand":"offen","ziel":"tasks/mws03m2h7ngow"},{"id":"pv-ent-qm-pruefmittel","kind":"entscheidung","title":"Frage an das QM: Vorgaben ISO 13485 für ein neues Prüfmittel im Wareneingang","detail":"PH V1.2 Kap. 5.3: Die Vorgaben aus dem QM-System (ISO 13485) für ein neues Prüfmittel werden im Projektverlauf mit dem QM geklärt. Bisher gibt es dafür keinen Cockpit-Eintrag. Zu klären: Welche Nachweise braucht das QM schon im Konzept (z. B. Messunsicherheitsbudget, Kalibrierbarkeit, Einstellmeister), da eine MFU am realen System abgegrenzt ist (PH Kap. 4)? Hängt mit dem früheren Widerspruch w11 (%GRR gegen Abgrenzung) zusammen.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:24.478Z","fach":false,"who":"Janek Bauer","ask":"Simon Hochstuhl; QM, Paul Baidinger","due":"2026-12-11","prio":"2","stand":"offen","ziel":"tasks/mwrzrgiia4qvm"},{"id":"pv-auf-datenblaetter","kind":"aufgabe","title":"Datenblätter weiterer Hersteller herunterladen (Mitutoyo LSM-501S/503S, Aeroel XLS13XY)","detail":"Die Web-Suche am 22.11. hat zwei weitere Kandidaten für Ø 1–6,5 mm ergeben: Mitutoyo Laser-Scan-Mikrometer LSM-501S/503S und Aeroel/Marposs XLS13XY (zweiachsig). Die Datenblätter ließen sich nicht laden, weil die Netzwerkregel der Sitzung www.mitutoyo.com, www.marposs.com, res.cloudinary.com und pdf.directindustry.com sperrt. Daher gibt es keine Werte und keinen Eintrag in sensors.json. Bitte die PDFs herunterladen und unter docs/archiv/6 Recherche Messtechnik/<Hersteller>/ ablegen. Danach kann die KI sie auswerten.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:36:55.102Z","fach":false,"who":"Janek Bauer","ask":"","due":"2026-12-04","prio":"2","stand":"offen","beleg":"","ziel":"tasks/mws02iij6i0zs"},{"id":"pv-auf-herstellerfragen","kind":"aufgabe","title":"Herstellerfragen prüfen und an Micro-Epsilon, Keyence und RIFTEK senden (Angebote anfragen)","detail":"Entwurf: projekt/Entwurf_Herstellerfragen_2026-11-22.md (13 Fragen nach Anforderungen geordnet, mit Angebotsanfrage). Nicht versendet. Vor dem Versand prüfen, ob die Toleranzen genannt werden dürfen (vertraulich, nur sinngemäß). Angebote sind ein Ergebnis laut PH Kap. 3. Ziel: Antworten vor der Variantenauswahl am 11.12.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:36:02.287Z","fach":true,"who":"Janek Bauer","ask":"","due":"2026-11-27","prio":"1","stand":"offen","beleg":"","ziel":"tasks/mws01drhm9osg"},{"id":"pv-auf-morph-luecken","kind":"aufgabe","title":"Morphologischer Kasten: eigene Ideen ergänzen, KI-Anteil je Idee kennzeichnen, Lücken prüfen","detail":"Analyse ohne Lösungen: projekt/Analyse_MorphKasten_Bewertungskriterien_2026-11-22.md. Alle TF außer TF1 sind als KI-Vorschlag markiert; Gesamtvarianten fehlen. Ohne eigene TF sind: 2.6 Rauheit, 2.7 Beschädigung/Kontamination, Belastungsnachweis 3.1, Antrieb und Erfassung der Drehung. Veraltete Verweise: „Ovalität“ in TF6, „W7/W10“ und „4.2 Bauhöhe“ passen nicht zur Nummerierung im PH V1.2. K.-o.-Prüffragen aus 2.5, 3.1, 3.2, 3.3, 4.2 stehen in Abschnitt 3 der Analyse. Bis zur Variantenauswahl 11.12.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:04.125Z","fach":true,"who":"Janek Bauer","ask":"","due":"2026-12-04","prio":"1","stand":"offen","beleg":"","ziel":"tasks/mws02ph5m3ds1"},{"id":"pv-daten-r06","kind":"daten","title":"Anforderung 2.1: Ovalität → Zylinderform, Werte offen (PH V1.2)","detail":"PH V1.2 Anf. 2.1: „Erfassung der Zylinderform (Ø max − Ø min) … Toleranz je Rohrtyp“, Werte NiTi [?], Edelstahl [?]. Im Cockpit steht noch „Ovalität“ mit 0,010 / 0,025 mm als bestätigt. Laut CLAUDE.md gewinnt das PH. Ersetzt den Datensatz r06 vollständig.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:35:30.002Z","fach":false,"coll":"reqs","docId":"r06","payload":{"id":"r06","nr":"2.1","art":"F","group":"Messaufgabe","text":"Zylinderform (Ø max − Ø min) je Rohrtyp: NiTi / Edelstahl, Bewertung gegen die Toleranz der Rohrspezifikation","unit":"mm","min":"","max":"","exact":"","note":"Toleranzwerte NiTi und Edelstahl im PH V1.2 offen [?], mit QM zu klären; frühere Werte 0,010 / 0,025 mm nicht mehr gesichert","source":"PH V1.2 (20.11.2026), Anf. 2.1","status":"offen","sym":"ΔD","date":"2026-11-06","updated":"2026-11-22T14:21:36.000Z","noValue":true},"who":"","ask":"","due":"","prio":"1","stand":"offen","beleg":"","ziel":"reqs/r06"},{"id":"pv-daten-r18","kind":"daten","title":"Anforderung 5.1 Platzbedarf: F bestätigt → W offen (PH V1.2)","detail":"PH V1.2 Anf. 5.1: Art W, Wert „offen“, gelb markiert. Im Cockpit steht sie als F und bestätigt. Ersetzt den Datensatz r18 vollständig.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:36:21.176Z","fach":false,"coll":"reqs","docId":"r18","payload":{"id":"r18","nr":"5.1","art":"W","text":"Max. Platzbedarf (L × B)","unit":"m","min":"","max":"","exact":"","note":"Im PH V1.2 Wunschanforderung, Wert offen (gelb, mit dem Betreuer abzustimmen)","source":"PH V1.2 (20.11.2026), Anf. 5.1","status":"offen","date":"2026-11-06","noValue":true,"updated":"2026-11-22T14:19:42.000Z","group":"Aufstellung","sym":""},"who":"","ask":"","due":"","prio":"1","stand":"offen","beleg":"","ziel":"reqs/r18"},{"id":"pv-daten-d04","kind":"daten","title":"Termin PH-Freigabe: 04.12. → 27.11.2026 (bitte bestätigen)","detail":"PH V1.2 Kap. 5.2 nennt 27.11.2026. Der Termin d04 wurde am 21.11. auf 04.12.2026 gesetzt, die Notiz nennt aber weiter 27.11. Unklar ist, ob der 04.12. bewusst gewählt wurde, z. B. als Ausweichtermin. Nur übernehmen, wenn der 27.11. gilt; sonst verwerfen und das PH anpassen.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:21.622Z","fach":false,"coll":"deadlines","docId":"d04","payload":{"id":"d04","title":"PH-Freigabe + Unterschrift im Betrieb","date":"2026-11-27","approx":false,"kind":"betrieb","status":"geplant","note":"PH V1.2 Kap. 5.2: 27.11.2026 Abstimmung und Freigabe des Pflichtenhefts (übernommen aus PH V1.2; vorher im Cockpit 04.12.2026).","updated":"2026-11-22T14:21:36.000Z"},"who":"","ask":"","due":"","prio":"1","stand":"offen","beleg":"","ziel":"deadlines/d04"},{"id":"pv-daten-eval","kind":"daten","title":"KI-Vorschlag: Bewertungskriterien für die Variantenauswahl (Gewichtung offen)","detail":"Die Festanforderungen (F) prüft die Bewertungsseite schon als Ausschluss. Gewichtete Kriterien sind die Mindest- und Wunschanforderungen nach PH V1.2: 2.3, 2.4, 2.6, 2.7, 4.1, 5.1, 1.5. Gewichtung (paarweiser Vergleich) und Punkte bleiben leer, sie sind Janeks Sache. Mögliche weitere Kriterien (Kosten, CE, QM-Nachweis) stehen nur zur Diskussion in projekt/Analyse_MorphKasten_Bewertungskriterien_2026-11-22.md. Ersetzt den leeren Eintrag eval.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:15.384Z","fach":true,"coll":"tools","docId":"eval","payload":{"id":"eval","criteria":[{"id":"k-2-3","name":"2.3 Messpunktabstand 2 mm über die Rohrlänge (M)"},{"id":"k-2-4","name":"2.4 Reproduzierbarkeit %GRR ≤ 10 % – Reserve zur Grenze (M)"},{"id":"k-2-6","name":"2.6 Rauheit messen (W)"},{"id":"k-2-7","name":"2.7 Beschädigung oder Kontamination feststellen (W)"},{"id":"k-4-1","name":"4.1 Taktzeit pro Rohr (W)"},{"id":"k-5-1","name":"5.1 Platzbedarf L × B (W)"},{"id":"k-1-5","name":"1.5 Tantal-Rohre prüfbar (W)"}],"hzul":"","pair":{},"variants":[]},"who":"","ask":"","due":"","prio":"1","stand":"offen","beleg":"","ziel":"tools/eval"},{"id":"pv-kilog-2026-11-22-analysen","kind":"kilog","title":"KI-Hilfe: Analysen zu Toleranz/%GRR, Sensorik, Messprinzip, Morph. Kasten, Bewertungskriterien, Abgleich PH, Herstellerfragen","detail":"KI (Claude Code) hat am 22.11.2026 das PH V1.2 und die Cockpit-Daten gelesen. Sie hat die Sensordatenblätter im Archiv ausgewertet (Micro-Epsilon Katalog S. 12–13, 17, 23; Keyence LS-9030; RIFTEK Handbuch Kap. 6.1) und im Netz recherchiert (AIAG-MSA-Kriterien, weitere Hersteller; Downloads gesperrt). Erstellt hat sie die Projektdateien Analyse_Toleranz_GRR, Analyse_Sensorik_Messprinzip, Analyse_MorphKasten_Bewertungskriterien, Analyse_Abgleich_PH_Cockpit und Entwurf_Herstellerfragen (alle 2026-11-22) sowie 20 Postfach-Vorschläge, dazu eine Prüftabelle der 11 offenen Fragen aus dem Statusbericht (Abschnitt 5). Fachlicher Text: %GRR-Rechnung mit Szenarien, Umrechnung der Herstellerangaben (σ, Mittelungszeit, Messzeit), Schätzung ohne Mittelung, Vergleichskriterien Messprinzip, Lückenanalyse Morphologischer Kasten, Kriterienliste, Fragenkatalog an Hersteller. Korrektur zweier Aussagen im Statusbericht (Linearität gegen %GRR; 2D-Schattenbild und Zylinderform).","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:58.274Z","fach":true,"who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mws03v9atb2vf"},{"id":"pv-ent-platzbedarf","kind":"entscheidung","title":"Frage an den Betrieb: Max. Platzbedarf L × B (Anf. 5.1)","detail":"PH V1.2 Anf. 5.1 ist eine Wunschanforderung mit dem Wert „offen“ (gelb, mit dem Betreuer abzustimmen). Bei 3 m Rohrlänge und einer Konstruktion mit verfahrendem Sensor kann die Anlage etwa doppelt so lang werden wie das Rohr (laut Morphologischem Kasten TF4). Ein Richtwert hilft bei der Variantenbewertung am 11.12.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:26.598Z","fach":false,"who":"Janek Bauer","ask":"Paul Baidinger","due":"2026-12-04","prio":"2","stand":"offen","ziel":"tasks/mws036tc9t7sl"},{"id":"pv-ent-lieferpruefprotokolle","kind":"entscheidung","title":"Frage an den Betrieb: Wird die Messanlage für die Abnahme gebraucht, solange Lieferprüfprotokolle fehlen?","detail":"PH V1.2 Problemstellung (sinngemäß): Bei einem der NiTi-Rohre dürfen die Prüfprotokolle des Lieferanten bis zu zwei Wochen nach der Lieferung nachgereicht werden; bei der Wareneingangsprüfung fehlen dann die Messwerte. Zu klären: Soll die Anlage in diesem Fall die Abnahme allein tragen (dann zählen Taktzeit, Dokumentation und Rückverfolgbarkeit stärker) oder nur ergänzend prüfen? Wirkt auf die Bewertungskriterien (4.1) und auf die QM-Frage pv-ent-qm-pruefmittel.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:37:37.637Z","fach":false,"who":"Janek Bauer","ask":"Simon Hochstuhl; QM, Paul Baidinger","due":"2026-12-11","prio":"3","stand":"offen","ziel":"tasks/mws03fc1j46hk"},{"id":"pv-sensor-lsm501s","kind":"daten","coll":"sensor ssfeld, 5 Abtastrate, 6 Messachsen, 7 Bauform, 8 Trigger/Encoder, 9 Lichtquelle/Laserklasse. Zusätzlich: Werte für Ø 1 mm und ohne Mittelung (siehe Entwurf Herstellerfragen).","url":"https://www.marposs.com/eng/product/xls-laser-micrometer"},"ziel":"sensors/mws0ln0abedtb"},{"id":"pv-kilog-2026-11-22-sensoren-offen","kind":"kilog","title":"KI-Hilfe: drei Sensor-Kandidaten als offene Vorschläge","detail":"KI (Claude Code) hat am 22.11.2026 drei Sensor-Kandidaten aus der Web-Suche als Vorschläge für den Sensorvergleich angelegt (Mitutoyo LSM-501S, LSM-503S, Aeroel XLS13XY). Hersteller, Modell, Prinzip und Link zum Datenblatt sind eingetragen, die Messwerte sind leer, weil das Datenblatt nicht eingesehen ist. Die Liste der offenen Punkte ist ergänzt.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T15:51:45.015Z","fach":false,"ziel":"kilog/mws0ll6eekuxu"},{"id":"pv-kilog-2026-11-22-datenblaetter","kind":"kilog","title":"KI-Hilfe: Datenblätter Mitutoyo und Aeroel ausgewertet, Sensorvergleich ergänzt","detail":"KI (Claude Code) hat am 22.11.2026 die von Janek gelieferten Datenblätter ausgewertet: Mitutoyo Bulletin 2101 (LSM-501S, -503S, -506S, -512S, -516S, -6902H/6900, -9506) und Aeroel XLS13XY/XLS35XY D00105_D rev. 2,2. Sie hat 11 Sensoren mit allen 9 Punkten und Seitenangaben in den Sensorvergleich eingetragen und die Archiv-Einträge angelegt. Bei allen 26 vorhandenen Sensoren hat sie Notizen ergänzt: Umrechnung auf σ, Vergleich mit den Szenarien A–C, offene Fragen. Außerdem hat sie die Linearität ODC1200/1201 aus dem Katalog zugeordnet und bei RIFTEK die Bedingung ergänzt. Fachlicher Text: Bewertungsnotizen je Sensor.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T16:05:44.603Z","fach":true,"ziel":"kilog/mws13l08urlwl"},{"id":"pv-ent-bewertungsmatrix","kind":"entscheidung","title":"KI-Vorschlag: Bewertungsmatrix neu fassen (8 Kriterien aus PH V1.2, K.-o. getrennt)","detail":"Recherche (Quellen und Einordnung in projekt/Analyse_Bewertungskriterien_Recherche_2026-11-22.md). Vorschlag: K1 Reserve Wiederholgenauigkeit zur %GRR-Grenze (PH 2.4); K2 Eignung Messpunktdichte 2 mm (2.3); K3 Reserve bei Lageabweichung (3.3); K4 Messgeschwindigkeit je Rohr (4.1); K5 Integration in Auswertung und Steuerung (4.2); K6 Platzbedarf (5.1); K7 Eignung Tantal (1.5); K8 Zusatzprüfung Rauheit/Beschädigung (2.6, 2.7). Herstellkosten bewusst nicht als Kriterium, weil sie über die wirtschaftliche Wertigkeit getrennt bewertet werden. Festanforderungen 1.1–4.2 bleiben als K.-o.-Filter. Offen: Gewichtung (paarweiser Vergleich, 2/1/0), Skala 0–4 oder 0–10, Reduktion auf 6 Kriterien. Belegstand: Methode durch zwei Quellen bestätigt; konkrete Kriterien aus dem PH; VDI 2225 Blatt 3 nicht lesbar. Dieser Vorschlag ersetzt pv-daten-eval. ÜBERHOLT 22.11.: siehe pv-ent-bewertungskriterien (Festanforderungen 2.5, 3.3 und 4.2 sind K.-o., nicht gewichtet).","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:29:39.000Z","fach":true,"who":"Janek Bauer","ask":"","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mws7asp994y7m"},{"id":"pv-kilog-2026-11-22-bewertungskriterien","kind":"kilog","title":"KI-Hilfe: Recherche Bewertungskriterien und Vorschlag Bewertungsmatrix","detail":"KI (Claude Code) hat am 22.11.2026 im Netz zu Nutzwertanalyse, Bewertungskriterien und Messmittelauswahl recherchiert (sechs Suchen, drei Seiten-Abrufe, zwei davon gesperrt). Die Methode wurde mit zwei Quellen geprüft. Erstellt: projekt/Analyse_Bewertungskriterien_Recherche_2026-11-22.md und der Vorschlag pv-ent-bewertungsmatrix. Fachlicher Text: Auswahl und Formulierung der acht Bewertungskriterien, Belegeinstufung.","fach":true,"vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T18:59:20.262Z","who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mws7ats0iu6xy"},{"id":"pv-ent-drehung-stationen","kind":"entscheidung","title":"Frage an den Betrieb: Darf das Rohr an jeder Messstation gedreht werden (ohne Helix)?","detail":"Das Schattenbild liefert bei 360°-Drehung die Breiten je Winkel, daraus Ø max − Ø min je Längenposition. Frage: Ist Drehen an festen Stationen zulässig, obwohl Anf. 2.3 keine Helixabtastung vorsieht? Schätzung: mit 2D-Sensor ca. 9–12 min je Rohr, mit 1D-Sensor (ODC2700) ca. 75 min je Rohr. Wirkt auf Taktzeit (4.1) und Sensorwahl. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Nachtrag (2).","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:31:40.711Z","fach":true,"who":"Janek Bauer","ask":"Paul Baidinger","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mwsalktha73um"},{"id":"pv-kilog-2026-11-22-drehung","kind":"kilog","title":"KI-Hilfe: Analyse Drehung des Rohres und Schattenbild, Korrektur Messzeit","detail":"KI (Claude Code) hat auf Janeks Frage geantwortet, ob ein 2D-Schattenbild bei 360°-Drehung die Zylinderform liefert. Ergebnis als Nachtrag (2) in projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md und als Frage pv-ent-drehung-stationen. Fachlicher Text: Herleitung, Winkelauflösung je Sensor, Stationszahl und Schätzung der Zeit, Korrektur der früheren Messzeit.","fach":true,"vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:32:09.825Z","who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mwsam7a81g535"},{"id":"pv-ent-oberwellen","kind":"entscheidung","title":"Frage an QM und Betrieb: Welche Formoberwellen müssen erkannt werden (Winkelauflösung)?","detail":"Für Zylinderform je 2-mm-Punkt ohne Helix bestimmt die höchste relevante Oberwelle den nötigen Winkelschritt: Δφ ≤ 51,6°/n (Annahme: 10 µm Amplitude, 1 µm Fehler). Bis n = 6 genügen 5°-Schritte, darüber 2,5° oder feiner. Bitte: welche Ordnungen (Oval, Dreieck, höhere) sind bei NiTi und Edelstahl realistisch und in der Toleranz relevant? Davon hängen Bildrate (RF657 24/s, RF656 50/s mit SuM), Drehzeit und Taktzeit (4.1) ab. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Nachtrag (3).","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:32:04.498Z","fach":true,"who":"Janek Bauer","ask":"Simon Hochstuhl; QM, Paul Baidinger","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mwsam367j93y8"},{"id":"pv-kilog-2026-11-22-bildrate","kind":"kilog","title":"KI-Hilfe: Bildrate und Winkelschritt bei Drehung ohne Helix","detail":"KI (Claude Code) hat auf Janeks Hinweis (keine Helix, Zylinderform je 2-mm-Punkt) die nötige Bildrate und den Winkelschritt hergeleitet: Formfehler durch Abtastung, Bildrate je Drehzeit, Auslösung über Drehgeber, Stationszeit. Ergebnis als Nachtrag (3) in der Sensorik-Analyse und als Frage pv-ent-oberwellen. Fachlicher Text: Herleitung Winkelschritt, Tabellen, Korrektur der Bildrate des RF656.2D (50/s mit SuM).","fach":true,"vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:32:10.123Z","who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mwsam7ii0eom8"},{"id":"pv-ent-taktampel","kind":"entscheidung","title":"Bestätigen: Taktzeit-Ampel und Entfallen der Sensoren über 5 min","detail":"Janeks Vorgabe: Taktzeit über 5 min je 3-m-Rohr = entfällt; 1 bis 5 min = gelb; unter 1 min = grün; 1501 Prüfstellen. Modellrechnung (projekt/Analyse_Taktzeit_Ampel_2026-11-22.md): Ergebnis unter Annahmen (Drehung je Station 3 s, 5°-Schritte): kein grüner Sensor, alle 1D-Sensoren rot (ca. 88 min), RF657R rot, RF656/657 mit 8×10 bis 25×35 rot, nur RF656.2D-40x50, RF657.2D-40x50 und RF657.2D-60x80 gelb. Die roten Sensoren stehen nur im Kasten „Entfallen“, nichts ist gelöscht. Bitte bestätigen, dass dies so bleibt; die Annahmen (Drehung je Station, 5°-Schritte) müssen vorher geklärt sein (pv-ent-drehung-stationen, pv-ent-oberwellen). KORREKTUR 22.11.: Der Servo dreht durchgehend (kein Bremsen je Station). Neu: Umdrehung = 72 Bilder ÷ Bildrate, Station = Umdrehung + 0,5 s Verfahrachse. Damit RF656.2D-40x50, 25x35 und 15x20 gelb (1,9 / 2,8 / 4,8 min), 8x10 rot; RF657 unverändert. Die frühere Liste mit RF656 als rot gilt nicht mehr. Details: projekt/Analyse_Taktzeit_Ampel_2026-11-22.md, Korrektur. NEUE RECHNUNG 22.11. (Nachtrag 4 in projekt/Analyse_Taktzeit_Ampel_2026-11-22.md): LS-9030 kommt bei 0,5 s Achsstopp auf 15,7 min, bei 0,1 s auf 5,7 min, bei 0,05 s auf 4,5 min. Unter 3 min ist er mit der Rep-Bedingung (2048-fache Mittelung = 3,2 min allein) nicht möglich. Entscheidung: Wert für den Achsstopp je Messpunkt festlegen (0,5 / 0,1 / 0,05 s).","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:31:06.901Z","fach":true,"who":"Janek Bauer","ask":"","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mwsakuqb7ac5v"},{"id":"pv-auf-dubletten-sensoren","kind":"aufgabe","title":"Doppelte Sensoren aus der Web-Suche bereinigen (mws0ln0abedtb, mws0lnc4mbahq, mws0lnnai0kol)","detail":"Drei Einträge sind doppelt: XLS13XY (zu xls13xy-1500), LSM-501S (zu lsm-501s), LSM-503S (zu lsm-503s). Sie entstanden bei der Übernahme der Postfach-Vorschläge. Im Sensorvergleich stehen sie im Kasten „Entfallen“. Vorschlag: Die drei Datensätze im Cockpit löschen oder nach _Versionen verschieben (dort nicht endgültig löschen). ERLEDIGT 22.11.: Die drei Dubletten sind nach cockpit/daten/_Versionen/sensors_dubletten_2026-11-22.json verschoben (nicht gelöscht) und aus der Sensorliste genommen.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:11:51.000Z","fach":false,"who":"Janek Bauer","ask":"","due":"2026-12-04","prio":"2","stand":"offen"},{"id":"pv-kilog-2026-11-22-taktampel","kind":"kilog","title":"KI-Hilfe: Taktzeit-Modell und Ampel im Sensorvergleich","detail":"KI (Claude Code) hat je Sensor die Taktzeit je 3-m-Rohr modelliert (1501 Prüfstellen, Drehung je Station, 5°-Schritte) und die Ampel in den Sensorvergleich gebaut. Ergebnis und Annahmen: projekt/Analyse_Taktzeit_Ampel_2026-11-22.md. Fachlicher Text: Modellrechnung, Einstufung der Sensoren, Annahmen.","fach":true,"vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:32:11.136Z","who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mwsam8an9loxs"},{"id":"pv-kilog-2026-11-22-servo","kind":"kilog","title":"KI-Hilfe: Korrektur Taktzeitmodell (durchgehend drehender Servo)","detail":"KI (Claude Code) hat auf Janeks Hinweis das Taktzeitmodell korrigiert: Der Servo bremst nicht; Umdrehungszeit = Bilder je Umdrehung ÷ Bildrate; Station = Umdrehung + Verfahrachse. Die Ampel im Sensorvergleich ist entsprechend neu gesetzt. Fachlicher Text: Modellkorrektur und neue Einstufung der RIFTEK-Sensoren.","fach":true,"vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:32:10.451Z","who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mwsam7rmcch1c"},{"id":"pv-kilog-2026-11-22-taktneu","kind":"kilog","title":"KI-Hilfe: Taktzeit aller Sensoren neu gerechnet, Dubletten verschoben","detail":"KI (Claude Code) hat auf Janeks Hinweis alle Sensoren mit durchgehend drehendem Rohr neu durchgerechnet (Mittelung nach Rep-Bedingung, Achsstopp 0,5/0,1/0,05 s), die Ampel aktualisiert und die drei Dubletten nach _Versionen verschoben. Ergebnis: projekt/Analyse_Taktzeit_Ampel_2026-11-22.md, Nachtrag (4). Fachlicher Text: Modellrechnung, Einstufung, Hinweis zur Rep-Bedingung des LS-9030.","fach":true,"vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:32:10.778Z","who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mwsam80pdrf7m"},{"id":"pv-ent-bewertungskriterien","kind":"aufgabe","title":"Bewertungskriterien: 6 aus dem Pflichtenheft übernehmen, 2 Vorschläge prüfen","detail":"Abgleich mit PH V1.2 (projekt/Analyse_Bewertungskriterien_PH-Abgleich_2026-11-22.md). Gewichtet, aus dem PH: 2.4 %GRR-Reserve (M), 1.5 Tantal (W), 2.6 Rauheit (W), 2.7 Beschädigung (W), 4.1 Taktzeit (W, über 5 min entfällt), 5.1 Platzbedarf (W). Vorschläge aus der Recherche: A Kalibrier- und Nachweisaufwand gering (Prüfmittelmanagement, Q1); B Umrüstaufwand für Rohr-Ø 1–6,5 mm gering (Q1). Nicht übernommen: 2.3 (binär, K.-o.), Kosten (separate wirtschaftliche Wertigkeit), Bedienaufwand und Auflösung-Faustregel (nicht belegt bzw. Doppelung). Umsetzung im Cockpit: Knopf „Kriterien aus Pflichtenheft übernehmen“ im Abschnitt Bewertung (ersetzt die Liste; Punkte an gleich bleibenden Kriterien bleiben). Vorschläge A und B ggf. mit „+“ ergänzen. Entscheiden: Vorschläge A/B ja/nein, Gewichtung.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:31:29.908Z","fach":true,"who":"Janek Bauer","ask":"","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mwsalchdi0wa9"},{"id":"pv-kilog-2026-11-22-kriterien-ph","kind":"kilog","title":"KI-Hilfe: Abgleich Bewertungskriterien mit PH V1.2 und Vorschläge","detail":"KI (Claude Code) hat die Bewertungskriterien mit der Anforderungsliste PH V1.2 abgeglichen (Tantal ist dort 1.5, nicht 1.2), die gewichtbaren Anforderungen herausgefiltert und zwei Vorschläge aus der Internetrecherche ergänzt. Ergebnis: projekt/Analyse_Bewertungskriterien_PH-Abgleich_2026-11-22.md. Umbau im Cockpit: Übernahme-Knopf mit PH-Liste. Fachlicher Text: Auswahl und Begründung der Kriterien, Belegstand der Vorschläge.","fach":true,"vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T20:32:09.386Z","who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mwsam6y03l66t"},{"id":"pv-ent-drehzahl-rohr","kind":"entscheidung","title":"Welche Drehzahl verträgt ein 3-m-Rohr (Ø 1–6,5 mm) beim Messen?","detail":"Deep Research (projekt/reports/Berührungslose Sensoren für drehende Rohre.md): Unter 5 min je Rohr braucht man bei Drehung je Prüfstelle und 0,1 s Achsstopp mindestens ca. 600 1/min, bei 0,05 s ca. 400 1/min (eigene Rechnung). 1D-Sensoren ohne Mittelung setzen 400 bis über 10.000 1/min voraus. 2D-Bildsensoren (RIFTEK, Keyence TM-X) brauchen nur 20–42 1/min. Die zulässige Drehzahl (Schwingung, Durchbiegung, Lagerung) entscheidet, welche Sensorfamilie überhaupt in Frage kommt.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T22:05:25.408Z","fach":true,"who":"Janek Bauer","ask":"Paul Baidinger","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mwsdy4v13v962"},{"id":"pv-auf-datenblaetter-deep-research","kind":"aufgabe","title":"Datenblätter der 32 neuen offenen Sensoren beschaffen (Priorität siehe Bericht)","detail":"Alle Werte der neuen Sensoren stammen nur aus Suchergebnissen, weil die Herstellerseiten in der Sitzung gesperrt waren (u. a. keyence.com, micro-epsilon.com, riftek.com, zumbach.com, sikora.net, nordson.com, laserlinc.com, precitec.com, mahr.com). Priorität laut Bericht Abschnitt 5: Keyence TM-X5040/5065, Aeroel XLS13XY (vorhanden), Nordson AccuScan 6012, Zumbach ODAC 13TRIO/14XY, Sikora LASER PRO 13 XY, Micro-Epsilon ODC2600 und confocalDT IFC2466. Ablage unter docs/archiv/6 Recherche Messtechnik/.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T22:04:18.522Z","fach":false,"who":"Janek Bauer","ask":"","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mwsdwp95uebas"},{"id":"pv-kilog-2026-11-22-deep-research-sensoren","kind":"kilog","title":"KI-Hilfe: Deep Research zu berührungslosen Sensoren für drehende Rohre","detail":"KI (Claude Code) hat eine Deep Research in fünf Sensorfamilien durchgeführt (Laser-Scan, Schatten/LED, 2D-Bild/telezentrisch, Punktsensoren, Rohrmesssysteme), einen Bericht mit Taktzeitrechnung erstellt (projekt/reports/Berührungslose Sensoren für drehende Rohre.md) und 32 neue Sensoren mit Werten, Quellen und Taktzeit in die Liste „Offen“ im Sensorvergleich eingetragen. Fachlicher Text: Bericht, Taktzeitrechnung, Einstufung der Sensoren.","fach":true,"vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T22:05:48.448Z","who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mwsdymn2rd0su"},{"id":"pv-ent-querschnitt-fenster","kind":"entscheidung","title":"Frage an den Betrieb: Ist ein „Querschnitt“ eine ebene Schnittfläche oder ein Abschnitt von bis zu 2 mm?","detail":"Unter 1 min je Rohr geht nur ohne Anhalten (Helix, Mehrachskopf, drehender Kopf). Dabei wird ein Querschnitt aus einem kurzen Längenfenster zusammengesetzt. Zulässig ist das nur, wenn ein Fenster bis 2 mm als Querschnitt gilt (Anf. 2.3). Quelle: projekt/reports/Messstrategien Rohr unter einer Minute.md.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T22:04:55.772Z","fach":true,"who":"Janek Bauer","ask":"Paul Baidinger","due":"2026-12-04","prio":"1","stand":"offen","ziel":"tasks/mwsdxhztyuziu"},{"id":"pv-ent-taktzeit-umfang","kind":"entscheidung","title":"Was zählt zur Taktzeit (mit oder ohne Einlegen und Entnehmen)?","detail":"Die Rechnungen gelten nur für die Messbewegung. Für die Bewertung der Strategien muss klar sein, ob Einlegen, Entnehmen und Kalibrieren in der Taktzeit (Anf. 4.1) enthalten sind. Quelle: projekt/reports/Messstrategien Rohr unter einer Minute.md.","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T22:05:13.250Z","fach":true,"who":"Janek Bauer","ask":"Paul Baidinger","due":"2026-12-04","prio":"2","stand":"offen","ziel":"tasks/mwsdxvhb4msjh"},{"id":"pv-kilog-2026-11-22-messstrategien","kind":"kilog","title":"KI-Hilfe: Deep Research Messstrategien unter 1 Minute","detail":"KI (Claude Code) hat in vier Recherchen (Kinematik, physikalische Grenzen, flächige Verfahren, Normen und Praxis) untersucht, ob ein 3-m-Rohr mit Querschnitten alle 2 mm in unter 1 min gemessen werden kann, und einen Bericht mit Rechnungen erstellt (projekt/reports/Messstrategien Rohr unter einer Minute.md). Fachlicher Text: Strategievergleich, Rechnungen zu Drehzahl, Vorschub, Stützabstand und Achsfehlern, Entscheidungsliste.","fach":true,"vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-22","updated":"2026-11-22T22:05:45.561Z","who":"","ask":"","due":"","prio":"1","stand":"offen","ziel":"kilog/mwsdykevk0oku"},{"id":"p-001","kind":"daten","coll":"tasks","docId":"mwruxuhc1lgix","title":"Ändern: tasks – Automatisierungsgrad","detail":"Status: erledigt → entschieden (Entscheidungen gelten als „entschieden“, nicht „erledigt“; siehe Bericht Speichermodell).","vorschlag":"KI (Claude Code)","status":"übernommen","date":"2026-11-23","stand":"2026-11-23","ziel":"tasks/mwruxuhc1lgix","alt":{"typ":"entscheidung","title":"Automatisierungsgrad","note":"Automatisierungsgrad bestätigen (manuell einlegen, Messen und Auswerten automatisch)","who":"Janek Bauer","due":"2026-11-13","prio":"1","status":"erledigt","by":"Paul Baidinger","reason":"manuell einlegen, Messen und Auswerten automatisch","date":"2026-11-06","source":"","docs":"","refs":"","topic":"","ask":"Paul Baidinger","updated":"2026-11-22T13:13:19.248Z"},"payload":{"typ":"entscheidung","title":"Automatisierungsgrad","note":"Automatisierungsgrad bestätigen (manuell einlegen, Messen und Auswerten automatisch)","who":"Janek Bauer","due":"2026-11-13","prio":"1","status":"entschieden","by":"Paul Baidinger","reason":"manuell einlegen, Messen und Auswerten automatisch","date":"2026-11-06","source":"","docs":"","refs":"","topic":"","ask":"Paul Baidinger","updated":"2026-11-22T13:13:19.248Z"},"loeschen":false},{"id":"p-002","kind":"daten","coll":"tasks","docId":"mwruyjjigicgg","title":"Ändern: tasks – Werkstoffe Nitinol, Edelstahl und Tantal","detail":"Status: erledigt → entschieden (Entscheidungen gelten als „entschieden“, nicht „erledigt“; siehe Bericht Speichermodell).","vorschlag":"KI (Claude Code)","status":"übernommen","d date":"2026-11-24","stand":"2026-11-24","ziel":"tasks/mwsalktha73um","alt":{"title":"Frage an den Betrieb: Darf das Rohr an jeder Messstation gedreht werden (ohne Helix)?","note":"Das Schattenbild liefert bei 360°-Drehung die Breiten je Winkel, daraus Ø max − Ø min je Längenposition. Frage: Ist Drehen an festen Stationen zulässig, obwohl Anf. 2.3 keine Helixabtastung vorsieht? Schätzung: mit 2D-Sensor ca. 9–12 min je Rohr, mit 1D-Sensor (ODC2700) ca. 75 min je Rohr. Wirkt auf die Sensorwahl. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Nachtrag (2).","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Paul Baidinger","entscheidung":"e-001","nr":"T-015"},"payload":{"title":"Darf das Rohr an jeder Messstation gedreht werden (ohne Helix)?","note":"Das Schattenbild liefert bei 360°-Drehung die Breiten je Winkel, daraus Ø max − Ø min je Längenposition. Frage: Ist Drehen an festen Stationen zulässig, obwohl Anf. 2.3 keine Helixabtastung vorsieht? Schätzung: mit 2D-Sensor ca. 9–12 min je Rohr, mit 1D-Sensor (ODC2700) ca. 75 min je Rohr. Wirkt auf die Sensorwahl. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Nachtrag (2).","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Paul Baidinger","entscheidung":"e-001","nr":"T-015","antwort":""},"loeschen":false,"updated":"2026-11-24T09:44:48.018Z"},{"id":"p-022","kind":"daten","coll":"tasks","docId":"mwsam367j93y8","title":"Ändern: tasks – Frage an QM und Betrieb: Welche Formoberwellen müssen erkann","detail":"title: Frage an QM und Betrieb: Welche Formoberwellen müssen erkannt werden (Winkela… → Welche Formoberwellen müssen erkannt werden (Winkelauflösung)?\nantwort: – → –","vorschlag":"Janek (Web)","status":"übernommen","date":"2026-11-24","stand":"2026-11-24","ziel":"tasks/mwsam367j93y8","alt":{"title":"Frage an QM und Betrieb: Welche Formoberwellen müssen erkannt werden (Winkelauflösung)?","note":"Für Zylinderform je 2-mm-Punkt ohne Helix bestimmt die höchste relevante Oberwelle den nötigen Winkelschritt: Δφ ≤ 51,6°/n (Annahme: 10 µm Amplitude, 1 µm Fehler). Bis n = 6 genügen 5°-Schritte, darüber 2,5° oder feiner. Bitte: welche Ordnungen (Oval, Dreieck, höhere) sind bei NiTi und Edelstahl realistisch und in der Toleranz relevant? Davon hängen Bildrate (RF657 24/s, RF656 50/s mit SuM), Drehzeit ab. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Nachtrag (3).","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Simon Hochstuhl; QM, Paul Baidinger","entscheidung":"e-001","nr":"T-016"},"payload":{"title":"Welche Formoberwellen müssen erkannt werden (Winkelauflösung)?","note":"Für Zylinderform je 2-mm-Punkt ohne Helix bestimmt die höchste relevante Oberwelle den nötigen Winkelschritt: Δφ ≤ 51,6°/n (Annahme: 10 µm Amplitude, 1 µm Fehler). Bis n = 6 genügen 5°-Schritte, darüber 2,5° oder feiner. Bitte: welche Ordnungen (Oval, Dreieck, höhere) sind bei NiTi und Edelstahl realistisch und in der Toleranz relevant? Davon hängen Bildrate (RF657 24/s, RF656 50/s mit SuM), Drehzeit ab. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Nachtrag (3).","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Simon Hochstuhl; QM, Paul Baidinger","entscheidung":"e-001","nr":"T-016","antwort":""},"loeschen":false,"updated":"2026-11-24T09:46:10.959Z"},{"id":"p-023","kind":"daten","coll":"tasks","docId":"mwsdwp95uebas","title":"Ändern: tasks – Datenblätter der 32 neuen offenen Sensoren beschaffen (Prior","detail":"title: en","coll":"tasks","docId":"mwsdxhztyuziu","title":"Ändern: tasks – Frage an den Betrieb: Ist ein „Querschnitt“ eine ebene Schni","detail":"title: Frage an den Betrieb: Ist ein „Querschnitt“ eine ebene Schnittfläche oder ein… → Ist ein „Querschnitt“ eine ebene Schnittfläche oder ein Abschnitt von bis zu …\nantwort: – → –","vorschlag":"Janek (Web)","status":"übernommen","date":"2026-11-24","stand":"2026-11-24","ziel":"tasks/mwsdxhztyuziu","alt":{"title":"Frage an den Betrieb: Ist ein „Querschnitt“ eine ebene Schnittfläche oder ein Abschnitt von bis zu 2 mm?","note":"Unter 1 min je Rohr geht nur ohne Anhalten (Helix, Mehrachskopf, drehender Kopf). Dabei wird ein Querschnitt aus einem kurzen Längenfenster zusammengesetzt. Zulässig ist das nur, wenn ein Fenster bis 2 mm als Querschnitt gilt (Anf. 2.3). Quelle: projekt/reports/Messstrategien Rohr unter einer Minute.md.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Paul Baidinger","entscheidung":"e-001","nr":"T-018"},"payload":{"title":"Ist ein „Querschnitt“ eine ebene Schnittfläche oder ein Abschnitt von bis zu 2 mm?","note":"Unter 1 min je Rohr geht nur ohne Anhalten (Helix, Mehrachskopf, drehender Kopf). Dabei wird ein Querschnitt aus einem kurzen Längenfenster zusammengesetzt. Zulässig ist das nur, wenn ein Fenster bis 2 mm als Querschnitt gilt (Anf. 2.3). Quelle: projekt/reports/Messstrategien Rohr unter einer Minute.md.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Paul Baidinger","entscheidung":"e-001","nr":"T-018","antwort":""},"loeschen":false,"updated":"2026-11-24T09:46:10.478Z"},{"id":"p-025","kind":"daten","coll":"tasks","docId":"mwsdy4v13v962","title":"Ändern: tasks – Welche Drehzahl verträgt ein 3-m-Rohr (Ø 1–6,5 mm) beim Mes  Aufl. (Tab. II-D 1, S. 78; Seite nur aus einer Sekundärquelle) gilt %GRR = 6·σ/T ≤ 10 %, also σ_GRR ≤ 0,1·T/6. Eigene Rechnung: Szenario A, Ø ± 13 µm (T = 26 µm): σ ≤ 0,43 µm. Szenario B, Zylinderform 10 µm (früherer NiTi-Wert, nur Platzhalter): σ ≤ 0,17 µm. Szenario C, 25 µm (früherer Edelstahl-Wert, nur Platzhalter): σ ≤ 0,42 µm. Zu klären: (1) Toleranzwerte je Werkstoff mit dem QM; (2) welche Toleranzbreite bei der einseitigen Zylinderform (nur Obergrenze) gilt; (3) welches Szenario bis zur Klärung als Arbeitsannahme dient. Hinweis: Die Zylinderform ist eine Differenz zweier Werte; bei unabhängigen Werten gilt σ_Diff = √2·σ (Annahme). Ersetzt den Toleranzteil der Entscheidung „Zylinderform“. Details: projekt/Analyse_Toleranz_GRR_2026-11-22.md","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-11-27","by":"","reason":"","topic":"","docs":"","refs":"","typ":"entscheidung","ask":"Simon Hochstuhl; QM, Paul Baidinger","nr":"E-008"},"payload":{"title":"Toleranzwerte Zylinderform (NiTi, Edelstahl) und Bezug der %GRR-Grenze festlegen","note":"PH V1.2 Anf. 2.1 führt die Toleranzen NiTi und Edelstahl als [?]. Nach Anf. 2.4 und AIAG MSA 4. Aufl. (Tab. II-D 1, S. 78; Seite nur aus einer Sekundärquelle) gilt %GRR = 6·σ/T ≤ 10 %, also σ_GRR ≤ 0,1·T/6. Eigene Rechnung: Szenario A, Ø ± 13 µm (T = 26 µm): σ ≤ 0,43 µm. Szenario B, Zylinderform 10 µm (früherer NiTi-Wert, nur Platzhalter): σ ≤ 0,17 µm. Szenario C, 25 µm (früherer Edelstahl-Wert, nur Platzhalter): σ ≤ 0,42 µm. Zu klären: (1) Toleranzwerte je Werkstoff mit dem QM; (2) welche Toleranzbreite bei der einseitigen Zylinderform (nur Obergrenze) gilt; (3) welches Szenario bis zur Klärung als Arbeitsannahme dient. Hinweis: Die Zylinderform ist eine Differenz zweier Werte; bei unabhängigen Werten gilt σ_Diff = √2·σ (Annahme). Ersetzt den Toleranzteil der Entscheidung „Zylinderform“. Details: projekt/Analyse_Toleranz_GRR_2026-11-22.md","source":"KI (Claude Code)","date" , AS V4.3","refs":"","topic":"","ask":"Paul Baidinger","entscheidung":"mwruykcaqi0bj","nr":"T-005","updated":"2026-11-24T18:42:53.846Z"},{"id":"mwruy7jmo06ve","title":"PH-Freigabe: Datum im PH klären","note":"PH V8.7 Kap. 3 nennt 06.11.2026 als Freigabe. Festgelegt ist laut Cockpit die Unterschrift am 27.11. (Festlegung 20.11.).","source":"","date":"2026-11-20","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"entscheidung","ask":"Paul Baidinger","updated":"2026-11-22T13:13:36.178Z","nr":"E-003"},{"id":"mwruy9eersqb9","title":"Projektabschluss: Datum im PH klären","note":"PH V8.7 Kap. 3 nennt 26.02.2027, Cockpit nennt 05.03.2027 als Übergabe und Projektabschluss.","source":"","date":"2026-11-20","status":"offen","prio":"2","who":"Janek Bauer","due":"2026-11-27","by":"","reason":"","topic":"","docs":"","refs":"","typ":"entscheidung","ask":"Paul Baidinger","updated":"2026-11-22T13:13:38.582Z","nr":"E-004"},{"id":"mwruycvkk2urx","typ":"entscheidung","title":"Taktzeit pro Rohr","note":" Gibt es einen groben Richtwert für die Taktzeit pro Rohr?","who":"Janek Bauer","due":"2026-12-04","prio":"1","status":"offen","by":"","reason":"","date":"2026-11-20","source":"Frage an den Betrieb","docs":"","refs":"","topic":"","updated":"2026-11-22T13:13:43.088Z","ask":"Paul Baidinger","nr":"E-005"},{"id":"mwruyef4g4mwo","title":"Variantenauswahl: Datum im PH klären","note":"PH V8.7 Kap. 3 nennt 04.12.2026, Cockpit und Festlegung vom 18.11. nennen 11.12.2026. Das PH muss angepasst oder die Festlegung geprüft werden.","source":"","date":"2026-11-20","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-11-27","by":"","reason":"","topic":"","docs":"","refs":"","typ":"entscheidung","ask":"Paul Baidinger","updated":"2026-11-22T13:13:45.088Z","nr":"E-006"},{"id":"mwruykcaqi0bj","typ":"entscheidung","title":"Zylinderform","note":"Welche Messgröße und Definition gilt (Formel Ø max − Ø min passt nicht mehr; Zylindrizität nach ISO 1101?) und welche Toleranzen je Werkstoff (i.O./n.i.O. je Messpunkt) legt das QM fest?","who":"Janek Bauer","due":"2026-11-27","prio":"1","status":"offen","by":"","reason":"","date":"2026-11-20","source":"","docs":"","refs":"","topic":"Anf. 2.1 · bis 27.11.2026","ask":"Simon Hochstuhl; QM, Paul Baidinger","updated":"2026-11-22T13:13:52.762Z","nr":"E-007"},{"id":"mwrzrgiia4qvm","title":"Vorgaben ISO 13485 für ein neues Prüfmittel im Wareneingang","note":"PH V0.2 Kap. 5.3: Die Vorgaben aus dem QM-System (ISO 13485) für ein neues Prüfmittel werden im Projektverlauf mit dem QM geklärt. Bisher gibt es dafür keinen Cockpit-Eintrag. Zu klären: Welche Nachweise braucht das QM schon im Konzept (z. B. Messunsicherheitsbudget, Kalibrierbarkeit, Einstellmeister), da eine MFU am realen System abgegrenzt ist (PH Kap. 4)? Hängt mit dem früheren Widerspruch w11 (%GRR gegen Abgrenzung) zusammen.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"2","who":"Janek Bauer","due":"2026-12-11","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Simon Hochstuhl; QM, Paul Baidinger","nr":"T-006","entscheidung":"","antwort":"","updated":"2026-11-24T09:48:46.311Z"},{"id":"mwrzs399nkva2","title":"Mittelwerte unzulässig“ auch die Mittelung im Sensor an einem Messpunkt?","note":"Frage an den Betrieb: Verbietet Anf. 2.5 „Mittelwerte unzulässig“ auch die Mittelung im Sensor an einem Messpunkt? Alle Herstellerwerte zur Wiederholgenauigkeit gelten nur mit starker Mittelung am ruhenden Normal: Keyence LS-9030 ±0,1 µm (±2σ, 2048-fach, Datenblatt S. 1 Fn. *2); Micro-Epsilon ODC2700-10 ≤ 0,03 µm (95 %, 1024 Werte, Katalog S. 13 Fn. 6). Eine grobe KI-Schätzung (weißes Rauschen, √N) ergibt ohne Mittelung für LS-9030 ca. 2,3 µm und für ODC2700-10 ca. 0,5 µm. Das ist zu viel für jedes Szenario. Frage: Meint 2.5 nur „nicht über mehrere Messpunkte oder die Rohrlänge mitteln“, oder auch „keine zeitliche Mittelung an einem Messpunkt“? Die Antwort entscheidet, ob ein Sensor die Anforderung 2.4 erfüllen kann. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Abschnitt 2.2","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Simon Hochstuhl; QM, Paul Baidinger","entscheidung":"mws03m2h7ngow","nr":"T-007","antwort":"","updated":"2026-11-24T09:42:04.792Z"},{"id":"mwrzsqvo6daky","title":"Toleranzwerte Zylinderform (NiTi, Edelstahl) und Bezug der %GRR-Grenze festlegen","note":"PH V1.2 Anf. 2.1 führt die Toleranzen NiTi und Edelstahl als [?]. Nach Anf. 2.4 und AIAG MSA 4. Aufl. (Tab. II-D 1, S. 78; Seite nur aus einer Sekundärquelle) gilt %GRR = 6·σ/T ≤ 10 %, also σ_GRR ≤ 0,1·T/6. Eigene Rechnung: Szenario A, Ø ± 13 µm (T = 26 µm): σ ≤ 0,43 µm. Szenario B, Zylinderform 10 µm (früherer NiTi-Wert, nur Platzhalter): σ ≤ 0,17 µm. Szenario C, 25 µm (früherer Edelstahl-Wert, nur Platzhalter): σ ≤ 0,42 µm. Zu klären: (1) Toleranzwerte je Werkstoff mit dem QM; (2) welche Toleranzbreite bei der einseitigen Zylinderform (nur Obergrenze) gilt; (3) welches Szenario bis zur Klärung als Arbeitsannahme dient. Hinweis: Die Zylinderform ist eine Differenz zweier Werte; bei unabhängigen Werten gilt σ_Diff = √2·σ (Annahme). Ersetzt den Toleranzteil der Entscheidung „Zylinderform“. Details: projekt/Analyse_Toleranz_GRR_2026-11-22.md","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-11-27","by":"","reason":"","topic":"","docs":"","refs":"","typ":"entscheidung","ask":"Simon Hochstuhl; QM, Paul Baidinger","nr":"E-008","optionen":"","konsequenzen":"","ersetzt":"","ersetzt_durch":"","grund_entfallen":"","updated":"2026-11-24T09:55:34.248Z"},{"id":"mws01drhm9osg","title":"Herstellerfragen prüfen","note":"Herstellerfragen prüfen und an Micro-Epsilon, Keyence und RIFTEK senden (Angebote anfragen) Entwurf: projekt/Entwurf_Herstellerfragen_2026-11-22.md (13 Fragen nach Anforderungen geordnet, mit Angebotsanfrage). Nicht versendet. Vor dem Versand prüfen, ob die Toleranzen genannt werden dürfen (vertraulich, nur sinngemäß). Angebote sind ein Ergebnis laut PH Kap. 3. Ziel: Antworten vor der Variantenauswahl am 11.12.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-11-27","by":"","reason":"","topic":"","docs":"","refs":"","chat":"","typ":"aufgabe","entscheidung":"mws03m2h7ngow","nr":"T-008","ask":"","antwort":"","updated":"2026-11-24T09:40:03.265Z"},{"id":"mws02ph5m3ds1","title":"Morphologischer Kasten","note":"Morphologischer Kasten: eigene Ideen ergänzen, Idee kennzeichnen, Lücken prüfen","source":"KI (Claude Code)","date":"2026-11-22","status":"in Arbeit","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","chat":"","typ":"aufgabe","nr":"T-010","ask":"","entscheidung":"","antwort":"","updated":"2026-11-24T19:56:48.648Z"},{"id":"mws036tc9t7sl","title":"Frage an den Betrieb: Max. Platzbedarf L × B (Anf. 5.1)","note":"PH V1.2 Anf. 5.1 ist eine Wunschanforderung mit dem Wert „offen“ (gelb, mit dem Betreuer abzustimmen). Bei 3 m Rohrlänge und einer Konstruktion mit verfahrendem Sensor kann die Anlage etwa doppelt so lang werden wie das Rohr (laut Morphologischem Kasten TF4). Ein Richtwert hilft bei der Variantenbewertung am 11.12.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"2","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Paul Baidinger","updated":"2026-11-22T15:37:26.592Z","nr":"T-011"},{"id":"mws03fc1j46hk","title":"Wird die Messanlage für die Abnahme gebraucht, solange Lieferprüfprotokolle fehlen?","note":"PH V1.2 Problemstellung (sinngemäß): Bei einem der NiTi-Rohre dürfen die Prüfprotokolle des Lieferanten bis zu zwei Wochen nach der Lieferung nachgereicht werden; bei der Wareneingangsprüfung fehlen dann die Messwerte. Zu klären: Soll die Anlage in diesem Fall die Abnahme allein tragen (dann zählen Dokumentation und Rückverfolgbarkeit stärker) oder nur ergänzend prüfen? Wirkt auf die Bewertungskriterien (4.1) und auf die QM-Frage pv-ent-qm-pruefmittel.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"3","who":"Janek Bauer","due":"2026-12-11","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Simon Hochstuhl; QM, Paul Baidinger","entscheidung":"mwruycvkk2urx","nr":"T-012","antwort":"","updated":"2026-11-24T09:48:46.795Z"},{"id":"mws03jxa2hz0e","title":"Zylinderform je Querschnitt oder über das ganze Rohr?","note":"Zylinderform je Querschnitt oder über das ganze Rohr? Wie viele Winkellagen? Das PH V1.2 (Kap. 5.3) definiert Zylinderform = Ø max − Ø min. Offen ist, worüber Ø max und Ø min gebildet werden: (a) je Messpunkt bzw. Querschnitt über den Umfang oder (b) über alle Messwerte des Rohres, dann einschließlich des Verlaufs über die Länge. Offen ist auch, wie viele Winkellagen je Querschnitt ausreichen. Laut PH misst der Lieferant bei NiTi an vier Punkten im Abstand von etwa 90° an einem Ende. Die Antwort bestimmt Messprinzip und Messzeit (Morphologischer Kasten TF3/TF4).","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Simon Hochstuhl; QM, Paul Baidinger","entscheidung":"mwruykcaqi0bj","nr":"T-013","antwort":"","updated":"2026-11-24T09:43:26.388Z"},{"id":"mws03m2h7ngow","title":"Entscheidungsgrundlage Messprinzip (Winkellagen und Längenerfassung)","note":"Ergebnis der Analyse: Ein 2D-Schattenbild (RIFTEK RF65x.2D) ist eine Projektion aus einer Richtung. Es liefert kein Ø max − Ø min über den Umfang. Auch das 2D-Prinzip braucht also mehrere Winkellagen. Die Entscheidung lautet daher nicht „ThruBeam oder 2D-Bild“. Zu entscheiden ist (1) wie die Winkellagen entstehen (TF3) und (2) wie viele Längenpositionen ein Messvorgang erfasst. Eigene Rechnung Messzeit bei 3 m und 2 mm (1501 Punkte), je Winkellage, ohne Verfahren und Drehen: LS-9030 mit voller Mittelung ≈ 192 s, ODC2700 ≈ 103 s, RF656.2D ≥ 23 s, RF657.2D ≥ 63 s. Vergleichskriterien und Quellen: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Abschnitt 4. Voraussetzung: pv-ent-zylinderform-bezug und pv-ent-mittelung. Korrigiert die Aussage im Statusbericht vom 22.11. (Abschnitt 4.2).","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-11","by":"","reason":"","topic":"","docs":"","refs":"","typ":"entscheidung","updated":"2026-11-22T19:51:03.958Z","ask":"Simon Hochstuhl; QM, Paul Baidinger","nr":"E-009"},{"id":"mws7asp994y7m","title":"Bewertungsmatrix neu fassen ","note":"","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"entscheidung","nr":"E-010","ask":"","optionen":"","konsequenzen":"","ersetzt":"","ersetzt_durch":"","grund_entfallen":"","updated":"2026-11-24T19:59:03.819Z"},{"id":"mwsalchdi0wa9","title":"Bewertungskriterien","note":"Bewertungskriterien: 5 aus dem Pflichtenheft übernehmen, 2 Vorschläge prüfen Abgleich mit PH V1.2 (projekt/Analyse_Bewertungskriterien_PH-Abgleich_2026-11-22.md). Gewichtet, aus dem PH: 2.4 %GRR-Reserve (M), 1.5 Tantal (W), 2.6 Rauheit (W), 2.7 Beschädigung (W), 5.1 Platzbedarf (W). Vorschläge aus der Recherche: A Kalibrier- und Nachweisaufwand gering (Prüfmittelmanagement, Q1); B Umrüstaufwand für Rohr-Ø 1–6,5 mm gering (Q1). Nicht übernommen: 2.3 (binär, K.-o.), Kosten (separate wirtschaftliche Wertigkeit), Bedienaufwand und Auflösung-Faustregel (nicht belegt bzw. Doppelung). Umsetzung im Cockpit: Knopf „Kriterien aus Pflichtenheft übernehmen“ im Abschnitt Bewertung (ersetzt die Liste; Punkte an gleich bleibenden Kriterien bleiben). Vorschläge A und B ggf. mit „+“ ergänzen. Entscheiden: Vorschläge A/B ja/nein, Gewichtung.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","chat":"","typ":"aufgabe","entscheidung":"mws7asp994y7m","nr":"T-014","ask":"","antwort":"","updated":"2026-11-24T19:59:41.641Z"},{"id":"mwsalktha73um","title":"Darf das Rohr an jeder Messstation gedreht werden (ohne Helix)?","note":"Das Schattenbild liefert bei 360°-Drehung die Breiten je Winkel, daraus Ø max − Ø min je Längenposition. Frage: Ist Drehen an festen Stationen zulässig, obwohl Anf. 2.3 keine Helixabtastung vorsieht? Schätzung: mit 2D-Sensor ca. 9–12 min je Rohr, mit 1D-Sensor (ODC2700) ca. 75 min je Rohr. Wirkt auf die Sensorwahl. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Nachtrag (2).","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Paul Baidinger","entscheidung":"e-001","nr":"T-015","antwort":"","updated":"2026-11-24T09:44:48.013Z"},{"id":"mwsam367j93y8","title":"Welche Formoberwellen müssen erkannt werden (Winkelauflösung)?","note":"Für Zylinderform je 2-mm-Punkt ohne Helix bestimmt die höchste relevante Oberwelle den nötigen Winkelschritt: Δφ ≤ 51,6°/n (Annahme: 10 µm Amplitude, 1 µm Fehler). Bis n = 6 genügen 5°-Schritte, darüber 2,5° oder feiner. Bitte: welche Ordnungen (Oval, Dreieck, höhere) sind bei NiTi und Edelstahl realistisch und in der Toleranz relevant? Davon hängen Bildrate (RF657 24/s, RF656 50/s mit SuM), Drehzeit ab. Details: projekt/Analyse_Sensorik_Messprinzip_2026-11-22.md, Nachtrag (3).","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Simon Hochstuhl; QM, Paul Baidinger","entscheidung":"e-001","nr":"T-016","antwort":"","updated":"2026-11-24T09:46:10.955Z"},{"id":"mwsdwp95uebas","title":"Datenblätter beschaffen","note":"Alle Werte der neuen Sensoren stammen nur aus Suchergebnissen, weil die Herstellerseiten in der Sitzung gesperrt waren (u. a. keyence.com, micro-epsilon.com, riftek.com, zumbach.com, sikora.net, nordson.com, laserlinc.com, precitec.com, mahr.com). Priorität laut Bericht Abschnitt 5: Keyence TM-X5040/5065, Aeroel XLS13XY (vorhanden), Nordson AccuScan 6012, Zumbach ODAC 13TRIO/14XY, Sikora LASER PRO 13 XY, Micro-Epsilon ODC2600 und confocalDT IFC2466. Ablage unter docs/archiv/6 Recherche Messtechnik/.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","chat":"","typ":"aufgabe","entscheidung":"mws03m2h7ngow","nr":"T-017","ask":"","antwort":"","updated":"2026-11-24T09:46:09.992Z"},{"id":"e-001","title":"Messstrategie: Querschnitt (2 mm) und Drehzahl beim Messen des 3-m-Rohres","note":"Zusammengeführt aus zwei Vorschlägen. (1) Unter 1 min je Rohr geht nur ohne Anhalten (Helix, Mehrachskopf, drehender Kopf). Dabei wird ein Querschnitt aus einem kurzen Längenfenster zusammengesetzt. Zulässig ist das nur, wenn ein Fenster bis 2 mm als Querschnitt gilt (Anf. 2.3). Quelle: projekt/reports/Messstrategien Rohr unter einer Minute.md. (2) Deep Research (projekt/reports/Berührungslose Sensoren für drehende Rohre.md): Unter 5 min je Rohr braucht man bei Drehung je Prüfstelle und 0,1 s Achsstopp mindestens ca. 600 1/min, bei 0,05 s ca. 400 1/min (eigene Rechnung). 1D-Sensoren ohne Mittelung setzen 400 bis über 10.000 1/min voraus. 2D-Bildsensoren (RIFTEK, Keyence TM-X) brauchen nur 20–42 1/min. Die zulässige Drehzahl (Schwingung, Durchbiegung, Lagerung) entscheidet, welche Sensorfamilie überhaupt in Frage kommt.","source":"KI (Claude Code), zusammengeführt aus 2 Vorschlägen","date":"2026-11-23","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"entscheidung","ask":"Paul Baidinger","updated":"2026-11-23T13:08:15.774Z","nr":"E-011"},{"id":"mwsdxhztyuziu","title":"Ist ein „Querschnitt“ eine ebene Schnittfläche oder ein Abschnitt von bis zu 2 mm?","note":"Unter 1 min je Rohr geht nur ohne Anhalten (Helix, Mehrachskopf, drehender Kopf). Dabei wird ein Querschnitt aus einem kurzen Längenfenster zusammengesetzt. Zulässig ist das nur, wenn ein Fenster bis 2 mm als Querschnitt gilt (Anf. 2.3). Quelle: projekt/reports/Messstrategien Rohr unter einer Minute.md.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Paul Baidinger","entscheidung":"e-001","nr":"T-018","antwort":"","updated":"2026-11-24T09:46:10.473Z"},{"id":"mwsdy4v13v962","title":"Welche Drehzahl verträgt ein 3-m-Rohr (Ø 1–6,5 mm) beim Messen?","note":"Deep Research (projekt/reports/Berührungslose Sensoren für drehende Rohre.md): Unter 5 min je Rohr braucht man bei Drehung je Prüfstelle und 0,1 s Achsstopp mindestens ca. 600 1/min, bei 0,05 s ca. 400 1/min (eigene Rechnung). 1D-Sensoren ohne Mittelung setzen 400 bis über 10.000 1/min voraus. 2D-Bildsensoren (RIFTEK, Keyence TM-X) brauchen nur 20–42 1/min. Die zulässige Drehzahl (Schwingung, Durchbiegung, Lagerung) entscheidet, welche Sensorfamilie überhaupt in Frage kommt.","source":"KI (Claude Code)","date":"2026-11-22","status":"offen","prio":"1","who":"Janek Bauer","due":"2026-12-04","by":"","reason":"","topic":"","docs":"","refs":"","typ":"aufgabe","ask":"Paul Baidinger","entscheidung":"e-001","nr":"T-019","antwort":"","updated":"2026-11-24T09:46:47.539Z"}],"tools":[{"id":"eval","criteria":[],"hzul":"0","pair":{},"variants":[],"updated":"2026-11-24T12:10:11.369Z"},{"id":"morph","variants":[],"rows":[{"id":"tf1","fn":"Rohr einlegen ","dep":"","deps":["tf2","tf7"],"ideas":["Von oben in offene Auflagen legen","Von vorn i <script>
/* Web-Fassung: ersetzt die Claude-Datenbank. Lesen aus den eingebetteten Daten,
   Schreiben (Bearbeiten/Löschen) als Commit in cockpit/daten/*.json über die GitHub-API,
   sobald in diesem Browser ein Zugriffstoken gespeichert ist. */
(function(){
  var REPO="JanekBauer/Technikerarbeit",BRANCH="main",DIR="cockpit/daten/";
  var DATA=JSON.parse(document.getElementById("cockpit-data").textContent);
  var listeners={};
  function tok(){try{return localStorage.getItem("ta_gh_token")||"";}catch(e){return "";}}
  function toB64(s){return btoa(unescape(encodeURIComponent(s)));}
  function fromB64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,""))));}
  function api(path,opt){
    opt=opt||{};
    opt.headers=Object.assign({"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json"},opt.headers||{});
    return fetch("https://api.github.com/repos/"+REPO+path,opt).then(function(r){
      if(r.ok)return r.json();
      return r.text().then(function(t){var e=new Error("GitHub "+r.status+": "+t.slice(0,160));e.status=r.status;throw e;});
    });
  }
  function fmt(arr){return "[\n"+arr.map(function(o){return JSON.stringify(o);}).join(",\n")+"\n]\n";}
  function snap(c){return {docs:(DATA[c]||[]).map(function(o){var d=Object.assign({},o);var id=d.id;delete d.id;return {id:id,data:function(){return d;}};}),metadata:{fromCache:false}};}
  function emit(c){(listeners[c]||[]).forEach(function(cb){cb(snap(c));});}
  /* Änderungen bleiben zuerst im Browser und sind sofort sichtbar. „Aktualisieren“ schreibt alle
     offenen Änderungen in EINEM Commit auf main (also nur ein Seitenneubau statt vieler). */
  var PKEY="ta_pending",PEND={},busy=false;
  function loadPend(){try{PEND=JSON.parse(localStorage.getItem(PKEY)||"{}")||{};}catch(e){PEND={};}}
  function savePend(){try{if(Object.keys(PEND).length)localStorage.setItem(PKEY,JSON.stringify(PEND));else localStorage.removeItem(PKEY);}catch(e){}}
  function pendCount(){return Object.keys(PEND).reduce(function(n,c){return n+PEND[c].msgs.length;},0);}
  function change(c,mutate,msg){
    if(!tok())return Promise.reject(new Error("Kein Zugriffstoken"));
    if(busy)return Promise.reject(new Error("Bitte kurz warten, die Aktualisierung läuft."));
    var before=JSON.parse(JSON.stringify(DATA[c]||[]));
    if(!PEND[c])PEND[c]={base:before,local:null,msgs:[]};
    var arr=mutate(JSON.parse(JSON.stringify(DATA[c]||[])));
    DATA[c]=arr;PEND[c].local=arr;PEND[c].msgs.push(msg);
    savePend();emit(c);showBar();
    return Promise.resolve();
  }
  /* Eintragsweise Zusammenführung: geänderte Einträge aus dem Browser setzen, alles andere bleibt wie auf GitHub */
  function byId(a){var m={};(a||[]).forEach(function(x){m[x.id]=x;});return m;}
  function mergeEntries(remote,base,local){
    var b=byId(base),l=byId(local),out=remote.slice();
    Object.keys(Object.assign({},b,l)).forEach(function(id){
      if(JSON.stringify(b[id]||null)===JSON.stringify(l[id]||null))return;
      if(!l[id]){out=out.filter(function(x){return x.id!==id;});return;}
      var i=out.findIndex(function(x){return x.id===id;});
      if(i>=0)out[i]=l[id];else out.push(l[id]);
    });
    return out;
  }
  function commitMsg(msgs){return "Cockpit: "+msgs.length+" Änderung"+(msgs.length===1?"":"en")+" aktualisiert (Web)\n\n"+msgs.join("\n");}
  function flush(tries){
    tries=tries||0;
    var cs=Object.keys(PEND);
    if(!cs.length)return Promise.resolve();
    var msgs=[];cs.forEach(function(c){msgs=msgs.concat(PEND[c].msgs);});
    var head,tree;
    return api("/git/ref/heads/"+BRANCH).then(function(r){head=r.object.sha;return api("/git/commits/"+head);})
      .then(function(cm){
        tree=cm.tree.sha;
        return Promise.all(cs.map(function(c){
          return api("/contents/"+DIR+c+".json?ref="+BRANCH).then(function(f){
            return {c:c,merged:mergeEntries(JSON.parse(fromB64(f.content)),PEND[c].base,PEND[c].local)};
          });
        }));
      })
      .then(function(rs){
        return Promise.all(rs.map(function(x){
          return api("/git/blobs",{method:"POST",body:JSON.stringify({content:fmt(x.merged),encoding:"utf-8"})})
            .then(function(b){return {path:DIR+x.c+".json",mode:"100644",type:"blob",sha:b.sha};});
        }))
        .then(function(entries){return api("/git/trees",{method:"POST",body:JSON.stringify({base_tree:tree,tree:entries})});})
        .then(function(t){return api("/git/commits",{method:"POST",body:JSON.stringify({message:commitMsg(msgs),tree:t.sha,parents:[head]})});})
        .then(function(cm){return api("/git/refs/heads/"+BRANCH,{method:"PATCH",body:JSON.stringify({sha:cm.sha})});})
        .then(function(){rs.forEach(function(x){DATA[x.c]=x.merged;emit(x.c);});PEND={};savePend();});
      })
      .catch(function(e){
        if(e.status===422&&tries<2)return flush(tries+1);
        throw e;
      });
  }
  function discard(){Object.keys(PEND).forEach(function(c){DATA[c]=PEND[c].base;emit(c);});PEND={};savePend();showBar();}
  function fail(e){
    alert("Speichern bei GitHub hat nicht geklappt:\n"+(e&&e.message||e)+"\n\nPrüfe das Zugriffstoken (Knopf oben rechts).");
    throw {code:"write_failed"};
  }
  function label(b,id){return String(b&&(b.title||b.name||b.q||b.text||b.fn||b.family)||id).slice(0,60);}
  function coll(c){return {
    onSnapshot:function(ok){(listeners[c]=listeners[c]||[]).push(ok);setTimeout(function(){ok(snap(c));},0);return function(){};},
    doc:function(id){return {
      set:function(body){
        var obj=Object.assign({id:id},body);
        return change(c,function(a){var i=a.findIndex(function(x){return x.id===id;});if(i>=0)a[i]=obj;else a.push(obj);return a;},"Cockpit: "+c+" – "+label(body,id)+" gespeichert (Web)").catch(fail);
      },
      delete:function(){
        var old=(DATA[c]||[]).find(function(x){return x.id===id;});
        return change(c,function(a){return a.filter(function(x){return x.id!==id;});},"Cockpit: "+c+" – "+label(old,id)+" gelöscht (Web)").catch(fail);
      }
    };}
  };}
  var db={collection:coll};
  function clean(x){return String(x).replace(/[\\\/:*?"<>|#%]+/g,"_").trim();}
  function encPath(p){return p.split("/").map(encodeURIComponent).join("/");}
  function toB64File(file){return file.arrayBuffer().then(function(buf){var by=new Uint8Array(buf),bin="";for(var i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin);});}
  /* Datei als Commit nach docs/archiv/<Ordner>/<Dokument>/<Version>_<Name> legen */
  function upload(file,o){
    o=o||{};
    if(file.size>20*1048576)return Promise.reject(new Error("Datei zu groß (max. 20 MB)"));
    var rel="archiv/"+clean(o.folder||"Sonstiges")+"/"+clean(o.family||"Dokument")+"/"+clean(o.ver||"V1")+"_"+clean(file.name);
    return toB64File(file).then(function(b64){
      function put(path,n){
        return api("/contents/docs/"+encPath(path),{method:"PUT",body:JSON.stringify({message:"Cockpit: Datei hochgeladen – "+file.name+" (Web)",content:b64,branch:BRANCH})})
          .then(function(){return {id:path,path:path};})
          .catch(function(e){
            if((e.status===422||e.status===409)&&n<1)return put(path.replace(/(\.[^.\/]+)?$/,"_"+Date.now()+"$1"),n+1);
            throw e;
          });
      }
      return put(rel,0);
    });
  }
  window.claude={use:function(n){
    if(n==="db")return Promise.resolve(db);
    if(n==="user")return Promise.resolve({can:function(){return Promise.resolve(!!tok());}});
    if(n==="assets")return Promise.resolve({upload:upload});
    if(n==="downloads")return Promise.resolve({save:function(o){var u=URL.createObjectURL(o.data);var a=document.createElement("a");a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},10000);return Promise.resolve();}});
    return Promise.resolve(null);
  }};
  /* Knopf: Zugriffstoken speichern oder entfernen */
  var b=document.createElement("button");
  b.id="ghbtn";b.className="btn sm";
  b.style.cssText="position:fixed;right:18px;top:14px;z-index:50;font-size:13px;padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(23,33,43,.12)";b.title="GitHub-Zugriffstoken für Bearbeiten und Löschen";
  b.textContent=tok()?"Bearbeiten aktiv · Token ändern":"Bearbeiten freischalten";
  b.onclick=function(){
    var t=prompt("GitHub-Zugriffstoken einfügen. Es bleibt nur in diesem Browser gespeichert.\nLeer lassen und OK = Verbindung trennen.");
    if(t===null)return;
    t=t.trim();
    try{if(!t){localStorage.removeItem("ta_gh_token");location.reload();return;}localStorage.setItem("ta_gh_token",t);}catch(e){alert("Dieser Browser erlaubt kein Speichern des Tokens.");return;}
    api("").then(function(r){
      if(r.permissions&&r.permissions.push){alert("Verbunden mit "+r.full_name+". Du kannst jetzt bearbeiten und löschen.");location.reload();}
      else{localStorage.removeItem("ta_gh_token");alert("Das Token darf in diesem Repo nichts schreiben. Es braucht „Contents: Read and write“.");}
    }).catch(function(e){try{localStorage.removeItem("ta_gh_token");}catch(x){}alert("Token wurde abgelehnt: "+e.message);});
  };
  document.body.appendChild(b);
  /* Aktualisieren-Knopf oben in der Navigation (wird bei jedem Neuzeichnen mit eingesetzt) */
  function showBar(){}
  document.addEventListener("click",function(ev){
    var g=ev.target.closest&&ev.target.closest("#pendgo");if(!g)return;
    if(!pendCount()){location.reload();return;}
    g.disabled=true;g.textContent="…";busy=true;
    flush().then(function(){busy=false;})
      .catch(function(e){busy=false;alert("Aktualisieren hat nicht geklappt:\n"+(e&&e.message||e)+"\n\nDie Änderungen bleiben im Browser. Bitte erneut versuchen.");})
      .then(function(){g.disabled=false;g.textContent="Aktualisieren";});
  });
  window.addEventListener("beforeunload",function(e){if(pendCount()){e.preventDefault();e.returnValue="";}});
  /* Offene Änderungen nach dem Neuladen wieder anzeigen */
  loadPend();
  /* Frischer Stand aus dem Repo: die eingebettete Fassung kann veraltet sein (Browser- oder Seiten-Cache).
     Offene Änderungen dieses Browsers bleiben oben erhalten. */
  function refresh(){
    return Promise.all(Object.keys(DATA).map(function(c){
      return fetch("https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/"+DIR+c+".json?t="+Date.now(),{cache:"no-store"})
        .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
        .then(function(fresh){
          if(PEND[c])fresh=mergeEntries(fresh,PEND[c].base,PEND[c].local);
          DATA[c]=fresh;emit(c);
        })
        .catch(function(){/* eingebettete Fassung bleibt stehen */});
    }));
  }
  refresh();
  Object.keys(PEND).forEach(function(c){if(PEND[c].local)DATA[c]=PEND[c].local;});
  /* Leere Lösungs-Spalten des Morph. Kasten auch aus einem alten Browser-Entwurf entfernen (Gegenstück zu mkPrune in der Oberfläche) */
  (function pruneMorphDraft(){
    var t=PEND.tools&&PEND.tools.local;if(!t)return;
    var m=t.filter(function(o){return o.id==="morph";})[0];if(!m||!m.rows)return;
    var n=0;m.rows.forEach(function(r){n=Math.max(n,(r.ideas||[]).length);});
    var keep=[];for(var i=0;i<n;i++){if(m.rows.some(function(r){return String((r.ideas||[])[i]||"").trim();}))keep.push(i);}
    if(keep.length===n)return;
    m.rows.forEach(function(r){r.ideas=keep.map(function(i){return (r.ideas||[])[i]||"";});});
    PEND.tools.msgs.push("Morph. Kasten: leere Lösungs-Spalten entfernt");
    DATA.tools=t;savePend();
  })();
  showBar();
})();
</script>

const $ = s=>document.querySelector(s);
