<title>TA-Cockpit Messanlage</title>

<style>
/* Layout: Prüfprotokoll-Optik – linke Navigationsleiste (oben auf dem Handy), rechts Arbeitsfläche mit Tabellen und Karten */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f6f8fa; --ink:#17212b; --muted:#5b6876; --line:#d5dbe2;
  --accent:#28598a; --accent-ink:#ffffff; --accent-soft:#dde8f3;
  --ok:#2f7d4f; --ok-soft:#dcefe3; --warn:#a86a00; --warn-soft:#f7ead0; --bad:#b33a2e; --bad-soft:#f6dcd8; --off:#8a96a3; --off-soft:#e7ebef;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow","Segoe UI",Arial,sans-serif; --f-mono:"JetBrains Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#18202a; --panel2:#1d2732; --ink:#e3e8ee; --muted:#9aa7b4; --line:#2c3845;
  --accent:#6fa6dc; --accent-ink:#0d1620; --accent-soft:#1f3347;
  --ok:#6cc58f; --ok-soft:#1d3527; --warn:#e2b04f; --warn-soft:#3a2f17; --bad:#f08a7e; --bad-soft:#40211d; --off:#7f8b97; --off-soft:#252f39;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#18202a; --panel2:#1d2732; --ink:#e3e8ee; --muted:#9aa7b4; --line:#2c3845;
  --accent:#6fa6dc; --accent-ink:#0d1620; --accent-soft:#1f3347;
  --ok:#6cc58f; --ok-soft:#1d3527; --warn:#e2b04f; --warn-soft:#3a2f17; --bad:#f08a7e; --bad-soft:#40211d; --off:#7f8b97; --off-soft:#252f39;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:26px} h2{font-size:22px} h3{font-size:17px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand b{font-family:var(--f-disp);font-size:21px;display:block}
.brand span{color:var(--muted);font-size:12.5px}
.navgrp{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:12px 8px 4px}
nav a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:var(--r);color:var(--ink);text-decoration:none;font-size:14.5px}
nav a:hover{background:var(--panel2)}
nav a.on{background:var(--accent);color:var(--accent-ink)}
nav a .cnt{font-family:var(--f-mono);font-size:11.5px;opacity:.8}
main{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.tag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);padding:8px 12px;border-radius:var(--r);margin-bottom:14px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.wide{grid-column:1/-1}
a.big{display:block;color:inherit;text-decoration:none}
a.big:hover{border-color:var(--accent)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:var(--r);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.katrow{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
.kat{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:8px 10px;min-width:200px}
.fchip{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:2px 4px 2px 0;max-width:230px;vertical-align:middle;background:var(--panel)}
.fchip a,.fchip>span{display:inline-flex;gap:6px;align-items:center;padding:2px 8px;color:var(--ink);text-decoration:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip a:hover{background:var(--accent-soft)}
.fchip b{font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--bad);letter-spacing:.03em}
.fchip i{font-style:normal;color:var(--muted);font-size:12px}
.fdl{border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);padding:0 8px;cursor:pointer;font-size:12px}
.fdl:hover{color:var(--accent);background:var(--accent-soft)}
.fmore>summary{list-style:none;cursor:pointer;display:inline-block}
.fmore>summary::-webkit-details-marker{display:none}
.fcount{font-size:12px;color:var(--accent);font-weight:600}
.fmore{position:relative;display:inline-block}
.fpop{position:absolute;z-index:30;left:0;top:calc(100% + 4px);min-width:max-content;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.fpop .fchip{max-width:none}
.w150{max-width:150px}
.sensT th{white-space:normal;vertical-align:bottom}
.sensT .fchip{max-width:170px}
.dmore>summary{color:var(--accent);font-size:13px;white-space:nowrap}
.dmore>summary::before{content:"▸ "}
.dmore[open]>summary::before{content:"▾ "}
.dpop{right:0;left:auto;width:420px;min-width:0;max-width:70vw}
.dpop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.dpop dt{color:var(--muted);white-space:nowrap}
.dpop dd{margin:0}
.kat .fmore>summary{color:var(--accent);margin-top:4px}
.kat .fmore>summary::before{content:"▸ "}
.kat .fmore[open]>summary::before{content:"▾ "}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:280px}
.hintbox,.restbox{margin:10px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:8px 12px}
.hintbox>summary,.restbox>summary{cursor:pointer;font-weight:600}
.restbox .tbl{margin-top:8px}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-disp);font-weight:600;font-size:14px;text-align:left;background:var(--panel2);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--panel2)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--off-soft);color:var(--off)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar select,.toolbar input{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink)}
.dl{display:grid;gap:4px}
.cd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.cd:last-child{border-bottom:none}
.cd .d{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd .d small{font-size:12px;font-weight:400;color:var(--muted)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}
.big{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 16px}
.big .n{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1}
.big .l{color:var(--muted);font-size:13.5px}
.amp{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:start}
.amp:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--off)}
.d-gruen{background:var(--ok)} .d-gelb{background:var(--warn)} .d-rot{background:var(--bad)} .d-grau{background:var(--off)}
ul.clean{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:none}
.step.click{cursor:pointer;border-radius:6px}.step.click:hover{background:var(--panel2)}.step .go{color:var(--accent);font-size:12.5px}
.step b.k{font-family:var(--f-mono);color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(30px,env(safe-area-inset-top,0px)) 12px 30px;overflow:auto;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);width:min(640px,100%);padding:18px}
.modal.wide{width:min(860px,100%)}
.tsec{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.logi{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.logi:last-child{border-bottom:none}
.cd.click{cursor:pointer}.cd.click:hover{background:var(--panel2)}
.tlink{cursor:pointer}
.form{display:grid;gap:10px;margin-top:12px}
.form label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;width:100%}
.form textarea{min-height:80px;resize:vertical}
.form .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.form .chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.form .chk input{width:auto}
.mact{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.calc{display:grid;gap:10px;align-content:start;min-width:0}
.calc .in{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.calc label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.calc input,.calc select{font:inherit;font-size:15px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);color:var(--ink);width:100%}
.res{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
.res .v{font-family:var(--f-mono);font-size:20px;font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
.mk td input,.mk th input,.mk td textarea{font:inherit;font-size:13.5px;line-height:1.35;width:100%;min-width:160px;border:1px solid transparent;background:transparent;color:var(--ink);padding:3px 4px;border-radius:4px}
.mk td textarea{display:block;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;field-sizing:content;min-height:1.9em}
.mk td.nr{font-weight:600;white-space:nowrap;color:var(--muted);vertical-align:top;padding-top:8px}
.mk .deps{display:flex;flex-wrap:wrap;gap:2px;min-width:120px;max-width:330px}
.mk .depchip{font:inherit;font-size:10.5px;line-height:1.2;padding:1px 3px;min-width:30px;text-align:center;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.mk .depchip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mk .depchip:disabled{cursor:default}
.mk td input:hover,.mk td input:focus,.mk td textarea:hover,.mk td textarea:focus{border-color:var(--line);background:var(--panel2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:12.5px}
.ck{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:start;padding:5px 0;border-bottom:1px dashed var(--line)}
.ck:last-child{border-bottom:none}
.ck input{margin-top:3px}
.ck.done span{color:var(--muted);text-decoration:line-through}
.bar{height:8px;background:var(--off-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
textarea.out{width:100%;min-height:220px;font-family:var(--f-mono);font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.empty{padding:20px;text-align:center;color:var(--muted)}
svg text{font-family:var(--f-body)}
.warnlist li{margin:2px 0}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;border-right:none;border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));display:flex;gap:4px;overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
  .brand,.navgrp{display:none}
  nav a{white-space:nowrap;flex:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .big .n{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Archiv */
.afold{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:10px}
.afold>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;font-weight:600}
.afold>summary::-webkit-details-marker{display:none}
.afold>summary .fi::before{content:"▸";display:inline-block;width:1em;transition:transform .15s}

.afold .fbody{padding:0 12px 10px}
.fam{border-top:1px solid var(--line);padding:9px 0}
.famrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.famrow .fn{min-width:0;flex:1 1 260px}
.famrow .fn b{word-break:break-word}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.vtree{margin:8px 0 2px 10px;padding-left:14px;border-left:2px solid var(--line)}
.vnode{position:relative;padding:6px 0 6px 6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.vnode::before{content:"";position:absolute;left:-14px;top:15px;width:12px;border-top:2px solid var(--line)}
.vnode .vk{font-family:var(--f-mono);font-size:12.5px;font-weight:600;min-width:64px;display:inline-block}
.vnode.miss{opacity:.75}
.vnode .vtxt{min-width:0;flex:1 1 240px}
</style>

<style>#zipall,#zipallv,[data-zip]{display:none!important}@media(max-width:760px){#ghbtn{top:auto!important;bottom:10px}}</style>
<style>

#palette.on{display:flex}

.bcol{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:120px}
.bcol.over{outline:2px dashed var(--accent)}
.bh{display:flex;justify-content:space-between;padding:2px 4px 8px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:14px}
.bcard:hover{border-color:var(--accent)}
.bcard.drag{opacity:.4}
.vswitch{display:inline-flex;gap:6px}

<script>
/* Web-Fassung: ersetzt die Claude-Datenbank. Lesen aus den eingebetteten Daten,
   Schreiben (Bearbeiten/Löschen) als Commit in cockpit/daten/*.json über die GitHub-API,
   sobald in diesem Browser ein Zugriffstoken gespeichert ist. */
(function(){
  var REPO="JanekBauer/Technikerarbeit",BRANCH="main-upgrade",DIR="cockpit/daten/";
  var DATA=JSON.parse(document.getElementById("cockpit-data").textContent);
  var listeners={};
  function tok(){try{return localStorage.getItem("ta_gh_token")||"";}catch(e){return "";}}
  function toB64(s){return btoa(unescape(encodeURIComponent(s)));}
  function fromB64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,""))));}
  function api(path,opt){
    opt=opt||{};
    opt.headers=Object.assign({"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json"},opt.headers||{});
    return fetch("https://api.github.com/repos/"+REPO+path,opt).then(function(r){
      if(r.ok)return r.json();
      return r.text().then(function(t){var e=new Error("GitHub "+r.status+": "+t.slice(0,160));e.status=r.status;throw e;});
    });
  }
  function fmt(arr){return "[\n"+arr.map(function(o){return JSON.stringify(o);}).join(",\n")+"\n]\n";}
  function snap(c){return {docs:(DATA[c]||[]).map(function(o){var d=Object.assign({},o);var id=d.id;delete d.id;return {id:id,data:function(){return d;}};}),metadata:{fromCache:false}};}
  function emit(c){(listeners[c]||[]).forEach(function(cb){cb(snap(c));});}
  /* Änderungen bleiben zuerst im Browser und sind sofort sichtbar. „Aktualisieren“ schreibt alle
     offenen Änderungen in EINEM Commit auf main (also nur ein Seitenneubau statt vieler). */
  var PKEY="ta_pending",PEND={},busy=false;
  function loadPend(){try{PEND=JSON.parse(localStorage.getItem(PKEY)||"{}")||{};}catch(e){PEND={};}}
  function savePend(){try{if(Object.keys(PEND).length)localStorage.setItem(PKEY,JSON.stringify(PEND));else localStorage.removeItem(PKEY);}catch(e){}}
  function pendCount(){return Object.keys(PEND).reduce(function(n,c){return n+PEND[c].msgs.length;},0);}
  function change(c,mutate,msg){
    if(!tok())return Promise.reject(new Error("Kein Zugriffstoken"));
    if(busy)return Promise.reject(new Error("Bitte kurz warten, die Aktualisierung läuft."));
    var before=JSON.parse(JSON.stringify(DATA[c]||[]));
    if(!PEND[c])PEND[c]={base:before,local:null,msgs:[]};
    var arr=mutate(JSON.parse(JSON.stringify(DATA[c]||[])));
    DATA[c]=arr;PEND[c].local=arr;PEND[c].msgs.push(msg);
    savePend();emit(c);showBar();
    return Promise.resolve();
  }
  /* Eintragsweise Zusammenführung: geänderte Einträge aus dem Browser setzen, alles andere bleibt wie auf GitHub */
  function byId(a){var m={};(a||[]).forEach(function(x){m[x.id]=x;});return m;}
  function mergeEntries(remote,base,local){
    var b=byId(base),l=byId(local),out=remote.slice();
    Object.keys(Object.assign({},b,l)).forEach(function(id){
      if(JSON.stringify(b[id]||null)===JSON.stringify(l[id]||null))return;

      },

/* ---------- Wochenberichte: jeder Bericht läuft Freitag 07:30 bis nächsten Freitag 07:30 ---------- */
function wpStart(ts){
  const s=new Date(ts);s.setHours(7,30,0,0);
  const diff=(s.getDay()-5+7)%7;s.setDate(s.getDate()-diff);
  if(s.getTime()>ts)s.setDate(s.getDate()-7);
  return s.getTime();
}
function wpNext(start){const e=new Date(start);e.setDate(e.getDate()+7);return e.getTime();}
function wpChanges(start,end){
  const out=[];
  SRC.forEach(([c,kind,view,lab])=>{if(c==="kilog")return;(S.data[c]||[]).forEach(r=>{const u=r.updated?Date.parse(r.updated):0;if(u>=start&&u<end)out.push({c,kind,view,id:r.id,label:String(lab(r)||"(ohne Titel)").slice(0,140),at:u});});});
  return out.sort((x,y)=>y.at-x.at);
}
function wpRange(start){
  const f=t=>new Date(t).toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(",","");
  return f(start)+" – "+f(wpNext(start));
}
function wpList(start){
  // alle Berichte von der aktuellen Woche bis zur ersten Änderung zurück
  const all=[];S.data && Object.keys(S.data).forEach(c=>(S.data[c]||[]).forEach(r=>{if(r.updated)all.push(Date.parse(r.updated));}));
  const now=wpStart(Date.now());
  const first=all.length?wpStart(Math.min(...all)):now;
  const out=[];for(let s=now;s>=first&&out.length<40;){out.push(s);const p=new Date(s);p.setDate(p.getDate()-7);s=p.getTime();}
  return out;
}

  return svg;

/* Übernahme aus dem Eingang: Status, Datum, Inhalt und Vorschlag bleiben erhalten */
const PF_KIND_COLL={aufgabe:"tasks",entscheidung:"tasks",aenderung:"changes",abschluss:"tasks",kilog:"kilog"};
const PF_STAT={"offen":"offen","in Arbeit":"in Arbeit","erledigt":"erledigt","entfallen":"entfallen","bestätigt":"erledigt","beantwortet":"erledigt","abgesagt":"entfallen","geklärt":"erledigt"};
function pfAltRecord(p){
  const a=p.alt||{};const c=p.altColl;const st=PF_STAT[p.stand]||PF_STAT[a.status]||"offen";const dt=p.date||a.date||a.resolved||"";
  if(c==="tasks")return {coll:"tasks",obj:Object.assign({},a,{status:st,date:dt})};
  if(c==="decisions")return {coll:"tasks",obj:{typ:"entscheidung",title:a.text||"",note:"",who:"",due:"",prio:a.prio||"2",status:st,by:a.by||"",reason:a.reason||"",date:dt,source:a.source||"",docs:a.docs||"",refs:a.refs||"",topic:""}};
  if(c==="questions")return {coll:"tasks",obj:{typ:"entscheidung",title:a.q||"",note:a.answer||"",who:a.entscheider||"",due:a.due||"",prio:a.prio||"1",status:st,by:"",reason:"",date:dt,source:"Frage an den Betrieb"+(a.source?" ("+a.source+")":""),docs:"",refs:a.refs||"",topic:a.topic||""}};
  if(c==="conflicts")return {coll:"tasks",obj:{typ:"entscheidung",title:a.text||"",note:a.note||"",who:"",due:"",prio:"1",status:st,by:"",reason:"",date:dt,source:"Widerspruch",docs:a.between||"",refs:a.refs||"",topic:""}};
  return null;
}
async function pfClose(p){
  const t=S.data.tasks.find(x=>x.id===p.ziel);
  if(!t){alert2("Der betroffene Eintrag wurde nicht gefunden. Bitte das Feld „Betrifft Eintrag“ prüfen.");return;}
  const obj=Object.assign({},t,{status:"erledigt"});
  if(t.typ==="entscheidung"){obj.by=t.by||p.who||"";obj.reason=t.reason||p.detail||"";
    if(!obj.by||!obj.reason){alert2("Für eine Entscheidung braucht „erledigt“ „Entschieden von“ und „Begründung“.");return;}}
  if(!(await save("tasks",t.id,obj)))return;
  await save("postfach",p.id,Object.assign({},p,{status:"übernommen",ziel:"tasks/"+t.id}));
}
async function pfAccept(id,pre){
  const p=pre||S.data.postfach.find(x=>x.id===id);if(!p)return;
  if(p.kind==="abschluss"){await pfClose(p);return;}
  if(p.kind==="kilog"){const kid=nid();const day=p.date||new Date().toISOString().slice(0,10);
    if(await save("kilog",kid,{date:day,help:p.detail||p.title||"",fach:!!p.fach}))await save("postfach",id,Object.assign({},p,{status:"übernommen",ziel:"kilog/"+kid}));
    return;}
  let target=null,obj=null;
  if(p.alt){const r=pfAltRecord(p);if(r&&PF_KIND_COLL[p.kind]===r.coll){target=r.coll;obj=r.obj;}}
  if(!obj){
    const base={title:p.title||"",note:p.detail||"",source:p.vorschlag||"",date:p.date||"",status:p.stand||"offen",prio:"2",who:"",due:"",by:"",reason:"",topic:"",docs:"",refs:""};
    const map={
      aufgabe:["tasks",Object.assign({},base,{who:"Janek",chat:""})],
      entscheidung:["tasks",Object.assign({},base,{typ:"entscheidung"})],
      aenderung:["changes",{ver:"",date:p.date||"",chap:"",change:p.title||"",reason:p.detail||"",by:p.vorschlag||""}]
    };
    const m=map[p.kind];
    if(!m){alert2("Diese Art ist unbekannt. Bitte im Eintrag die Zielkategorie wählen.");return;}
    target=m[0];obj=m[1];
  }
  if(target==="tasks"){if(p.who)obj.who=p.who;if(p.ask)obj.ask=p.ask;if(p.due)obj.due=p.due;if(p.prio)obj.prio=p.prio;}
  const newId=nid();
  const ok=await save(target,newId,obj);
  if(ok)await save("postfach",id,Object.assign({},p,{status:"übernommen",ziel:target+"/"+newId}));
}

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
function icsFold(l){const o=[];let s=l;while(s.length>60){o.push(s.slice(0,60));s=" "+s.slice(60);}o.push(s);return o.join("\r\n");}
function buildIcs(){
  const ymd=s=>s.replace(/-/g,"");
  const nextDay=s=>{const d=pd(s);d.setDate(d.getDate()+1);return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");};

/* ---------- Verknüpfungen: Fragen, Entscheidungen, Widersprüche, Anforderungen ---------- */
function refTokens(s){return String(s||"").split(/[,;]/).map(t=>t.trim().toLowerCase().replace(/^anf\.?\s*/,"")).filter(Boolean);}
function linkedFor(q){
  const toks=refTokens(q.refs);const out=[];
  (S.data.decisions||[]).forEach(d=>{if(toks.includes(String(d.id).toLowerCase()))out.push({c:"decisions",id:d.id,kind:"Entscheidung",label:d.text,status:d.status,opts:[["entfallen","Entfällt"],["bestätigt","Bestätigt"]]});});
  (S.data.conflicts||[]).forEach(c=>{if(toks.includes(String(c.id).toLowerCase()))out.push({c:"conflicts",id:c.id,kind:"Widerspruch",label:c.text,status:c.status,opts:[["geklärt","Geklärt"]]});});
  (S.data.reqs||[]).forEach(r=>{if(toks.includes(String(r.nr||"").toLowerCase()))out.push({c:"reqs",id:r.id,kind:"Anforderung",label:(r.nr?r.nr+" ":"")+(r.text||""),status:r.status,opts:[["bestätigt","Bestätigt"]]});});
  return out;
}
function openAbgleich(qid){
  S.abglQ=qid;const q=S.data.questions.find(x=>x.id===qid);if(!q)return;
  const items=linkedFor(q);
  const body=items.length?items.map(it=>`<li style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="small muted">${esc(it.kind)} · ${stPill(it.status)}</div><div style="margin:4px 0">${nl(it.label)}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${it.opts.map(([s,l])=>`<button class="btn sm" data-abset="${esc(it.c)}|${esc(it.id)}|${esc(s)}">${esc(l)}</button>`).join("")}</div></li>`).join(""):'<p class="muted">Keine verknüpften Einträge. Trage unter „Verknüpft mit“ die IDs ein, z. B. e13 (Entscheidung), w02 (Widerspruch) oder 2.4 (Anforderung).</p>';
  $("#modal").innerHTML=`<div class="modal-bg" data-close="1"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Abgleich">
    <div class="toolbar" style="justify-content:space-between;align-items:flex-start"><div><span class="tag">Frage ${stPill(q.status)}</span><h2 style="margin:6px 0">${esc(q.q)}</h2><p class="small muted" style="margin:0">${q.answer?"Antwort: "+esc(q.answer):"Keine Antwort eingetragen."}</p></div><button class="btn" data-close="1">Schließen</button></div>
    <h3 style="margin-top:12px">Was dadurch wegfällt oder geklärt wird</h3><ul class="clean">${body}</ul></div></div>`;
  S.modalOpen=true;
}
async function setLinked(c,id,status){
  const r=(S.data[c]||[]).find(x=>x.id===id);if(!r)return;
  const obj=Object.assign({},r,{status});

VIEWS_after.rechner=()=>{

      const a=num(x.acc);const aok=isFinite(a)&&tol>0?(a<=tol/10?pill("≤ T/10","p-ok"):a<=tol/5?pill("≤ T/5","p-warn"):pill("> T/5","p-bad")):pill("Daten fehlen");
      return `<tr><td>${esc(x.maker)} ${esc(x.model)}</td><td class="num">${x.rmin!==""&&x.rmin!=null?f2(x.rmin)+"–"+f2(x.rmax)+" mm":"–"}</td><td>${rok}</td><td>${aok}</td></tr>`;}).join("")}</tbody></table></div>`:`<div class="empty">Noch keine Sensoren angelegt.</div>`;
  };
  ids.forEach(k=>{const el=$("#c_"+k);if(el){el.oninput=run;el.onchange=run;}});run();
};

/* ---------- Bewertung ---------- */
const EVAL_DEF={criteria:[],pair:{},variants:[],hzul:""};
function weights(e){const n=e.criteria.length;if(!n)return[];const sc=e.criteria.map(()=>0);let any=false;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const v=e.pair[e.criteria[i].id+"|"+e.criteria[j].id];if(v===undefined||v==="")continue;any=true;const p=Number(v);sc[i]+=p;sc[j]+=2-p;}
  const tot=sc.reduce((a,b)=>a+b,0);return !any||!tot?e.criteria.map(()=>1/n):sc.map(s=>s/tot);}
function scoreVar(e,v,w){let s=0;e.criteria.forEach((c,i)=>{const g=Number(v.scores&&v.scores[c.id]);if(isFinite(g))s+=w[i]*g;});return s;}
VIEWS.bewertung=()=>{
  const e=getTool("eval",EVAL_DEF);const ro=!S.canWrite||S.offline;const w=weights(e);
  const fReqs=S.data.reqs.filter(r=>r.art==="F").sort(byNr);
  const res=e.variants.map(v=>{const nw=scoreVar(e,v,w);const x=nw/4;const H=num(v.cost),hz=num(e.hzul);const y=H>0&&hz>0?Math.min(1,0.7*hz/H):NaN;return {v,nw,x,y,ok:v.fOk!==false};});
  const ranked=res.filter(r=>r.ok).sort((a,b)=>b.nw-a.nw);
  let sens="";if(ranked.length>1&&e.criteria.length>1){const top=ranked[0].v.id;const flips=[];
    e.criteria.forEach((c,i)=>{[1.2,0.8].forEach(fac=>{const w2=w.map((x,j)=>j===i?x*fac:x);const t=w2.reduce((a,b)=>a+b,0)||1;const wn=w2.map(x=>x/t);const best=res.filter(r=>r.ok).map(r=>({id:r.v.id,s:scoreVar(e,r.v,wn)})).sort((a,b)=>b.s-a.s)[0];if(best.id!==top)flips.push(`${c.name} ${fac>1?"+":"−"}20 %`);});});
    sens=flips.length?`<div class="banner">Das Ergebnis kippt, wenn sich diese Gewichte ändern: ${esc(flips.join(", "))}. Gewichtung mit dem Betrieb absichern.</div>`:`<p>${pill("robust","p-ok")} Die beste Variante bleibt vorn, auch wenn jedes Gewicht um ±20 % schwankt.</p>`;}
  const n=e.criteria.length;
  let h=`<div class="head"><div><span class="tag">Lösungsphase · Chat 07</span><h1>Bewertung der Varianten</h1><p>Ablauf: 1. Festanforderungen prüfen (Ausschluss), 2. Kriterien aus M-/W-Anforderungen, 3. paarweiser Vergleich für Gewichte, 4. Punkte 0–4 nach VDI 2225, 5. Ergebnis und Empfindlichkeit. Die Entscheidung trifft der Betrieb.</p></div>
  ${ro?"":`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ev_impv">Varianten aus Morph. Kasten</button><button class="btn" id="ev_impc">Kriterien aus M/W-Anforderungen</button></div>`}</div>
  <div class="grid g2">
  <div class="panel"><h3>1. Festanforderungen je Variante</h3><p class="note">Eine Variante, die eine Festanforderung verletzt, scheidet aus. Festanforderungen werden nicht gewichtet.</p>

VIEWS_after.bewertung=()=>{
  const get=()=>getTool("eval",EVAL_DEF);const put=(e,re)=>{saveTool("eval",e);if(re)render();};
  const addV=name=>{const e=get();if(name&&!e.variants.some(v=>v.name===name))e.variants.push({id:nid(),name,scores:{},fOk:true,cost:""});return e;};
  const av=$("#ev_addv");if(av)av.onclick=()=>{const t=$("#ev_newv").value.trim();if(t)put(addV(t),1);};
  const ac=$("#ev_addc");if(ac)ac.onclick=()=>{const t=$("#ev_newc").value.trim();if(!t)return;const e=get();e.criteria.push({id:nid(),name:t});put(e,1);};
  const iv=$("#ev_impv");if(iv)iv.onclick=()=>{const m=getTool("morph",MORPH_DEF);let e=get();m.variants.forEach(v=>{if(v.name&&!e.variants.some(x=>x.name===v.name))e.variants.push({id:nid(),name:v.name,scores:{},fOk:true,cost:""});});put(e,1);};
  const ic=$("#ev_impc");if(ic)ic.onclick=()=>{const e=get();S.data.reqs.filter(r=>r.art==="M"||r.art==="W").sort(byNr).forEach(r=>{const nm=(r.nr?r.nr+" ":"")+(r.text||"").split("\n")[0].slice(0,60);if(!e.criteria.some(c=>c.name===nm))e.criteria.push({id:nid(),name:nm});});put(e,1);};
  document.querySelectorAll("[data-evdelc]").forEach(b=>b.onclick=()=>{const e=get();const c=e.criteria.splice(+b.dataset.evdelc,1)[0];Object.keys(e.pair).forEach(k=>{if(k.indexOf(c.id)>=0)delete e.pair[k];});put(e,1);});
  document.querySelectorAll("[data-ev]").forEach(el=>{const h=re=>{const e=get();const t=el.dataset.ev;
    if(t==="fok")e.variants[+el.dataset.v].fOk=el.checked;
    else if(t==="cname")e.criteria[+el.dataset.c].name=el.value;
    else if(t==="pair")e.pair[el.dataset.k]=el.value===""?"":Number(el.value);
    else if(t==="score"){const v=e.variants[+el.dataset.v];v.scores=v.scores||{};v.scores[el.dataset.c]=el.value===""?"":Number(el.value);}
    else if(t==="cost")e.variants[+el.dataset.v].cost=el.value;
    else if(t==="hzul")e.hzul=el.value;
    put(e,re);};
    if(el.tagName==="SELECT"||el.type==="checkbox")el.onchange=()=>h(1);else{el.oninput=()=>h(0);el.onchange=()=>h(1);}});
};

const XMIME={pdf:"application/pdf",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",xls:"application/vnd.ms-excel",doc:"application/msword",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",txt:"text/plain",csv:"text/csv",md:"text/markdown",json:"application/json",zip:"application/zip"};
const NATIVE=/^(application\/pdf|image\/(png|jpeg|gif|webp)|text\/(plain|csv|markdown)|application\/json)$/;
const VIEWABLE=/^(application\/pdf|image\/)/;
const fext=n=>{const m=/\.([a-z0-9]+)$/i.exec(n||"");return m?m[1].toLowerCase():"";};
const verNum=v=>{const m=/(\d+(?:[.,]\d+)?)/.exec(v||"");return m?parseFloat(m[1].replace(",",".")):0;};
const fsize=b=>!b?"":b>=1048576?f2(b/1048576,1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const fileMime=f=>f.mime||XMIME[fext(f.name)]||"";
const PAGES="https://janekbauer02-cell.github.io/Technikerarbeit/",RAWB="https://raw.githubusercontent.com/janekbauer02-cell/Technikerarbeit/main/docs/";
const encPath=p=>p.split("/").map(encodeURIComponent).join("/");
function fileUrl(f){if(f.url)return f.url;if(f.path)return (location.protocol==="file:"?PAGES:"")+encPath(f.path);return "";}
function archRows(){return S.data.files.map(f=>Object.assign({},f,{folder:f.folder||(f.deadline?"9 Uploads zu Terminen":"9 Sonstiges"),family:f.family||f.name||"Datei",seq:(f.seq!==""&&f.seq!=null&&isFinite(+f.seq))?+f.seq:verNum(f.ver)}));}
function archTree(){const t={};archRows().forEach(r=>{const fo=t[r.folder]=t[r.folder]||{};(fo[r.family]=fo[r.family]||[]).push(r);});
  Object.values(t).forEach(fams=>Object.values(fams).forEach(v=>v.sort((a,b)=>(b.seq-a.seq)||(b.date||"").localeCompare(a.date||"")||(b.updated||"").localeCompare(a.updated||""))));return t;}
const newest=vers=>vers.find(v=>!v.missing&&v.gilt)||vers.find(v=>!v.missing)||null;
async function setGilt(id){const r=archRows().find(x=>x.id===id);if(!r)return;
  const ids=archRows().filter(x=>x.folder===r.folder&&x.family===r.family).map(x=>x.id);
  for(const i of ids){const f=S.data.files.find(x=>x.id===i);if(!f)continue;const want=i===id;if(!!f.gilt!==want)await save("files",i,Object.assign({},f,{gilt:want}));}}
const famOrder=fams=>Object.keys(fams).sort((a,b)=>{const oa=Math.min(...fams[a].map(x=>x.order==null?999:x.order)),ob=Math.min(...fams[b].map(x=>x.order==null?999:x.order));return (oa-ob)||a.localeCompare(b,"de");});
function nextVer(folder,family){const t=archTree();const v=(t[folder]&&t[folder][family])||[];if(!v.length)return "V1";const mx=Math.max(...v.map(x=>x.seq||0));return "V"+(Math.floor(mx)+1);}

async function storeFile(file,o){
  const e=fext(file.name);const mime=XMIME[e]||(file.type||"").split(";")[0]||"application/octet-stream";
  if(/Quotation|Angebot|RM0|IP0|Spez_|\.eml$/i.test(file.name)&&!confirm("Der Dateiname sieht nach einer vertraulichen Betriebsunterlage aus (Angebot, Spezifikation, Mail). Das Repo ist ÖFFENTLICH. Wirklich hochladen?"))throw new Error("Abgebrochen: möglicherweise vertrauliche Datei.");
  const a=await S.assets.upload(file,Object.assign({type:mime},o||{}));
  return {src:"repo",path:a.path,size:file.size,mime};
}
async function getBlob(f){
  if(!fileUrl(f))throw new Error("Die Datei liegt im PC-Archiv, nicht in der Web-Fassung.");let r=await fetch(fileUrl(f));if(!r.ok&&f.path)r=await fetch(RAWB+encPath(f.path));if(!r.ok)throw new Error("Datei nicht erreichbar ("+r.status+"). Frisch hochgeladene Dateien sind nach ca. 1 Minute da.");
  if(f.enc==="b64"){const bin=atob((await r.text()).trim());const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:fileMime(f)});}
  return await r.blob();
}
function blobFallback(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);}
async function saveBlob(name,blob){
  if(S.downloads){try{await S.downloads.save({filename:name,data:blob});return true;}catch(e){if(e&&e.code==="declined")return false;}}
  blobFallback(name,blob);return true;
}
async function dlFile(f,btn){const o=btn?btn.textContent:"";if(btn){btn.disabled=true;btn.textContent="Lädt …";}
  try{let b=await getBlob(f),n=f.name;if(!/^(gif|png|jpe?g|webp|mp4|webm|txt|json|md|docx|pptx|csv|html|svg|pdf|xlsx|zip)$/.test(fext(n))){const JSZip=await loadZip();const z=new JSZip();z.file(n,b);b=await z.generateAsync({type:"blob"});n=n.replace(/\.[^.]+$/,"")+".zip";}
    await saveBlob(n,b);}catch(e){alert2("Download hat nicht geklappt: "+(e&&e.message||"unbekannter Fehler"));}

let zipLib=null;
function loadZip(){if(window.JSZip)return Promise.resolve(window.JSZip);if(zipLib)return zipLib;
  zipLib=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";sc.onload=()=>res(window.JSZip);sc.onerror=()=>{zipLib=null;rej(new Error("ZIP-Funktion konnte nicht geladen werden"));};document.head.appendChild(sc);});return zipLib;}
async function dlZip(folders,all,btn){const o=btn.textContent;btn.disabled=true;
  try{const JSZip=await loadZip();const zip=new JSZip();const t=archTree();let n=0,tot=0;
    const jobs=[];folders.forEach(fo=>{const fams=t[fo]||{};Object.keys(fams).forEach(fam=>{const vs=fams[fam].filter(v=>!v.missing);vs.forEach((v,i)=>{if(i>0&&!all)return;jobs.push([i===0?fo+"/"+v.name:fo+"/_ältere Versionen/"+fam+"/"+(v.ver||"")+"_"+v.name,v]);});});});
    tot=jobs.length;if(!tot){alert2("In diesem Ordner liegen noch keine Dateien.");btn.disabled=false;return;}
    for(const [path,v] of jobs){btn.textContent=`Packt ${++n}/${tot} …`;try{zip.file(path.replace(/[\\:*?"<>|]/g,"_"),await getBlob(v));}catch(e){}}
    btn.textContent="Erzeugt ZIP …";const blob=await zip.generateAsync({type:"blob"});
    const name=(folders.length===1?folders[0].replace(/^\d+\s*/,"").replace(/[^\wäöüÄÖÜß-]+/g,"_"):"TA_Archiv"+(all?"_alle_Versionen":""))+"_"+new Date().toISOString().slice(0,10)+".zip";
    await saveBlob(name,blob);}

   <div class="tsec"><h3>Notizen</h3>
    ${ro?"":`<div class="form" style="margin-top:4px"><label for="tlog">Neue Notiz<textarea id="tlog" placeholder="z. B. Antwort von Hr. Baidinger, Ergebnis des Termins">${esc(draft)}</textarea></label><div><button class="btn pri" id="tlogsave">Notiz speichern</button></div></div>`}
    ${log.length?log.map(l=>`<div class="logi"><div class="small muted num">${new Date(l.at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}${l.by?" · "+esc(l.by):""}</div>${nl(l.t)}</div>`).join(""):'<p class="muted small">Noch keine Notizen.</p>'}
  </div></div>`;
  const tmb=document.querySelector("#modal .modal-bg");if(tmb){tmb.style.position="absolute";tmb.style.top="0";tmb.style.left="0";tmb.style.right="0";tmb.style.minHeight="100vh";tmb.style.overflow="visible";if(first)window.scrollTo(0,0);}
  if(first){const c=$("#modal [data-close]:not(.modal-bg)");if(c)c.focus();}
  const upd=async ch=>{const cur=S.data.deadlines.find(x=>x.id===d.id)||d;await save("deadlines",d.id,Object.assign({},cur,ch));};
  document.querySelectorAll("[data-tstat]").forEach(b=>b.onclick=()=>upd({status:b.dataset.tstat}));
  const tfa=$("#tfaddbtn");if(tfa)tfa.onclick=async()=>{const sel=$("#tfadd");if(!sel||!sel.value)return;const f=S.data.files.find(x=>x.id===sel.value);if(f)await save("files",f.id,Object.assign({},f,{deadline:d.id}));};
  document.querySelectorAll("[data-tfdel]").forEach(b=>b.onclick=async()=>{const f=S.data.files.find(x=>x.id===b.dataset.tfdel);if(f)await save("files",f.id,Object.assign({},f,{deadline:""}));});
  const te=$("#tedit");if(te)te.onclick=()=>{S.terminId=null;openEditor("deadlines",d.id);};
  document.querySelectorAll("[data-chk]").forEach(b=>b.onchange=async()=>{const [cid,i]=b.dataset.chk.split("|");const c=S.data.checks.find(x=>x.id===cid);if(!c)return;const items=(c.items||[]).map((x,j)=>j===+i?Object.assign({},x,{done:b.checked}):x);await save("checks",cid,Object.assign({},c,{items}));});
  const tdl=$("#tdel");if(tdl)tdl.onclick=async()=>{if(S.tDelSure===d.id){tdl.disabled=true;S.tDelSure=null;await del("deadlines",d.id);closeModal();}else{S.tDelSure=d.id;tdl.textContent="Wirklich löschen?";setTimeout(()=>{if(S.tDelSure===d.id){S.tDelSure=null;const b=$("#tdel");if(b)b.textContent="Termin löschen";}},5000);}};
  const addNote=async()=>{const t=$("#tlog").value.trim();if(!t)return null;const cur=S.data.deadlines.find(x=>x.id===d.id)||d;const e={t,at:new Date().toISOString(),by:"Janek"};const lg=(cur.log||[]).concat([e]);$("#tlog").value="";await upd({log:lg});return e;};
  const ls=$("#tlogsave");if(ls)ls.onclick=async()=>{ls.disabled=true;await addNote();ls.disabled=false;};
  const u=$("#tupl");if(u)u.onchange=async()=>{const f=u.files[0];if(!f)return;const m=$("#tuplmsg");m.textContent="Lädt hoch …";
    try{const st=await storeFile(f);await save("files",null,Object.assign(st,{name:f.name,folder:"9 Uploads zu Terminen",family:d.title||f.name,ver:fd(new Date().toISOString().slice(0,10)),seq:Date.now()/1e10,date:new Date().toISOString().slice(0,10),kind:/image/.test(f.type)?"Foto":"Sonstiges",note:($("#tfnote")||{}).value||"",deadline:d.id}));m.textContent="Hochgeladen: "+f.name+" (auch im Archiv)";}
    catch(e){m.textContent="Hochladen hat nicht geklappt: "+(e&&(e.code==="unsupported_type"?"Dateityp wird nicht unterstützt":e.message)||"unbekannter Fehler");}};
}



/* ---------- Offener Punkt: Was muss ich tun? ---------- */
function openTask(id){S.taskId=id;S.modalOpen=true;renderTask(true);}
function renderTask(first){
  const t=S.data.tasks.find(x=>x.id===S.taskId);if(!t){closeModal();return;}
  const ro=!S.canWrite||S.offline;
  const dl=S.data.deadlines.filter(d=>d.status!=="erledigt"&&d.date&&t.due&&d.date>=t.due).sort((x,y)=>x.date<y.date?-1:1)[0];
  $("#modal").innerHTML=`<div class="modal-bg" data-close="1"><div class="modal wide" role="dialog" aria-modal="true" aria-label="${esc(t.title)}">
   <div class="toolbar" style="justify-content:space-between;align-items:flex-start"><div><span class="tag">Offener Punkt${t.prio?" · Prio "+esc(t.prio):""}</span><h2>${esc(t.title)}</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap">${ro?"":`<button class="btn sm" id="kedit">Bearbeiten</button>`}<button class="btn" data-close="1">Schließen</button></div></div>
   <p class="small muted" style="margin:4px 0">${esc(t.who||"")}${t.chat?" · Chat "+esc(t.chat):""} · ${dueCell(t.due,false)} · ${stPill(t.status)}${dl?" · vor Termin „"+esc(dl.title)+"“":""}</p>
   ${t.note?`<p>${nl(t.note)}</p>`:""}
   ${ro?"":`<div class="tsec"><h3>Status</h3><div class="toolbar" style="margin:0">${["offen","in Arbeit","erledigt"].filter(s=>s!==t.status).map(s=>`<button class="btn sm" data-kstat="${s}">auf „${s}“</button>`).join("")}</div></div>`}
  </div></div>`;
  if(first){const c=$("#modal [data-close]:not(.modal-bg)");if(c)c.focus();}
  const ke=$("#kedit");if(ke)ke.onclick=()=>{S.taskId=null;openEditor("tasks",t.id);};

  document.querySelectorAll("[data-kstat]").forEach(b=>b.onclick=async()=>{const cur=S.data.tasks.find(x=>x.id===t.id)||t;await save("tasks",t.id,Object.assign({},cur,{status:b.dataset.kstat}));if(b.dataset.kstat==="erledigt")closeModal();});
}

/* ---------- Events ---------- */
document.addEventListener("click",ev=>{
  if(ev.target.closest("#srchbtn")){palOpenUi();return;}
  const ab=ev.target.closest("[data-abgl]");if(ab){ev.preventDefault();openAbgleich(ab.dataset.abgl);return;}
  const as=ev.target.closest("[data-abset]");if(as){ev.preventDefault();const [c,id,s]=as.dataset.abset.split("|");const qid=S.abglQ;setLinked(c,id,s).then(()=>{if(qid)openAbgleich(qid);});return;}
  const wi=ev.target.closest("[data-wpitem]");if(wi){ev.preventDefault();const [c,id,view]=wi.dataset.wpitem.split("|");closeModal();palOpen(c,view,id);return;}
  const dl=ev.target.closest("[data-dl]");if(dl){ev.preventDefault();ev.stopPropagation();const f=S.data.files.find(x=>x.id===dl.dataset.dl);if(f)dlFile(f,dl);return;}
  if(ev.target.closest("[data-noedit],.fchip a"))return;
  const tt=ev.target.closest("[data-termin]");if(tt&&!S.modalOpen){ev.preventDefault();openTermin(tt.dataset.termin);return;}
  const tk=ev.target.closest("[data-task]");if(tk&&!S.modalOpen){ev.preventDefault();openTask(tk.dataset.task);return;}
  const t=ev.target.closest("[data-new],[data-edit],[data-close]");if(!t)return;
  if(t.dataset.close!==undefined&&(ev.target===t)){closeModal();return;}
  if(t.dataset.new){openEditor(t.dataset.new,null);return;}
  if(t.dataset.edit){ev.preventDefault();openEditor(t.dataset.edit,t.dataset.id);}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&S.modalOpen)closeModal();if((ev.key==="Enter"||ev.key===" ")&&ev.target.dataset&&ev.target.dataset.termin&&!S.modalOpen){ev.preventDefault();openTermin(ev.target.dataset.termin);}if((ev.key==="Enter"||ev.key===" ")&&ev.target.dataset&&ev.target.dataset.task&&!S.modalOpen){ev.preventDefault();openTask(ev.target.dataset.task);}});
function route(){const h=(location.hash||"").slice(1);S.view=VIEWS[h]?h:"start";if(S.modalOpen){$("#modal").innerHTML="";S.modalOpen=false;}render();window.scrollTo(0,0);}
window.addEventListener("hashchange",route);
const v0=(location.hash||"").slice(1);if(VIEWS[v0])S.view=v0;
/* ---------- Suchpalette ---------- */
const pal=document.createElement("div");pal.id="palette";
pal.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-label="Suche"><input id="palq" type="text" placeholder="Suchen oder Befehl eingeben …" autocomplete="off" aria-label="Suche"><ul id="pall"></ul><div class="hint">Pfeiltasten wählen · Enter öffnen · Esc schließen</div></div>';
document.body.appendChild(pal);
let palSel=0,palItems=[];
function palOpen(c,view,id){
  if(c==="tasks"){openTask(id);return;}
  if(c==="deadlines"){openTermin(id);return;}
  if(S.canWrite&&!S.offline&&LISTS[c]){openEditor(c,id);return;}
  location.hash="#"+view;
}
function palBuild(q){
  const nrm=s=>String(s||"").toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const t=nrm(q).trim().split(/\s+/).filter(Boolean);
  const hit=(label,extra)=>{const l=nrm(label);const h=l+" "+extra.map(nrm).join(" ");if(!t.every(w=>h.includes(w)))return -1;return t.every(w=>l.includes(w))?2:1;};
  const out=[];
  NAV.forEach(g=>g[1].forEach(([k,l])=>{if(!t.length||hit(l,[])>=0)out.push({k:"Seite",label:l,score:3,go:()=>{location.hash="#"+k;}});}));
  if(S.canWrite&&!S.offline)NEWS.forEach(([c,l])=>{if(!t.length||hit(l,[])>=0)out.push({k:"Neu anlegen",label:l,score:t.length?1.5:0,go:()=>openEditor(c,null)});});
  if(t.length)SRC.forEach(([c,kind,view,lab,ext])=>{(S.data[c]||[]).forEach(r=>{const s=hit(lab(r),ext(r));if(s>=0)out.push({k:kind,label:String(lab(r)||"(ohne Titel)").slice(0,140),score:s,go:()=>palOpen(c,view,r.id)});});});
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,40);
}
function palRender(){
  palItems=palBuild($("#palq").value);palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $("#pall").innerHTML=palItems.length?palItems.map((it,i)=>`<li data-pi="${i}" class="${i===palSel?"sel":""}"><span class="k">${esc(it.k)}</span><span class="t">${esc(it.label)}</span></li>`).join(""):'<li style="cursor:default" class="muted">Nichts gefunden.</li>';
  const el=$("#pall .sel");if(el)el.scrollIntoView({block:"nearest"});
}
function palOpenUi(){if(S.modalOpen)return;pal.classList.add("on");const q=$("#palq");q.value="";palSel=0;palRender();q.focus();}
function palClose(){pal.classList.remove("on");}
function palGo(i){const it=palItems[i];if(!it)return;palClose();it.go();}
pal.addEventListener("click",e=>{if(e.target===pal){palClose();return;}const li=e.target.closest("[data-pi]");if(li)palGo(+li.dataset.pi);});
$("#palq").addEventListener("input",()=>{palSel=0;palRender();});
$("#palq").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);palRender();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);palRender();}
  else if(e.key==="Enter"){e.preventDefault();palGo(palSel);}
  else if(e.key==="Escape"){e.preventDefault();palClose();}});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||"")&&!S.modalOpen){e.preventDefault();palOpenUi();}});
boot();
})();
</script>
