name: Freitags-Vorbereitung

# Jeden Freitag gegen 6:00 Uhr Berliner Zeit (Läufe von 5 bis 7:59 Uhr werden ausgeführt). GitHub kennt nur UTC, deshalb laufen zwei Zeitpläne
# (04:00 und 05:00 UTC). Ist die Datei schon da, passiert nichts. Verspätete Läufe bleiben im Fenster.
# Die Datei entsteht auch dann, wenn Claude Code nicht erreichbar ist.
on:
  schedule:
    - cron: "0 4 * * 5"
    - cron: "0 5 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vorbereiten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nur früh morgens (Berliner Zeit) arbeiten
        id: zeit
        run: |
          h=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$h" -lt 5 ] || [ "$h" -gt 7 ]; }; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "Berliner Zeit ist $(TZ=Europe/Berlin date +%H:%M) - dieser Lauf wird übersprungen."
          fi

      - name: Vorbereitungsdatei erzeugen
        if: steps.zeit.outputs.skip != '1'
        run: python3 cockpit/vorbereitung.py

      - name: Seite neu bauen
        if: steps.zeit.outputs.skip != '1'
        run: python3 cockpit/build.py

      - name: Änderung zurückschreiben
        if: steps.zeit.outputs.skip != '1'
        run: |
          git add "docs" "cockpit/daten/files.json"
          if [ -n "$(git status --porcelain docs cockpit/daten/files.json)" ]; then
            git config user.name "cockpit-bot"
            git config user.email "cockpit-bot@users.noreply.github.com"
            git commit -m "Cockpit: Vorbereitungsdatei für den Freitag erstellt"
            git push
          else
            echo "Keine Änderung"
          fi
