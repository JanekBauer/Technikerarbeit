name: Cockpit veröffentlichen

# Veröffentlicht den Stand von main (Ordner docs) unter der Hauptadresse der Seite.
# Voraussetzung: Settings > Pages > Build and deployment > Source = „GitHub Actions“.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
