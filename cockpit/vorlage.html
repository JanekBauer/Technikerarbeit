<script>
/* Web-Fassung: ersetzt die Claude-Datenbank. Lesen aus den eingebetteten Daten,
   Schreiben (Bearbeiten/Löschen) als Commit in cockpit/daten/*.json über die GitHub-API,
   sobald in diesem Browser ein Zugriffstoken gespeichert ist. */
(function(){
  var REPO="__REPO__",BRANCH="__BRANCH__",DIR="cockpit/daten/";
  var DATA=JSON.parse(document.getElementById("cockpit-data").textContent);
  var listeners={};
  function tok(){try{return localStorage.getItem("ta_gh_token")||"";}catch(e){return "";}}
  function toB64(s){return btoa(unescape(encodeURIComponent(s)));}
  function fromB64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,""))));}
  function api(path,opt){
    opt=opt||{};
    opt.headers=Object.assign({"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json"},opt.headers||{});
    return fetch("https://api.github.com/repos/"+REPO+path,opt).then(function(r){
      if(r.ok)return r.json();
      return r.text().then(function(t){var e=new Error("GitHub "+r.status+": "+t.slice(0,160));e.status=r.status;throw e;});
    });
  }

     offenen Änderungen in EINEM Commit auf main (also nur ein Seitenneubau statt vieler). */
  var PKEY="ta_pending",PEND={},busy=false;

  function savePend(){try{if(Object.keys(PEND).length)localStorage.setItem(PKEY,JSON.stringify(PEND));else localStorage.removeItem(PKEY);}catch(e){}}
  function pendCount(){return Object.keys(PEND).reduce(function(n,c){return n+PEND[c].msgs.length;},0);}
  function change(c,mutate,msg){
    if(!tok())return Promise.reject(new Error("Kein Zugriffstoken"));
    if(busy)return Promise.reject(new Error("Bitte kurz warten, die Aktualisierung läuft."));
    var before=JSON.parse(JSON.stringify(DATA[c]||[]));
    if(!PEND[c])PEND[c]={base:before,local:null,msgs:[]};
    var arr=mutate(JSON.parse(JSON.stringify(DATA[c]||[])));
    DATA[c]=arr;PEND[c].local=arr;PEND[c].msgs.push(msg);
    savePend();emit(c);showBar();
    return Promise.resolve();
  }
  /* Eintragsweise Zusammenführung: geänderte Einträge aus dem Browser setzen, alles andere bleibt wie auf GitHub */
  function byId(a){var m={};(a||[]).forEach(function(x){m[x.id]=x;});return m;}
  function mergeEntries(remote,base,local){
    var b=byId(base),l=byId(local),out=remote.slice();
    Object.keys(Object.assign({},b,l)).forEach(function(id){
      if(JSON.stringify(b[id]||null)===JSON.stringify(l[id]||null))return;
      if(!l[id]){out=out.filter(function(x){return x.id!==id;});return;}
      var i=out.findIndex(function(x){return x.id===id;});
      if(i>=0)out[i]=l[id];else out.push(l[id]);
    });
    return out;
  }
  function commitMsg(msgs){return "Cockpit: "+msgs.length+" Änderung"+(msgs.length===1?"":"en")+" aktualisiert (Web)\n\n"+msgs.join("\n");}
  function flush(tries){
    tries=tries||0;
    var cs=Object.keys(PEND);
    if(!cs.length)return Promise.resolve();
    var msgs=[];cs.forEach(function(c){msgs=msgs.concat(PEND[c].msgs);});
    var head,tree;
    return api("/git/ref/heads/"+BRANCH).then(function(r){head=r.object.sha;return api("/git/commits/"+head);})
      .then(function(cm){
        tree=cm.tree.sha;
        return Promise.all(cs.map(function(c){
          return api("/contents/"+DIR+c+".json?ref="+BRANCH).then(function(f){
            return {c:c,merged:mergeEntries(JSON.parse(fromB64(f.content)),PEND[c].base,PEND[c].local)};
          });
        }));
      })
      .then(function(rs){
        return Promise.all(rs.map(function(x){
          return api("/git/blobs",{method:"POST",body:JSON.stringify({content:fmt(x.merged),encoding:"utf-8"})})
            .then(function(b){return {path:DIR+x.c+".json",mode:"100644",type:"blob",sha:b.sha};});
        }))
        .then(function(entries){return api("/git/trees",{method:"POST",body:JSON.stringify({base_tree:tree,tree:entries})});})
        .then(function(t){return api("/git/commits",{method:"POST",body:JSON.stringify({message:commitMsg(msgs),tree:t.sha,parents:[head]})});})
        .then(function(cm){return api("/git/refs/heads/"+BRANCH,{method:"PATCH",body:JSON.stringify({sha:cm.sha})});})
        .then(function(){rs.forEach(function(x){DATA[x.c]=x.merged;emit(x.c);});PEND={};savePend();});
      })
      .catch(function(e){

  function coll(c){return {
    onSnapshot:function(ok){(listeners[c]=listeners[c]||[]).push(ok);setTimeout(function(){ok(snap(c));},0);return function(){};},
    doc:function(id){return {
      set:function(body){
        var obj=Object.assign({id:id},body);
        return change(c,function(a){var i=a.findIndex(function(x){return x.id===id;});if(i>=0)a[i]=obj;else a.push(obj);return a;},"Cockpit: "+c+" – "+label(body,id)+" gespeichert (Web)").catch(fail);
      },
      delete:function(){
        var old=(DATA[c]||[]).find(function(x){return x.id===id;});
        return change(c,function(a){return a.filter(function(x){return x.id!==id;});},"Cockpit: "+c+" – "+label(old,id)+" gelöscht (Web)").catch(fail);
      }
    };}
  };}

  function clean(x){return String(x).replace(/[\\\/:*?"<>|#%]+/g,"_").trim();}

  function toB64File(file){return file.arrayBuffer().then(function(buf){var by=new Uint8Array(buf),bin="";for(var i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin);});}

          });

      return put(rel,0);
    });

    if(n==="assets")return Promise.resolve({upload:upload});
    if(n==="downloads")return Promise.resolve({save:function(o){var u=URL.createObjectURL(o.data);var a=document.createElement("a");a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},10000);return Promise.resolve();}});
    return Promise.resolve(null);

  b.style.cssText="position:fixed;right:14px;top:8px;z-index:50;font-size:12px;padding:3px 10px;opacity:.8";b.title="GitHub-Zugriffstoken für Bearbeiten und Löschen";

    api("").then(function(r){
      if(r.permissions&&r.permissions.push){alert("Verbunden mit "+r.full_name+". Du kannst jetzt bearbeiten und löschen.");location.reload();}
      else{localStorage.removeItem("ta_gh_token");alert("Das Token darf in diesem Repo nichts schreiben. Es braucht „Contents: Read and write“.");}
    }).catch(function(e){try{localStorage.removeItem("ta_gh_token");}catch(x){}alert("Token wurde abgelehnt: "+e.message);});
  };
  document.body.appendChild(b);
  /* Aktualisieren-Knopf oben in der Navigation (wird bei jedem Neuzeichnen mit eingesetzt) */
  function showBar(){}
  document.addEventListener("click",function(ev){
    var g=ev.target.closest&&ev.target.closest("#pendgo");if(!g)return;
    if(!pendCount()){location.reload();return;}

      .then(function(){g.disabled=false;g.textContent="Aktualisieren";});
  });
  window.addEventListener("beforeunload",function(e){if(pendCount()){e.preventDefault();e.returnValue="";}});
  /* Offene Änderungen nach dem Neuladen wieder anzeigen */
  loadPend();
  /* Frischer Stand aus dem Repo: die eingebettete Fassung kann veraltet sein (Browser- oder Seiten-Cache).
     Offene Änderungen dieses Browsers bleiben oben erhalten. */
  function refresh(){
    return Promise.all(Object.keys(DATA).map(function(c){
      return fetch("https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/"+DIR+c+".json?t="+Date.now(),{cache:"no-store"})
        .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
        .then(function(fresh){
          if(PEND[c])fresh=mergeEntries(fresh,PEND[c].base,PEND[c].local);
          DATA[c]=fresh;emit(c);
        })
        .catch(function(){/* eingebettete Fassung bleibt stehen */});
    }));
  }
  refresh();
  Object.keys(PEND).forEach(function(c){if(PEND[c].local)DATA[c]=PEND[c].local;});
  showBar();
})();
</script>

/* ---------- Wochenberichte: jeder Bericht läuft Freitag 07:30 bis nächsten Freitag 07:30 ---------- */
function wpStart(ts){
  const s=new Date(ts);s.setHours(7,30,0,0);
  const diff=(s.getDay()-5+7)%7;s.setDate(s.getDate()-diff);
  if(s.getTime()>ts)s.setDate(s.getDate()-7);
  return s.getTime();
}
function wpNext(start){const e=new Date(start);e.setDate(e.getDate()+7);return e.getTime();}
function wpChanges(start,end){
  const out=[];
  SRC.forEach(([c,kind,view,lab])=>{if(c==="kilog")return;(S.data[c]||[]).forEach(r=>{const u=r.updated?Date.parse(r.updated):0;if(u>=start&&u<end)out.push({c,kind,view,id:r.id,label:String(lab(r)||"(ohne Titel)").slice(0,140),at:u});});});
  return out.sort((x,y)=>y.at-x.at);
}
function wpRange(start){
  const f=t=>new Date(t).toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(",","");
  return f(start)+" – "+f(wpNext(start));
}
function wpList(start){
  // alle Berichte von der aktuellen Woche bis zur ersten Änderung zurück
  const all=[];S.data && Object.keys(S.data).forEach(c=>(S.data[c]||[]).forEach(r=>{if(r.updated)all.push(Date.parse(r.updated));}));
  const now=wpStart(Date.now());
  const first=all.length?wpStart(Math.min(...all)):now;
  const out=[];for(let s=now;s>=first&&out.length<40;){out.push(s);const p=new Date(s);p.setDate(p.getDate()-7);s=p.getTime();}
  return out;
}
function weekReport(start){
  const ch=wpChanges(start,wpNext(start));
  const done=ch.filter(x=>x.c==="tasks"&&(S.data.tasks.find(t=>t.id===x.id)||{}).status==="erledigt");
  const groups={};ch.forEach(x=>{groups[x.kind]=(groups[x.kind]||0)+1;});
  const open=S.data.tasks.filter(t=>t.status!=="erledigt").sort(sortDue).slice(0,5);
  const nxt=S.data.deadlines.filter(d=>d.status!=="erledigt"&&d.date&&days(d.date)>=0).sort((a,b)=>a.date<b.date?-1:1).slice(0,3);
  return `Wochenbericht Technikerarbeit – ${wpRange(start)}\n\nErledigt in dieser Woche:\n${done.length?done.map(x=>"- "+x.label).join("\n"):"- –"}\n\nGeändert: ${ch.length} Einträge (${Object.entries(groups).map(([k,n])=>n+" "+k).join(", ")||"keine"})\n\nNächste Schritte:\n${open.map(t=>"- "+t.title+(t.due?" (bis "+fd(t.due)+")":"")).join("\n")}\n\nNächste Termine:\n${nxt.map(d=>"- "+fd(d.date)+": "+d.title).join("\n")}`;
}

    svg+=`<line x1="${xx}" y1="94" x2="${xx}" y2="106" stroke="var(--muted)"/><text x="${xx}" y="122" font-size="11" text-anchor="middle" fill="var(--muted)">${d.toLocaleDateString("de-DE",{month:"short"})}${m===0||d.getMonth()===0?" "+String(d.getFullYear()).slice(2):""}</text>`;}
  const tx=X0+(today()-t0)/(t1-t0)*(X1-X0);
  if(tx>=X0&&tx<=X1)svg+=`<line x1="${tx}" y1="20" x2="${tx}" y2="180" stroke="var(--accent)" stroke-dasharray="4 3"/><text x="${tx+4}" y="30" font-size="11" fill="var(--accent)">heute</text>`;
  const lanes={betrieb:[],schule:[]};
  all.forEach((d,i)=>{const xx=Math.max(X0,Math.min(X1,x(d.date)));const up=d.kind==="betrieb";const lane=lanes[up?"betrieb":"schule"];
    let lvl=0;while(lane.some(p=>p[1]===lvl&&Math.abs(p[0]-xx)<26))lvl++;lane.push([xx,lvl]);
    const y=up?82-lvl*20:118+16+lvl*20;
    const col=d.status==="erledigt"?"var(--ok)":up?"var(--warn)":"var(--accent)";
    svg+=`<line x1="${xx}" y1="100" x2="${xx}" y2="${y}" stroke="${col}" stroke-width="1"/><circle class="tlink" data-termin="${esc(d.id)}" cx="${xx}" cy="${y}" r="9" fill="${col}"><title>${esc(d.title)}</title></circle><text class="tlink" data-termin="${esc(d.id)}" x="${xx}" y="${y+4}" font-size="10" text-anchor="middle" fill="var(--panel)" font-weight="600" style="cursor:pointer">${i+1}</text>`;});
  svg+=`<text x="${X0}" y="14" font-size="12" fill="var(--muted)">Betrieb ▲</text><text x="${X0}" y="196" font-size="12" fill="var(--muted)">Schule ▼</text></svg>`;
  return svg;
}

const OPT_LAB={aenderung:"Änderung",kilog:"KI-Log"};
const PF_KIND_COLL={aufgabe:"tasks",entscheidung:"tasks",aenderung:"changes",abschluss:"tasks",kilog:"kilog"};
const PF_STAT={"offen":"offen","in Arbeit":"in Arbeit","erledigt":"erledigt","entfallen":"entfallen","bestätigt":"erledigt","beantwortet":"erledigt","abgesagt":"entfallen","geklärt":"erledigt"};
function pfAltRecord(p){
  const a=p.alt||{};const c=p.altColl;const st=PF_STAT[p.stand]||PF_STAT[a.status]||"offen";const dt=p.date||a.date||a.resolved||"";
  if(c==="tasks")return {coll:"tasks",obj:Object.assign({},a,{status:st,date:dt})};
  if(c==="decisions")return {coll:"tasks",obj:{typ:"entscheidung",title:a.text||"",note:"",who:"",due:"",prio:a.prio||"2",status:st,by:a.by||"",reason:a.reason||"",date:dt,source:a.source||"",docs:a.docs||"",refs:a.refs||"",topic:""}};
  if(c==="questions")return {coll:"tasks",obj:{typ:"entscheidung",title:a.q||"",note:a.answer||"",who:a.entscheider||"",due:a.due||"",prio:a.prio||"1",status:st,by:"",reason:"",date:dt,source:"Frage an den Betrieb"+(a.source?" ("+a.source+")":""),docs:"",refs:a.refs||"",topic:a.topic||""}};
  if(c==="conflicts")return {coll:"tasks",obj:{typ:"entscheidung",title:a.text||"",note:a.note||"",who:"",due:"",prio:"1",status:st,by:"",reason:"",date:dt,source:"Widerspruch",docs:a.between||"",refs:a.refs||"",topic:""}};

}

  if(!t){alert2("Der betroffene Eintrag wurde nicht gefunden. Bitte das Feld „Betrifft Eintrag“ prüfen.");return;}
  const obj=Object.assign({},t,{status:"erledigt"});
  if(t.typ==="entscheidung"){obj.by=t.by||p.who||"Janek Bauer";obj.reason=t.reason||p.detail||"";
    if(!obj.by||!obj.reason){alert2("Für eine Entscheidung braucht „erledigt“ „Entschieden von“ und „Begründung“.");return;}}
  if(!(await save("tasks",t.id,obj)))return;
  await save("postfach",p.id,Object.assign({},p,{status:"übernommen",ziel:"tasks/"+t.id}));
}
/* Doppelte Übernahme ausschließen: ein Eintrag wird nur einmal übernommen, auch bei Doppelklick */
const PF_BUSY={};
async function pfAccept(id,pre){
  const cur=S.data.postfach.find(x=>x.id===id)||pre;
  if(cur&&cur.status==="übernommen"){alert2("Dieser Eintrag ist schon übernommen.");return;}
  if(PF_BUSY[id])return;PF_BUSY[id]=true;
  try{await pfAcceptRaw(id,pre);}finally{delete PF_BUSY[id];}
}
async function pfAcceptRaw(id,pre){
  const p=pre||S.data.postfach.find(x=>x.id===id);if(!p)return;
  if(p.kind==="abschluss"){await pfClose(p);return;}
  /* allgemeiner Vorschlag: Datensatz für eine beliebige Sammlung (z. B. Sensoren, Anforderungen, Morphologischer Kasten) */
  if(p.kind==="daten"){if(!p.coll||!p.payload||typeof p.payload!=="object"){alert2("Dieser Eintrag ist unvollständig (Sammlung oder Inhalt fehlt).");return;}
    if(!COLLS.includes(p.coll)){alert2("Die Sammlung „"+p.coll+"“ gibt es im Cockpit nicht. Bitte im Eintrag korrigieren.");return;}
    const did=p.docId||nid();if(await save(p.coll,did,p.payload))await save("postfach",id,Object.assign({},p,{status:"übernommen",ziel:p.coll+"/"+did}));return;}
  if(p.kind==="kilog"){const kid=nid();const day=p.date||new Date().toISOString().slice(0,10);
    if(await save("kilog",kid,{date:day,help:p.detail||p.title||"",fach:!!p.fach}))await save("postfach",id,Object.assign({},p,{status:"übernommen",ziel:"kilog/"+kid}));
    return;}
  let target=null,obj=null;
  if(p.alt){const r=pfAltRecord(p);if(r&&PF_KIND_COLL[p.kind]===r.coll){target=r.coll;obj=r.obj;}}
  if(!obj){
    const base={title:p.title||"",note:p.detail||"",source:p.vorschlag||"",date:p.date||"",status:p.stand||"offen",prio:"2",who:"",due:"",by:"",reason:"",topic:"",docs:"",refs:""};
    const map={
      aufgabe:["tasks",Object.assign({},base,{who:"Janek",chat:""})],
      entscheidung:["tasks",Object.assign({},base,{typ:"entscheidung"})],
      aenderung:["changes",{ver:"",date:p.date||"",chap:"",change:p.title||"",reason:p.detail||"",by:p.vorschlag||""}]
    };
    const m=map[p.kind];
    if(!m){alert2("Diese Art ist unbekannt. Bitte im Eintrag die Zielkategorie wählen.");return;}
    target=m[0];obj=m[1];
  }
  if(target==="tasks"){if(p.who)obj.who=p.who;if(p.ask)obj.ask=p.ask;if(p.due)obj.due=p.due;if(p.prio)obj.prio=p.prio;}
  const newId=nid();
  const ok=await save(target,newId,obj);
  if(ok)await save("postfach",id,Object.assign({},p,{status:"übernommen",ziel:target+"/"+newId}));
}

/* Freitage (jeden Freitag) als öffnbare Termine, standardmäßig eingeklappt */
const FR_VON="2026-11-01",FR_BIS="2027-06-30";
/* Zuordnung eines Fälligkeitsdatums: früheste offene Termin am oder nach dem Datum, sonst der Freitag am oder nach dem Datum (gleicher Tag: echter Termin) */
function terminFor(due){
  if(!due)return null;
  const fd0=new Date(due+"T12:00:00");fd0.setDate(fd0.getDate()+(5-fd0.getDay()+7)%7);
  const fri=fd0.getFullYear()+"-"+String(fd0.getMonth()+1).padStart(2,"0")+"-"+String(fd0.getDate()).padStart(2,"0");
  const real=S.data.deadlines.filter(x=>x.status!=="erledigt"&&x.date&&x.date>=due).sort((a,b)=>a.date<b.date?-1:1)[0];
  if(real&&real.date<=fri)return real;
  return frDeadline("fr-"+fri);
}
function frList(){const out=[];const d=new Date(FR_VON+"T12:00:00");d.setDate(d.getDate()+(5-d.getDay()+7)%7);const bis=new Date(FR_BIS+"T12:00:00");
  while(d<=bis){out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));d.setDate(d.getDate()+7);}return out;}
function frBlock(){const show=lsGet("frShow",false);const fr=frList();
  return `<div class="toolbar" style="margin-top:14px"><label class="small"><input type="checkbox" id="frshow" ${show?"checked":""}> Freitage anzeigen (${fr.length})</label></div>`+
    (show?`<div class="grid g2">${fr.map(f=>{const n=(S.data.checks||[]).find(c=>c.id==="fr-"+f||c.termin==="fr-"+f);return `<div class="panel click" data-termin="fr-${esc(f)}"><b>${esc(fd(f))}</b> <span class="small muted">Freitag${n?" · Checkliste "+(n.items||[]).filter(x=>x.done).length+"/"+(n.items||[]).length:""}</span></div>`;}).join("")}</div>`:"");}

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
function icsFold(l){const o=[];let s=l;while(s.length>60){o.push(s.slice(0,60));s=" "+s.slice(60);}o.push(s);return o.join("\r\n");}
function buildIcs(){
  const ymd=s=>s.replace(/-/g,"");
  const nextDay=s=>{const d=pd(s);d.setDate(d.getDate()+1);return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");};
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//TA-Cockpit//Technikerarbeit//DE","CALSCALE:GREGORIAN","X-WR-CALNAME:Technikerarbeit Termine"];
  S.data.deadlines.filter(d=>d.date&&d.status!=="erledigt").forEach(d=>{
    L.push("BEGIN:VEVENT","UID:"+d.id+"@ta-cockpit","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(d.date),"DTEND;VALUE=DATE:"+nextDay(d.date),"SUMMARY:"+icsEsc((d.approx?"ca. ":"")+d.title),"DESCRIPTION:"+icsEsc((d.kind==="betrieb"?"Betrieb":"Schule")+(d.note?" – "+d.note:"")),"END:VEVENT");});
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}

function refTokens(s){return String(s||"").split(/[,;]/).map(t=>t.trim().toLowerCase().replace(/^anf\.?\s*/,"")).filter(Boolean);}
function linkedFor(q){
  const toks=refTokens(q.refs);const out=[];
  (S.data.decisions||[]).forEach(d=>{if(toks.includes(String(d.id).toLowerCase()))out.push({c:"decisions",id:d.id,kind:"Entscheidung",label:d.text,status:d.status,opts:[["entfallen","Entfällt"],["bestätigt","Bestätigt"]]});});
  (S.data.conflicts||[]).forEach(c=>{if(toks.includes(String(c.id).toLowerCase()))out.push({c:"conflicts",id:c.id,kind:"Widerspruch",label:c.text,status:c.status,opts:[["geklärt","Geklärt"]]});});
  (S.data.reqs||[]).forEach(r=>{if(toks.includes(String(r.nr||"").toLowerCase()))out.push({c:"reqs",id:r.id,kind:"Anforderung",label:(r.nr?r.nr+" ":"")+(r.text||""),status:r.status,opts:[["bestätigt","Bestätigt"]]});});
  return out;
}

  $("#modal").innerHTML=`<div class="modal-bg" data-close="1"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Abgleich">
    <div class="toolbar" style="justify-content:space-between;align-items:flex-start"><div><span class="tag">Frage ${stPill(q.status)}</span><h2 style="margin:6px 0">${esc(q.q)}</h2><p class="small muted" style="margin:0">${q.answer?"Antwort: "+esc(q.answer):"Keine Antwort eingetragen."}</p></div><button class="btn" data-close="1">Schließen</button></div>

    <label for="c_cs" class="calc"><span class="note">Lagerung</span><select id="c_cs">${Object.entries(CASES).map(([k,m])=>`<option value="${k}" ${c.cs===k?"selected":""}>${m.n}</option>`).join("")}</select></label>
    <div class="res" id="r_bend"></div>

    <p class="note">n = L/Δx + 1 Querschnitte; t = n·(t_Messung + t_Verfahren) + t_Handling. Alternative zur schrittweisen Messung: Helix-Abtastung (Rohr dreht, Achse fährt gleichzeitig) – ob zulässig, ist eine offene Frage an den Betrieb.</p></div>

VIEWS_after.rechner=()=>{
  const ids=["mat","E","D","s","L","cs","fz","len","dx","tq","tv","th","dmin","dmax","tol"];
  const run=()=>{
    const c={};ids.forEach(k=>{const el=$("#c_"+k);if(el)c[k]=el.value;});lsSet("calc",c);
    const m=MAT[c.mat];const E=(isFinite(num(c.E))&&num(c.E)>0?num(c.E):m.E)*1000;// N/mm²
    const D=num(c.D),s=num(c.s),L=num(c.L),fz=num(c.fz),k=CASES[c.cs].k;
    const d=D-2*s;let h;
    if(!(D>0)||!(s>0)||d<0||!(L>0))h=`<span class="muted">Bitte D, s und L eingeben (s kleiner als D/2).</span>`;
    else{const A=Math.PI/4*(D*D-d*d),I=Math.PI/64*(Math.pow(D,4)-Math.pow(d,4));const qN=m.rho*1e-6*A*9.81;const f=k*qN*Math.pow(L,4)/(E*I);
      const Lmax=fz>0?Math.pow(fz*E*I/(k*qN),0.25):NaN;
      h=`<div>Durchbiegung f = <span class="v">${f2(f*1000,1)} µm</span> <span class="muted">(${f2(f,4)} mm)</span></div>
      <div class="small">Masse je Meter ${f2(qN/9.81*1000*1000,1)} g/m · I = ${f2(I,4)} mm⁴ · E = ${f2(E/1000,0)} GPa</div>
      ${fz>0?`<div>Größter Stützabstand für f ≤ ${f2(fz,3)} mm: <span class="v">${f2(Lmax,0)} mm</span> → bei ${f2(num(c.len)||3000,0)} mm Rohrlänge etwa ${f2(Math.ceil((num(c.len)||3000)/Lmax)+1,0)} Stützen</div>`:""}
      ${fz>0?(f<=fz?pill("zulässig","p-ok"):pill("zu groß","p-bad")):""}`;}
    $("#r_bend").innerHTML=h;
    const len=num(c.len),dx=num(c.dx),tq=num(c.tq),tv=num(c.tv),th=num(c.th);
    if(len>0&&dx>0){const n=Math.floor(len/dx)+1;const t=n*((tq||0)+(tv||0))+(th||0);
      $("#r_takt").innerHTML=`<div>Querschnitte n = <span class="v">${f2(n,0)}</span></div><div>Taktzeit ≈ <span class="v">${f2(t/60,1)} min</span> <span class="muted">(${f2(t,0)} s)</span></div><div class="small">Rohre pro 8-h-Schicht ≈ ${f2(Math.floor(8*3600/t),0)}</div>`;}
    else $("#r_takt").innerHTML=`<span class="muted">Rohrlänge und Messpunktabstand eingeben.</span>`;
    const dmin=num(c.dmin),dmax=num(c.dmax),tol=num(c.tol);
    const ss=S.data.sensors;
    $("#r_sens").innerHTML=ss.length?`<div class="tbl"><table><thead><tr><th>Sensor</th><th>Bereich</th><th>Ø-Bereich</th><th>Genauigkeit</th></tr></thead><tbody>${ss.map(x=>{
      const rok=isFinite(x.rmin)&&isFinite(x.rmax)&&x.rmin!==""&&x.rmax!==""?(x.rmin<=dmin&&x.rmax>=dmax?pill("deckt ab","p-ok"):pill("deckt nicht ab","p-bad")):pill("Daten fehlen");
      const a=num(x.acc);const aok=isFinite(a)&&tol>0?(a<=tol/10?pill("≤ T/10","p-ok"):a<=tol/5?pill("≤ T/5","p-warn"):pill("> T/5","p-bad")):pill("Daten fehlen");
      return `<tr><td>${esc(x.maker)} ${esc(x.model)}</td><td class="num">${x.rmin!==""&&x.rmin!=null?f2(x.rmin)+"–"+f2(x.rmax)+" mm":"–"}</td><td>${rok}</td><td>${aok}</td></tr>`;}).join("")}</tbody></table></div>`:`<div class="empty">Noch keine Sensoren angelegt.</div>`;
  };
  ids.forEach(k=>{const el=$("#c_"+k);if(el){el.oninput=run;el.onchange=run;}});run();
};

function xlsxCol(i){let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function xmlEsc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
async function buildXlsx(sheetName,headers,rows){
  const JSZip=await loadZip();const z=new JSZip();
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const cell=(v,ref)=>{if(typeof v==="number"&&isFinite(v))return `<c r="${ref}"><v>${v}</v></c>`;if(v===""||v==null)return "";return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;};
  const sd=[headers,...rows].map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>cell(v,xlsxCol(ci)+(ri+1))).join("")}</row>`).join("");
  z.file("[Content_Types].xml",H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>');
  z.file("_rels/.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file("xl/workbook.xml",H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xmlEsc(sheetName)+'" sheetId="1" r:id="rId1"/></sheets></workbook>');
  z.file("xl/_rels/workbook.xml.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>');
  z.file("xl/worksheets/sheet1.xml",H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+sd+'</sheetData></worksheet>');
  return z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

 "lsm-9506": {"m": 37.5, "a": "rot", "t": "1D", "n": 1501}, "xls13xy-480": {"m": 37.5, "a": "rot", "t": "1D", "n": 1501}, "xls13xy-1500": {"m": 37.5, "a": "rot", "t": "1D", "n": 1501}, "xls35xy-480": {"m": 37.5, "a": "rot", "t": "1D", "n": 1501}, "xls35xy-1500": {"m": 37.5, "a": "rot", "t": "1D", "n": 1501}, "mws0ln0abedtb": {"m": 37.5, "a": "rot", "t": "1D", "n": 1501}, "mws0lnc4mbahq": {"m": 37.5, "a": "rot", "t": "1D", "n": 1501}, "mws0lnnai0kol": {"m": 37.5, "a": "rot", "t": "1D", "n": 1501}};

/* ---------- Bewertung ---------- */
const EVAL_DEF={criteria:[],pair:{},variants:[],hzul:""};
/* Kriterien: Anforderungsnummer aus dem Namen, Sortierung nach Pflichtenheft, Doppelungen */
const critNr=c=>{const m=/^\s*(\d+(?:\.\d+)*)/.exec((c&&c.name)||"");return m?m[1]:"";};
const critCmp=(a,b)=>{const x=critNr(a),y=critNr(b);if(!x&&!y)return 0;if(!x)return 1;if(!y)return -1;const p=x.split(".").map(Number),q=y.split(".").map(Number);for(let i=0;i<Math.max(p.length,q.length);i++){const d=(p[i]||0)-(q[i]||0);if(d)return d;}return 0;};
function critClean(e){const keep={};const drop=new Set();const info=x=>(e.variants||[]).filter(v=>v.scores&&v.scores[x.id]!==undefined&&v.scores[x.id]!=="").length+Object.keys(e.pair||{}).filter(k=>k.split("|").indexOf(x.id)>=0).length;
  e.criteria.forEach(c=>{const k=critNr(c)||("name:"+c.name);const cur=keep[k];if(!cur){keep[k]=c;return;}if(info(c)>info(cur)){drop.add(cur.id);keep[k]=c;}else drop.add(c.id);});
  if(drop.size){e.criteria=e.criteria.filter(c=>!drop.has(c.id));Object.keys(e.pair||{}).forEach(k=>{if(k.split("|").some(id=>drop.has(id)))delete e.pair[k];});(e.variants||[]).forEach(v=>{if(v.scores)drop.forEach(id=>delete v.scores[id]);});}
  e.criteria.sort(critCmp);return drop.size;}
function weights(e){const n=e.criteria.length;if(!n)return[];const sc=e.criteria.map(()=>0);let any=false;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const v=e.pair[e.criteria[i].id+"|"+e.criteria[j].id];if(v===undefined||v==="")continue;any=true;const p=Number(v);sc[i]+=p;sc[j]+=2-p;}
  const tot=sc.reduce((a,b)=>a+b,0);return !any||!tot?e.criteria.map(()=>1/n):sc.map(s=>s/tot);}
function scoreVar(e,v,w){let s=0;e.criteria.forEach((c,i)=>{const g=Number(v.scores&&v.scores[c.id]);if(isFinite(g))s+=w[i]*g;});return s;}
VIEWS.bewertung=()=>{
  const e=getTool("eval",EVAL_DEF);const ro=!S.canWrite||S.offline;const w=weights(e);
  const fReqs=S.data.reqs.filter(r=>r.art==="F").sort(byNr);
  const res=e.variants.map(v=>{const nw=scoreVar(e,v,w);const x=nw/4;const H=num(v.cost),hz=num(e.hzul);const y=H>0&&hz>0?Math.min(1,0.7*hz/H):NaN;return {v,nw,x,y,ok:v.fOk!==false};});
  const ranked=res.filter(r=>r.ok).sort((a,b)=>b.nw-a.nw);
  let sens="";if(ranked.length>1&&e.criteria.length>1){const top=ranked[0].v.id;const flips=[];
    e.criteria.forEach((c,i)=>{[1.2,0.8].forEach(fac=>{const w2=w.map((x,j)=>j===i?x*fac:x);const t=w2.reduce((a,b)=>a+b,0)||1;const wn=w2.map(x=>x/t);const best=res.filter(r=>r.ok).map(r=>({id:r.v.id,s:scoreVar(e,r.v,wn)})).sort((a,b)=>b.s-a.s)[0];if(best.id!==top)flips.push(`${c.name} ${fac>1?"+":"−"}20 %`);});});
    sens=flips.length?`<div class="banner">Das Ergebnis kippt, wenn sich diese Gewichte ändern: ${esc(flips.join(", "))}. Gewichtung mit dem Betrieb absichern.</div>`:`<p>${pill("robust","p-ok")} Die beste Variante bleibt vorn, auch wenn jedes Gewicht um ±20 % schwankt.</p>`;}
  const n=e.criteria.length;
  const pv=(i,j)=>{const a=e.criteria[i].id,b=e.criteria[j].id;if(i<j){const v=e.pair[a+"|"+b];return v===undefined||v===""?"":Number(v);}const v=e.pair[b+"|"+a];return v===undefined||v===""?"":2-Number(v);};
  let h=`<div class="head"><div><span class="tag">Lösungsphase · Chat 07</span><h1>Bewertung der Varianten</h1><p>Ablauf: 1. Bewertungskriterien festlegen (ca. 5, höchstens 10, positiv formuliert: mehr Punkte = besser), 2. paarweiser Vergleich für Gewichte, 3. Punkte je Variante, 4. Nutzwert und prozentuale Erfüllung, 5. Ergebnis und Empfindlichkeit. Die Entscheidung trifft der Betrieb.</p></div>

  </div>

   <tr><td><b>Prozentuale Erfüllung</b></td><td></td>${e.variants.map((v)=>`<td></td><td class="num"><b>${f2(scoreVar(e,v,w)/4*100,0)} %</b></td>`).join("")}</tr>

   <p class="note">Min. Punktzahl 0, Max. Punktzahl 4. Gewichtet = Punkte × Gewicht. Prozentuale Erfüllung = Summe / 4.</p>
   <div class="toolbar" style="margin-top:8px"><label class="small muted" for="ev_hzul">Zulässige Herstellkosten H<sub>zul</sub> (€)</label><input id="ev_hzul" data-ev="hzul" type="number" step="any" value="${esc(e.hzul)}" ${ro?"readonly":""} style="width:120px"></div>`:'<div class="empty">Varianten und Kriterien anlegen.</div>'}</div>

    <p class="note">Prozentuale Erfüllung = Nutzwert / max. Punkte (4). x = Nutzwert / 4. y nach VDI 2225: 0,7·H<sub>zul</sub>/H (höchstens 1). Ideale Lösung x = y = 1.</p></div>
   <div class="panel"><h3>Stärkediagramm (VDI 2225)</h3>${(()=>{const pts=res.filter(r=>isFinite(r.x)&&isFinite(r.y));let s=`<svg viewBox="0 0 300 300" width="100%" style="max-width:340px" role="img" aria-label="Stärkediagramm technische gegen wirtschaftliche Wertigkeit"><rect x="40" y="10" width="250" height="250" fill="none" stroke="var(--line)"/><line x1="40" y1="260" x2="290" y2="10" stroke="var(--muted)" stroke-dasharray="4 3"/>`;
     [0,0.5,1].forEach(t=>{s+=`<text x="${40+t*250}" y="276" font-size="11" text-anchor="middle" fill="var(--muted)">${f2(t,1)}</text><text x="34" y="${264-t*250}" font-size="11" text-anchor="end" fill="var(--muted)">${f2(t,1)}</text>`;});
     s+=`<text x="165" y="295" font-size="11" text-anchor="middle" fill="var(--muted)">technische Wertigkeit x</text><text x="10" y="135" font-size="11" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 10 135)">wirtschaftliche Wertigkeit y</text>`;
     pts.forEach(r=>{const cx=40+r.x*250,cy=260-r.y*250;s+=`<circle cx="${cx}" cy="${cy}" r="6" fill="${r.ok?"var(--accent)":"var(--off)"}"/><text x="${Math.min(cx+8,250)}" y="${Math.max(cy-8,22)}" font-size="11" fill="var(--ink)">${esc(r.v.name)}</text>`;});
     return s+`</svg>`+(pts.length?"":'<p class="note">Erscheint, sobald Punkte, Kosten und H<sub>zul</sub> eingetragen sind.</p>');})()}</div>
  </div>`;
  return h;
};
VIEWS_after.bewertung=()=>{
  const get=()=>getTool("eval",EVAL_DEF);const put=(e,re)=>{saveTool("eval",e);if(re)render();};
      const ac=$("#ev_addc");if(ac)ac.onclick=()=>{const t=$("#ev_newc").value.trim();if(!t)return;const e=get();e.criteria.push({id:nid(),name:t});put(e,1);};
  const ic=$("#ev_impc");if(ic)ic.onclick=()=>{const e=get();S.data.reqs.filter(r=>r.art==="M"||r.art==="W").sort(byNr).forEach(r=>{const nm=(r.nr?r.nr+" ":"")+(r.text||"").split("\n")[0].slice(0,60);const nr=String(r.nr||"").trim();if(e.criteria.some(c=>c.name===nm||(nr&&critNr(c)===nr)))return;e.criteria.push({id:nid(),name:nm});});e.criteria.sort(critCmp);put(e,1);};
  const cl=$("#ev_clean");if(cl)cl.onclick=()=>{const e=get();critClean(e);put(e,1);};
  document.querySelectorAll("[data-pm]").forEach(el=>el.onchange=()=>{const e=get();const i=+el.dataset.i,j=+el.dataset.j;const a=e.criteria[i].id,b=e.criteria[j].id;const val=el.value===""?"":Number(el.value);if(i<j)e.pair[a+"|"+b]=val;else e.pair[b+"|"+a]=val===""?"":2-val;put(e,1);});
  document.querySelectorAll("[data-evdelc]").forEach(b=>b.onclick=()=>{const e=get();const c=e.criteria.splice(+b.dataset.evdelc,1)[0];Object.keys(e.pair).forEach(k=>{if(k.indexOf(c.id)>=0)delete e.pair[k];});put(e,1);});
  document.querySelectorAll("[data-ev]").forEach(el=>{const h=re=>{const e=get();const t=el.dataset.ev;
    if(t==="fok")e.variants[+el.dataset.v].fOk=el.checked;
    else if(t==="cname")e.criteria[+el.dataset.c].name=el.value;
    else if(t==="pair")e.pair[el.dataset.k]=el.value===""?"":Number(el.value);
    else if(t==="score"){const v=e.variants[+el.dataset.v];v.scores=v.scores||{};v.scores[el.dataset.c]=el.value===""?"":Number(el.value);}
    else if(t==="cost")e.variants[+el.dataset.v].cost=el.value;
    else if(t==="hzul")e.hzul=el.value;
    put(e,re);};
    if(el.tagName==="SELECT"||el.type==="checkbox")el.onchange=()=>h(1);else{el.oninput=()=>h(0);el.onchange=()=>h(1);}});
};

/* ---------- Checklisten ---------- */
async function moveCheckItem(srcId,i,dlId){
  const src=S.data.checks.find(x=>x.id===srcId);const dl=S.data.deadlines.find(x=>x.id===dlId);
  if(!src||!dl)return;const item=(src.items||[])[i];if(!item)return;
  const tgt=checkFor(dl);
  if(tgt&&tgt.id===srcId){alert2("Der Punkt steht schon in dieser Checkliste.");return;}
  const srcC=JSON.parse(JSON.stringify(src));srcC.items.splice(i,1);
  if(!(await save("checks",srcId,srcC)))return;
  if(tgt){const tc=JSON.parse(JSON.stringify(tgt));tc.items=[Object.assign({},item)].concat(tc.items||[]);await save("checks",tgt.id,tc);}
  else{await save("checks",nid(),{title:dl.title,hint:dl.date?fd(dl.date):"",items:[Object.assign({},item)]});}
alert2("Verschoben nach „"+dl.title+"“.");
}
/* Datum einer Checkliste: eigenes Datum, sonst Freitag bzw. verknüpfter Termin */
function ckDate(c){
  if(c.datum)return c.datum;
  if(String(c.id).startsWith("fr-"))return String(c.id).slice(3);
  if(c.termin){const d=S.data.deadlines.find(x=>x.id===c.termin);if(d&&d.date)return d.date;}
  return "9999-12-31";
}

  const upd=async(id,fn)=>{const l=S.data.checks.find(x=>x.id===id);if(!l)return;const c=JSON.parse(JSON.stringify(l));c.items=c.items||[];fn(c);await save("checks",id,c);};

async function getBlob(f){
  if(!fileUrl(f))throw new Error("Die Datei liegt im PC-Archiv, nicht in der Web-Fassung.");let r=await fetch(fileUrl(f));if(!r.ok&&f.path)r=await fetch(RAWB+encPath(f.path));if(!r.ok)throw new Error("Datei nicht erreichbar ("+r.status+"). Frisch hochgeladene Dateien sind nach ca. 1 Minute da.");

    (list.length?`<div class="tbl"><table><tbody>${list.map(f=>`<tr><td>${esc(f.family)} <span class="small muted">${esc(f.ver||"")}</span></td><td class="small">${esc(f.name)}</td><td>${fileBtns(f,true)}</td></tr>`).join("")}</tbody></table></div>`:"")+
    (missing.length?`<p class="small muted">Noch nicht im Archiv: ${esc(missing.join(", "))}</p>`:"");
}
/* Offene Aufgaben und Entscheidungen als Punkte in eine Checkliste übernehmen */
function ckTaskOpts(){return S.data.tasks.filter(t=>t.status!=="erledigt").sort(sortDue).map(t=>`<option value="${esc(t.id)}">${t.typ==="entscheidung"?"Entscheidung: ":""}${esc(t.title)}</option>`).join("");}
async function addTaskToCheck(ckId,taskId){
  const t=S.data.tasks.find(x=>x.id===taskId),ck=S.data.checks.find(x=>x.id===ckId);if(!t||!ck)return;
  if((ck.items||[]).some(x=>x.ref==="tasks/"+t.id))return;
  const c=JSON.parse(JSON.stringify(ck));c.items=(c.items||[]).concat([{t:t.title,done:false,ref:"tasks/"+t.id}]);await save("checks",ck.id,c);
}
/* Fälligkeit → Checkliste des Termins bzw. Freitags: jede Aufgabe mit Datum steht dort, wo sie erledigt werden muss */
function ckIdFor(tg){
  if(String(tg.id).startsWith("fr-"))return {id:tg.id,create:{title:fd(tg.date),hint:"",items:[],termin:tg.id}};
  const ex=checkFor(tg);if(ex)return {id:ex.id,create:null};
  return {id:"dl-"+tg.id,create:{title:tg.title,hint:tg.date?fd(tg.date):"",items:[],termin:tg.id}};
}
async function syncTaskCheck(tid,task){
  try{
    const ref="tasks/"+tid;const done=task.status==="erledigt";
    const tg=task.due?terminFor(task.due):null;
    let tgtId=null,spec=null;
    if(tg){const r=ckIdFor(tg);tgtId=r.id;spec=r.create;}
    for(const c of (S.data.checks||[])){
      const has=(c.items||[]).some(x=>x.ref===ref);const should=c.id===tgtId;
      if(!has&&!should)continue;
      const cc=JSON.parse(JSON.stringify(c));
      cc.items=(cc.items||[]).filter(x=>x.ref!==ref);
      if(should)cc.items.push({t:task.title||"",done:done,ref:ref});
      await save("checks",c.id,cc);
    }
    if(tgtId&&!(S.data.checks||[]).some(c=>c.id===tgtId)){
      await save("checks",tgtId,Object.assign({},spec,{items:[{t:task.title||"",done:done,ref:ref}]}));
    }
  }catch(e){console.error("Checkliste konnte nicht aktualisiert werden",e);}
}
function prepHtml(d){
  const ro=!S.canWrite||S.offline;
  const ck=checkFor(d);
  if(!ck)return `<div class="tsec"><h3>Checkliste</h3><p class="muted small">Für diesen Termin gibt es noch keine Checkliste.</p>${ro?"":'<button class="btn sm" data-mkck="1">Checkliste anlegen</button>'}</div>`;
  const items=ck.items||[];const n=items.filter(x=>x.done).length;
  return `<div class="tsec"><h3>Checkliste <span class="small muted">${n} von ${items.length} erledigt</span></h3>
    <p class="note" style="margin:0 0 6px">Checkliste „${esc(ck.title)}“. Abhaken geht direkt hier.</p>
    <ul class="clean">${items.map((it,i)=>`<li style="padding:4px 0"><label style="display:flex;gap:8px;align-items:flex-start;cursor:${ro?"default":"pointer"}"><input type="checkbox" data-chk="${esc(ck.id)}|${i}" ${it.done?"checked":""} ${ro?"disabled":""} style="margin-top:4px"><span class="${it.done?"muted":""}" style="${it.done?"text-decoration:line-through":""}">${esc(it.t)}</span></label></li>`).join("")}</ul>${ro?"":`<div style="margin-top:8px;min-width:0"><select data-ckaddtask="${esc(ck.id)}" aria-label="Aufgabe oder Entscheidung hinzufügen" style="width:100%;max-width:100%;box-sizing:border-box"><option value="">+ offene Aufgabe oder Entscheidung hinzufügen …</option>${ckTaskOpts()}</select></div>`}</div>`;
}
/* neueste Version der Kerndokumente (Aufgabenstellung, Pflichtenheft, Projektplan) */
function latestDocsHtml(){
  const keep=S.data.files.filter(f=>!f.missing&&/^(2 Aufgabenstellung|3 Pflichtenheft|4 Projektplan)$/.test(f.folder||""));
  const fam={};keep.forEach(f=>{const k=f.family||f.name;if(!fam[k]||(+f.seq||0)>(+fam[k].seq||0))fam[k]=f;});
  const list=Object.values(fam);
  if(!list.length)return "";
  return `<h4 style="margin:12px 0 4px">Aktuelle Unterlagen (neueste Version)</h4><div class="tbl"><table><tbody>${list.map(f=>`<tr><td>${esc(f.family||f.name)} <span class="small muted">${esc(f.ver||"")}</span></td><td class="small">${esc(f.name)}</td><td>${fileBtns(f,true)}</td></tr>`).join("")}</tbody></table></div>`;
}
function frDeadline(id){const rec=(S.data.freitage||[]).find(x=>x.id===id)||{};return Object.assign({id,title:"Freitag, "+fd(String(id).slice(3)),date:String(id).slice(3),kind:"betrieb",status:"geplant",note:"",approx:false,log:[]},rec,{id});}
function renderTermin(first){
  const isFr=String(S.terminId||"").startsWith("fr-");
  const d=isFr?frDeadline(S.terminId):S.data.deadlines.find(x=>x.id===S.terminId);if(!d){closeModal();return;}
  const coll=isFr?"freitage":"deadlines";
  const ro=!S.canWrite||S.offline;const n=d.date?days(d.date):null;
  const files=S.data.files.filter(f=>f.deadline===d.id).sort((a,b)=>(b.updated||"").localeCompare(a.updated||""));
  const log=(d.log||[]).slice().reverse();
  const tasks=S.data.tasks.filter(t=>t.status!=="erledigt"&&t.due&&d.date&&(isFr?terminFor(t.due).id===d.id:t.due<=d.date)).sort(sortDue);
  const draft=($("#tlog")||{}).value||"";
  $("#modal").innerHTML=`<div class="modal-bg" data-close="1"><div class="modal wide" role="dialog" aria-modal="true" aria-label="${esc(d.title)}">
   <div class="toolbar" style="justify-content:space-between;align-items:flex-start"><div><span class="tag">${d.kind==="betrieb"?"Betrieb":"Schule"} · Termin</span><h2>${esc(d.title)}</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap">${ro||isFr?"":`<button class="btn danger" id="tdel">${S.tDelSure===d.id?"Wirklich löschen?":"Termin löschen"}</button>`}<button class="btn" data-close="1">Schließen</button></div></div>
   <div class="hero" style="margin:10px 0 0">
    <div class="big"><div class="l">Datum</div><div class="n" style="font-size:30px">${d.approx?"ca. ":""}${fd(d.date)}</div><div class="l">${n==null?"":n<0?-n+" Tage vorbei":n===0?"heute":"in "+n+" Tagen"}</div></div>
    <div class="big"><div class="l">Status</div><div style="margin:8px 0">${stPill(d.status)}</div>${ro||isFr?"":`<div class="toolbar" style="margin:0">${["geplant","erledigt"].filter(s=>s!==d.status).map(s=>`<button class="btn sm" data-tstat="${s}">auf „${s}“</button>`).join("")}</div>`}</div>
   </div>
   ${d.note?`<p>${nl(d.note)}</p>`:""}
   ${ro||isFr?"":`<button class="btn sm" id="tedit">Termin bearbeiten</button>`}
   <div class="tgrid">${prepHtml(d)}<div><div class="tsec" style="margin-top:0"><h3>Dateien zu diesem Termin</h3>${files.length?files.map(f=>`<div class="tfrow"><span title="${esc(f.name)}">${esc(String(f.name||"").replace(/\.[^.]+$/,""))}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${fileBtns(f,true)}${ro?"":`<button class="btn sm" data-tfdel="${esc(f.id)}">Entfernen</button>`}</span></div>`).join(""):'<p class="muted small">Noch keine Dateien.</p>'}${ro?"":`<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Aus dem Archiv hinzufügen</summary><div style="margin-top:6px">${pickHtml(S.data.files.filter(f=>!f.missing&&f.deadline!==d.id))}</div></details>`}    ${!ro&&S.assets?`<div class="form" style="margin-top:8px"><div><label class="btn pri" for="tupl" style="display:inline-block">Datei hochladen</label><input id="tupl" type="file" hidden> <span id="tuplmsg" class="small muted"></span></div></div>`:(!S.assets&&!S.offline?'<p class="note">Hochladen ist in dieser Ansicht nicht möglich.</p>':"")}</div></div></div>
   <div class="tsec"><h3>Vorzubereiten: offene Punkte bis zu diesem Termin (${tasks.length})</h3>${tasks.length?`<ul class="clean">${tasks.map(t=>`<li class="step"><b class="k">${esc(t.prio||"")}</b><div>${esc(t.title)}<div class="small muted">${esc(t.who||"")} · ${dueCell(t.due,false)}</div></div></li>`).join("")}</ul>`:'<p class="muted small">Keine offenen Punkte mit Frist bis zu diesem Termin.</p>'}</div>
   <div class="tsec"><h3>Notizen</h3>
    ${ro?"":`<div class="form" style="margin-top:4px"><label for="tlog">Neue Notiz<textarea id="tlog" placeholder="z. B. Antwort von Hr. Baidinger, Ergebnis des Termins">${esc(draft)}</textarea></label><div><button class="btn pri" id="tlogsave">Notiz speichern</button></div></div>`}
    ${log.length?log.map(l=>`<div class="logi"><div class="small muted num">${new Date(l.at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}${l.by?" · "+esc(l.by):""}</div>${nl(l.t)}</div>`).join(""):'<p class="muted small">Noch keine Notizen.</p>'}

   <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn pri" id="tsave">Speichern</button></div>
  </div></div>`;
  const tmb=document.querySelector("#modal .modal-bg");if(tmb){tmb.style.position="absolute";tmb.style.top="0";tmb.style.left="0";tmb.style.right="0";tmb.style.minHeight="100vh";tmb.style.overflow="visible";if(first)window.scrollTo(0,0);}
  if(first){const c=$("#modal [data-close]:not(.modal-bg)");if(c)c.focus();}
  const upd=async ch=>{const cur=S.data[coll].find(x=>x.id===d.id)||d;await save(coll,d.id,Object.assign({},cur,ch));};
  document.querySelectorAll("[data-tstat]").forEach(b=>b.onclick=()=>upd({status:b.dataset.tstat}));
  document.querySelectorAll("[data-ckaddtask]").forEach(sel=>sel.onchange=()=>addTaskToCheck(sel.dataset.ckaddtask,sel.value));
  document.querySelectorAll("[data-mkck]").forEach(b=>b.onclick=async()=>{if(String(d.id).startsWith("fr-")){if(!checkFor(d))await save("checks",d.id,{title:fd(d.date),hint:"",items:[],termin:d.id});return;}const fams=String(d.unterlagen||"").split(",").map(x=>x.trim()).filter(Boolean);if(!(S.data.checks||[]).some(c=>c.title===d.title))await save("checks",nid(),{title:d.title,hint:d.date?fd(d.date):"",items:[]});});
  document.querySelectorAll("[data-tfadd]").forEach(b=>b.onclick=async()=>{const f=S.data.files.find(x=>x.id===b.dataset.tfadd);if(f)await save("files",f.id,Object.assign({},f,{deadline:d.id}));});
  document.querySelectorAll("[data-tfdel]").forEach(b=>b.onclick=async()=>{const f=S.data.files.find(x=>x.id===b.dataset.tfdel);if(f)await save("files",f.id,Object.assign({},f,{deadline:""}));});
  const te=$("#tedit");if(te)te.onclick=()=>{S.terminId=null;openEditor("deadlines",d.id);};
  document.querySelectorAll("[data-chk]").forEach(b=>b.onchange=async()=>{const [cid,i]=b.dataset.chk.split("|");const c=S.data.checks.find(x=>x.id===cid);if(!c)return;const items=(c.items||[]).map((x,j)=>j===+i?Object.assign({},x,{done:b.checked}):x);await save("checks",cid,Object.assign({},c,{items}));});
  const tdl=$("#tdel");if(tdl)tdl.onclick=async()=>{if(S.tDelSure===d.id){tdl.disabled=true;S.tDelSure=null;await del("deadlines",d.id);closeModal();}else{S.tDelSure=d.id;tdl.textContent="Wirklich löschen?";setTimeout(()=>{if(S.tDelSure===d.id){S.tDelSure=null;const b=$("#tdel");if(b)b.textContent="Termin löschen";}},5000);}};
  const addNote=async()=>{const t=$("#tlog").value.trim();if(!t)return null;const cur=S.data[coll].find(x=>x.id===d.id)||d;const e={t,at:new Date().toISOString(),by:"Janek"};const lg=(cur.log||[]).concat([e]);$("#tlog").value="";await upd({log:lg});return e;};
  const ls=$("#tlogsave");if(ls)ls.onclick=async()=>{ls.disabled=true;await addNote();ls.disabled=false;};
  const tsv=$("#tsave");if(tsv)tsv.onclick=async()=>{const tx=($("#tlog")||{}).value||"";if(tx.trim())await addNote();closeModal();};
  const u=$("#tupl");if(u)u.onchange=async()=>{const f=u.files[0];if(!f)return;const m=$("#tuplmsg");m.textContent="Lädt hoch …";
    try{const st=await storeFile(f);await save("files",null,Object.assign(st,{name:f.name,folder:"9 Uploads zu Terminen",family:d.title||f.name,ver:fd(new Date().toISOString().slice(0,10)),seq:Date.now()/1e10,date:new Date().toISOString().slice(0,10),kind:/image/.test(f.type)?"Foto":"Sonstiges",note:($("#tfnote")||{}).value||"",deadline:d.id}));m.textContent="Hochgeladen: "+f.name+" (auch im Archiv)";}
    catch(e){m.textContent="Hochladen hat nicht geklappt: "+(e&&(e.code==="unsupported_type"?"Dateityp wird nicht unterstützt":e.message)||"unbekannter Fehler");}};
}



/* ---------- Offener Punkt: Was muss ich tun? ---------- */
function openTask(id){S.taskId=id;S.modalOpen=true;renderTask(true);}
function renderTask(first){
  const t=S.data.tasks.find(x=>x.id===S.taskId);if(!t){closeModal();return;}
  const ro=!S.canWrite||S.offline;
  const dl=t.due?terminFor(t.due):null;
  $("#modal").innerHTML=`<div class="modal-bg" data-close="1"><div class="modal wide" role="dialog" aria-modal="true" aria-label="${esc(t.title)}">
   <div class="toolbar" style="justify-content:space-between;align-items:flex-start"><div><span class="tag">Offener Punkt${t.prio?" · Prio "+esc(t.prio):""}</span><h2>${esc(t.title)}</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap">${ro?"":`<button class="btn sm" id="kedit">Bearbeiten</button>`}<button class="btn" data-close="1">Schließen</button></div></div>
   <p class="small muted" style="margin:4px 0">${esc(t.who||"")}${t.chat?" · Chat "+esc(t.chat):""} · ${dueCell(t.due,false)} · ${stPill(t.status)}${dl?` · vor Termin „<a href="#" id="dllink">${esc(dl.title)}</a>“`:""}</p>
   ${t.note?`<p>${nl(t.note)}</p>`:""}
   ${ro?"":`<div class="tsec"><h3>Status</h3><div class="toolbar" style="margin:0">${["offen","in Arbeit","erledigt"].filter(s=>s!==t.status).map(s=>`<button class="btn sm" data-kstat="${s}">auf „${s}“</button>`).join("")}</div></div>`}
  </div></div>`;
  if(first){const c=$("#modal [data-close]:not(.modal-bg)");if(c)c.focus();}
  const ke=$("#kedit");if(ke)ke.onclick=()=>{S.taskId=null;openEditor("tasks",t.id);};
  const dll=$("#dllink");if(dll)dll.onclick=ev=>{ev.preventDefault();S.taskId=null;openTermin(dl.id);};

  document.querySelectorAll("[data-kstat]").forEach(b=>b.onclick=async()=>{const cur=S.data.tasks.find(x=>x.id===t.id)||t;await save("tasks",t.id,Object.assign({},cur,{status:b.dataset.kstat}));if(b.dataset.kstat==="erledigt")closeModal();});
}

/* ---------- Events ---------- */
document.addEventListener("click",ev=>{
  if(ev.target.closest("#srchbtn")){palOpenUi();return;}
  const ab=ev.target.closest("[data-abgl]");if(ab){ev.preventDefault();openAbgleich(ab.dataset.abgl);return;}
  const as=ev.target.closest("[data-abset]");if(as){ev.preventDefault();const [c,id,s]=as.dataset.abset.split("|");const qid=S.abglQ;setLinked(c,id,s).then(()=>{if(qid)openAbgleich(qid);});return;}
  const wi=ev.target.closest("[data-wpitem]");if(wi){ev.preventDefault();const [c,id,view]=wi.dataset.wpitem.split("|");closeModal();palOpen(c,view,id);return;}
  const dl=ev.target.closest("[data-dl]");if(dl){ev.preventDefault();ev.stopPropagation();const f=S.data.files.find(x=>x.id===dl.dataset.dl);if(f)dlFile(f,dl);return;}
  if(ev.target.closest("[data-noedit],.fchip a"))return;
  const tt=ev.target.closest("[data-termin]");if(tt&&!S.modalOpen){ev.preventDefault();openTermin(tt.dataset.termin);return;}
  const tk=ev.target.closest("[data-task]");if(tk&&!S.modalOpen){ev.preventDefault();openTask(tk.dataset.task);return;}
  const t=ev.target.closest("[data-new],[data-edit],[data-close]");if(!t)return;
  if(t.dataset.close!==undefined&&(ev.target===t)){closeModal();return;}
  if(t.dataset.new){openEditor(t.dataset.new,null);return;}
  if(t.dataset.edit){ev.preventDefault();openEditor(t.dataset.edit,t.dataset.id);}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&S.modalOpen)closeModal();if((ev.key==="Enter"||ev.key===" ")&&ev.target.dataset&&ev.target.dataset.termin&&!S.modalOpen){ev.preventDefault();openTermin(ev.target.dataset.termin);}if((ev.key==="Enter"||ev.key===" ")&&ev.target.dataset&&ev.target.dataset.task&&!S.modalOpen){ev.preventDefault();openTask(ev.target.dataset.task);}});
function route(){const h=(location.hash||"").slice(1);S.view=VIEWS[h]?h:"start";if(S.modalOpen){$("#modal").innerHTML="";S.modalOpen=false;}render();window.scrollTo(0,0);}
window.addEventListener("hashchange",route);
const v0=(location.hash||"").slice(1);if(VIEWS[v0])S.view=v0;
/* ---------- Suchpalette ---------- */
const pal=document.createElement("div");pal.id="palette";
pal.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-label="Suche"><input id="palq" type="text" placeholder="Suchen oder Befehl eingeben …" autocomplete="off" aria-label="Suche"><ul id="pall"></ul><div class="hint">Pfeiltasten wählen · Enter öffnen · Esc schließen</div></div>';
document.body.appendChild(pal);
let palSel=0,palItems=[];
function palOpen(c,view,id){
  if(c==="tasks"){openTask(id);return;}
  if(c==="deadlines"){openTermin(id);return;}
  if(S.canWrite&&!S.offline&&LISTS[c]){openEditor(c,id);return;}
  location.hash="#"+view;
}
function palBuild(q){
  const nrm=s=>String(s||"").toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const t=nrm(q).trim().split(/\s+/).filter(Boolean);
  const hit=(label,extra)=>{const l=nrm(label);const h=l+" "+extra.map(nrm).join(" ");if(!t.every(w=>h.includes(w)))return -1;return t.every(w=>l.includes(w))?2:1;};
  const out=[];
  NAV.forEach(g=>g[1].forEach(([k,l])=>{if(!t.length||hit(l,[])>=0)out.push({k:"Seite",label:l,score:3,go:()=>{location.hash="#"+k;}});}));
  if(S.canWrite&&!S.offline)NEWS.forEach(([c,l])=>{if(!t.length||hit(l,[])>=0)out.push({k:"Neu anlegen",label:l,score:t.length?1.5:0,go:()=>openEditor(c,null)});});
  if(t.length)SRC.forEach(([c,kind,view,lab,ext])=>{(S.data[c]||[]).forEach(r=>{const s=hit(lab(r),ext(r));if(s>=0)out.push({k:kind,label:String(lab(r)||"(ohne Titel)").slice(0,140),score:s,go:()=>palOpen(c,view,r.id)});});});
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,40);
}
function palRender(){
  palItems=palBuild($("#palq").value);palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $("#pall").innerHTML=palItems.length?palItems.map((it,i)=>`<li data-pi="${i}" class="${i===palSel?"sel":""}"><span class="k">${esc(it.k)}</span><span class="t">${esc(it.label)}</span></li>`).join(""):'<li style="cursor:default" class="muted">Nichts gefunden.</li>';
  const el=$("#pall .sel");if(el)el.scrollIntoView({block:"nearest"});
}
function palOpenUi(){if(S.modalOpen)return;pal.classList.add("on");const q=$("#palq");q.value="";palSel=0;palRender();q.focus();}
function palClose(){pal.classList.remove("on");}
function palGo(i){const it=palItems[i];if(!it)return;palClose();it.go();}
pal.addEventListener("click",e=>{if(e.target===pal){palClose();return;}const li=e.target.closest("[data-pi]");if(li)palGo(+li.dataset.pi);});
$("#palq").addEventListener("input",()=>{palSel=0;palRender();});
$("#palq").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);palRender();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);palRender();}
  else if(e.key==="Enter"){e.preventDefault();palGo(palSel);}
  else if(e.key==="Escape"){e.preventDefault();palClose();}});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||"")&&!S.modalOpen){e.preventDefault();palOpenUi();}});
boot();
})();
</script>
