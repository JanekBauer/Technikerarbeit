<script>
/* Web-Fassung: ersetzt die Claude-Datenbank. Lesen aus den eingebetteten Daten,
   Schreiben (Bearbeiten/Löschen) als Commit in cockpit/daten/*.json über die GitHub-API,
   sobald in diesem Browser ein Zugriffstoken gespeichert ist. */
(function(){
  var REPO="__REPO__",BRANCH="__BRANCH__",DIR="cockpit/daten/";
  var DATA=JSON.parse(document.getElementById("cockpit-data").textContent);
  var listeners={};
  function tok(){try{return localStorage.getItem("ta_gh_token")||"";}catch(e){return "";}}
  function toB64(s){return btoa(unescape(encodeURIComponent(s)));}
  function fromB64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,""))));}
  function api(path,opt){
    opt=opt||{};
    opt.headers=Object.assign({"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json"},opt.headers||{});
    return fetch("https://api.github.com/repos/"+REPO+path,opt).then(function(r){
      if(r.ok)return r.json();
      return r.text().then(function(t){var e=new Error("GitHub "+r.status+": "+t.slice(0,160));e.status=r.status;throw e;});
    });
  }
  function fmt(arr){return "[\n"+arr.map(function(o){return JSON.stringify(o);}).join(",\n")+"\n]\n";}
  function snap(c){return {docs:(DATA[c]||[]).map(function(o){var d=Object.assign({},o);var id=d.id;delete d.id;return {id:id,data:function(){return d;}};}),metadata:{fromCache:false}};}
  function emit(c){(listeners[c]||[]).forEach(function(cb){cb(snap(c));});}
  /* Änderungen bleiben zuerst im Browser und sind sofort sichtbar. „Aktualisieren“ schreibt alle
     offenen Änderungen in EINEM Commit auf main (also nur ein Seitenneubau statt vieler). */
  var PKEY="ta_pending",PEND={},busy=false;
  function loadPend(){try{PEND=JSON.parse(localStorage.getItem(PKEY)||"{}")||{};}catch(e){PEND={};}}
  function savePend(){try{if(Object.keys(PEND).length)localStorage.setItem(PKEY,JSON.stringify(PEND));else localStorage.removeItem(PKEY);}catch(e){}}

    var arr=mutate(JSON.parse(JSON.stringify(DATA[c]||[])));

  /* Eintragsweise Zusammenführung: geänderte Einträge aus dem Browser setzen, alles andere bleibt wie auf GitHub */
  function byId(a){var m={};(a||[]).forEach(function(x){m[x.id]=x;});return m;}
  function mergeEntries(remote,base,local){
    var b=byId(base),l=byId(local),out=remote.slice();
    Object.keys(Object.assign({},b,l)).forEach(function(id){
      if(JSON.stringify(b[id]||null)===JSON.stringify(l[id]||null))return;
      if(!l[id]){out=out.filter(function(x){return x.id!==id;});return;}
      var i=out.findIndex(function(x){return x.id===id;});
      if(i>=0)out[i]=l[id];else out.push(l[id]);

    tries=tries||0;
    var cs=Object.keys(PEND);
    if(!cs.length)return Promise.resolve();

        tree=cm.tree.sha;

          return api("/contents/"+DIR+c+".json?ref="+BRANCH).then(function(f){
            return {c:c,merged:mergeEntries(JSON.parse(fromB64(f.content)),PEND[c].base,PEND[c].local)};
          });
        }));
      })
      .then(function(rs){
        return Promise.all(rs.map(function(x){
          return api("/git/blobs",{method:"POST",body:JSON.stringify({content:fmt(x.merged),encoding:"utf-8"})})

        .then(function(entries){return api("/git/trees",{method:"POST",body:JSON.stringify({base_tree:tree,tree:entries})});})
        .then(function(t){return api("/git/commits",{method:"POST",body:JSON.stringify({message:commitMsg(msgs),tree:t.sha,parents:[head]})});})
        .then(function(cm){return api("/git/refs/heads/"+BRANCH,{method:"PATCH",body:JSON.stringify({sha:cm.sha})});})
        .then(function(){rs.forEach(function(x){DATA[x.c]=x.merged;emit(x.c);});PEND={};savePend();});
      })

      });
  }

    alert("Speichern bei GitHub hat nicht geklappt:\n"+(e&&e.message||e)+"\n\nPrüfe das Zugriffstoken (Knopf oben rechts).");
    throw {code:"write_failed"};
  }
  function label(b,id){return String(b&&(b.title||b.name||b.q||b.text||b.fn||b.family)||id).slice(0,60);}
  function coll(c){return {
    onSnapshot:function(ok){(listeners[c]=listeners[c]||[]).push(ok);setTimeout(function(){ok(snap(c));},0);return function(){};},
    doc:function(id){return {
      set:function(body){
        var obj=Object.assign({id:id},body);
        return change(c,function(a){var i=a.findIndex(function(x){return x.id===id;});if(i>=0)a[i]=obj;else a.push(obj);return a;},"Cockpit: "+c+" – "+label(body,id)+" gespeichert (Web)").catch(fail);
      },
      delete:function(){
        var old=(DATA[c]||[]).find(function(x){return x.id===id;});
        return change(c,function(a){return a.filter(function(x){return x.id!==id;});},"Cockpit: "+c+" – "+label(old,id)+" gelöscht (Web)").catch(fail);
      }
    };}
  };}
  var db={collection:coll};
  function clean(x){return String(x).replace(/[\\\/:*?"<>|#%]+/g,"_").trim();}
  function encPath(p){return p.split("/").map(encodeURIComponent).join("/");}
  function toB64File(file){return file.arrayBuffer().then(function(buf){var by=new Uint8Array(buf),bin="";for(var i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin);});}
  /* Datei als Commit nach docs/archiv/<Ordner>/<Dokument>/<Version>_<Name> legen */
  function upload(file,o){
    o=o||{};
    if(file.size>20*1048576)return Promise.reject(new Error("Datei zu groß (max. 20 MB)"));
    var rel="archiv/"+clean(o.folder||"Sonstiges")+"/"+clean(o.family||"Dokument")+"/"+clean(o.ver||"V1")+"_"+clean(file.name);
    return toB64File(file).then(function(b64){
      function put(path,n){
        return api("/contents/docs/"+encPath(path),{method:"PUT",body:JSON.stringify({message:"Cockpit: Datei hochgeladen – "+file.name+" (Web)",content:b64,branch:BRANCH})})
          .then(function(){return {id:path,path:path};})
          .catch(function(e){
            if((e.status===422||e.status===409)&&n<1)return put(path.replace(/(\.[^.\/]+)?$/,"_"+Date.now()+"$1"),n+1);
            throw e;
          });

  /* Knopf: Zugriffstoken speichern oder entfernen */
  var b=document.createElement("button");
  b.id="ghbtn";b.className="btn sm";
  b.style.cssText="position:fixed;right:14px;top:8px;z-index:50;font-size:12px;padding:3px 10px;opacity:.8";b.title="GitHub-Zugriffstoken für Bearbeiten und Löschen";

    }).catch(function(e){try{localStorage.removeItem("ta_gh_token");}catch(x){}alert("Token wurde abgelehnt: "+e.message);});
  };
  document.body.appendChild(b);
  /* Aktualisieren-Knopf oben in der Navigation (wird bei jedem Neuzeichnen mit eingesetzt) */
  function showBar(){}

    var g=ev.target.closest&&ev.target.closest("#pendgo");if(!g)return;

  });

  loadPend();
  Object.keys(PEND).forEach(function(c){if(PEND[c].local)DATA[c]=PEND[c].local;});
  showBar();
})();

function reqWarnings(){
  const out=[];
  S.data.reqs.forEach(r=>{
    if(r.art==="–")return;
    const hasVal=[r.min,r.exact,r.max].some(v=>v!==""&&v!=null);

const REQ_SORTS=[["nr","Nr."],["art","Art: F, M, W"],["status","Status: offen zuerst"],["artstatus","Art, dann Status"]];
function reqSorted(list,mode){

/* ---------- Wochenberichte: jeder Bericht läuft Freitag 07:30 bis nächsten Freitag 07:30 ---------- */
function wpStart(ts){
  const s=new Date(ts);s.setHours(7,30,0,0);
  const diff=(s.getDay()-5+7)%7;s.setDate(s.getDate()-diff);
  if(s.getTime()>ts)s.setDate(s.getDate()-7);
  return s.getTime();
}
function wpNext(start){const e=new Date(start);e.setDate(e.getDate()+7);return e.getTime();}
function wpChanges(start,end){
  const out=[];
  SRC.forEach(([c,kind,view,lab])=>{if(c==="kilog")return;(S.data[c]||[]).forEach(r=>{const u=r.updated?Date.parse(r.updated):0;if(u>=start&&u<end)out.push({c,kind,view,id:r.id,label:String(lab(r)||"(ohne Titel)").slice(0,140),at:u});});});
  return out.sort((x,y)=>y.at-x.at);
}
function wpRange(start){
  const f=t=>new Date(t).toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(",","");
  return f(start)+" – "+f(wpNext(start));
}
function wpList(start){
  // alle Berichte von der aktuellen Woche bis zur ersten Änderung zurück
  const all=[];S.data && Object.keys(S.data).forEach(c=>(S.data[c]||[]).forEach(r=>{if(r.updated)all.push(Date.parse(r.updated));}));
  const now=wpStart(Date.now());
  const first=all.length?wpStart(Math.min(...all)):now;
  const out=[];for(let s=now;s>=first&&out.length<40;){out.push(s);const p=new Date(s);p.setDate(p.getDate()-7);s=p.getTime();}
  return out;
}
function weekReport(start){
  const ch=wpChanges(start,wpNext(start));
  const done=ch.filter(x=>x.c==="tasks"&&(S.data.tasks.find(t=>t.id===x.id)||{}).status==="erledigt");
  const groups={};ch.forEach(x=>{groups[x.kind]=(groups[x.kind]||0)+1;});
  const open=S.data.tasks.filter(t=>t.status!=="erledigt").sort(sortDue).slice(0,5);

}

function timelineSvg(){
  const all=S.data.deadlines.filter(d=>d.date).sort((a,b)=>a.date<b.date?-1:1);
  const t0=new Date(2026,9,1),t1=new Date(2027,6,1);const W=1000,X0=40,X1=970;
  const x=d=>X0+(pd(d)-t0)/(t1-t0)*(X1-X0);
  let svg=`<svg viewBox="0 0 ${W} 200" width="100%" role="img" aria-label="Zeitleiste der Termine" style="min-width:640px">`;
  svg+=`<line x1="${X0}" y1="100" x2="${X1}" y2="100" stroke="var(--line)" stroke-width="2"/>`;
  for(let m=0;m<=9;m++){const d=new Date(2026,9+m,1);const xx=X0+(d-t0)/(t1-t0)*(X1-X0);
    svg+=`<line x1="${xx}" y1="94" x2="${xx}" y2="106" stroke="var(--muted)"/><text x="${xx}" y="122" font-size="11" text-anchor="middle" fill="var(--muted)">${d.toLocaleDateString("de-DE",{month:"short"})}${m===0||d.getMonth()===0?" "+String(d.getFullYear()).slice(2):""}</text>`;}
  const tx=X0+(today()-t0)/(t1-t0)*(X1-X0);
  if(tx>=X0&&tx<=X1)svg+=`<line x1="${tx}" y1="20" x2="${tx}" y2="180" stroke="var(--accent)" stroke-dasharray="4 3"/><text x="${tx+4}" y="30" font-size="11" fill="var(--accent)">heute</text>`;
  const lanes={betrieb:[],schule:[]};
  all.forEach((d,i)=>{const xx=Math.max(X0,Math.min(X1,x(d.date)));const up=d.kind==="betrieb";const lane=lanes[up?"betrieb":"schule"];
    let lvl=0;while(lane.some(p=>p[1]===lvl&&Math.abs(p[0]-xx)<26))lvl++;lane.push([xx,lvl]);
    const y=up?82-lvl*20:118+16+lvl*20;
    const col=d.status==="erledigt"?"var(--ok)":up?"var(--warn)":"var(--accent)";
    svg+=`<line x1="${xx}" y1="100" x2="${xx}" y2="${y}" stroke="${col}" stroke-width="1"/><circle class="tlink" data-termin="${esc(d.id)}" cx="${xx}" cy="${y}" r="9" fill="${col}"><title>${esc(d.title)}</title></circle><text class="tlink" data-termin="${esc(d.id)}" x="${xx}" y="${y+4}" font-size="10" text-anchor="middle" fill="var(--panel)" font-weight="600" style="cursor:pointer">${i+1}</text>`;});
  svg+=`<text x="${X0}" y="14" font-size="12" fill="var(--muted)">Betrieb ▲</text><text x="${X0}" y="196" font-size="12" fill="var(--muted)">Schule ▼</text></svg>`;
  return svg;
}

VIEWS.aufgaben=()=>{
  const f=lsGet("taskFilter",{who:"",st:"offen"});
  const view=lsGet("taskView","tabelle");
  const can=S.canWrite&&!S.offline;
  let rows=S.data.tasks.slice();
  if(f.st==="offen")rows=rows.filter(t=>t.status!=="erledigt");
  if(f.st==="über")rows=rows.filter(t=>t.status!=="erledigt"&&t.due&&days(t.due)<0);
  if(f.st==="erledigt")rows=rows.filter(t=>t.status==="erledigt");
  if(f.who)rows=rows.filter(t=>t.who===f.who);
  rows.sort(sortDue);
  const head=`<div class="head"><div><span class="tag">Steuerung</span><h1>Offene Punkte</h1><p>Was wer bis wann erledigen muss. Antippen zum Bearbeiten.${view==="board"&&can?" Im Board Karten in eine andere Spalte ziehen, um den Status zu ändern.":""}</p></div>${newBtn("tasks","Neuer Punkt")}</div>`;
  const who=`<select id="tfwho" aria-label="Wer"><option value="">Alle Personen</option>${WHO.map(w=>`<option ${f.who===w?"selected":""}>${w}</option>`).join("")}</select>`;
  const sw=`<span class="vswitch"><button class="btn sm ${view==="tabelle"?"pri":""}" data-tv="tabelle">Tabelle</button><button class="btn sm ${view==="board"?"pri":""}" data-tv="board">Board</button></span>`;
  if(view==="board"){
    const all=S.data.tasks.filter(t=>!f.who||t.who===f.who);
    const cols=["offen","in Arbeit","erledigt"];
    const board=cols.map(c=>{
      let items=all.filter(t=>(t.status||"offen")===c);
      if(c==="erledigt")items=items.sort((x,y)=>String(y.updated||"").localeCompare(String(x.updated||"")));else items=items.sort(sortDue);
      const shown=c==="erledigt"?items.slice(0,6):items;
      return `<div class="bcol" data-col="${c}"><div class="bh"><b>${c}</b><span class="muted small">${items.length}</span></div>${shown.map(t=>`<div class="bcard" ${can?'draggable="true"':""} data-bid="${esc(t.id)}" data-task="${esc(t.id)}"><div>${esc(t.title)}</div><div class="small muted">${esc(t.who||"")}${t.ask?" · fragen: "+esc(t.ask):""}${t.prio?" · P"+esc(t.prio):""} · ${dueCell(t.due,c==="erledigt")}</div></div>`).join("")||'<div class="empty small">–</div>'}${items.length>shown.length?`<div class="small muted" style="padding:4px">… ${items.length-shown.length} weitere (Tabelle, Filter „Erledigt“)</div>`:""}</div>`;}).join("");
    return head+`<div class="toolbar">${sw}${who}<span class="muted small">${all.length} Punkte</span></div><div class="board">${board}</div>`;
  }
  return head+`<div class="toolbar">${sw}<select id="tfst" aria-label="Status"><option value="offen" ${f.st==="offen"?"selected":""}>Offen</option><option value="über" ${f.st==="über"?"selected":""}>Überfällig</option><option value="erledigt" ${f.st==="erledigt"?"selected":""}>Erledigt</option><option value="alle" ${f.st==="alle"?"selected":""}>Alle</option></select>${who}<span class="muted small">${rows.length} Einträge</span></div>`+
  listTable("tasks",rows,[["prio","P",r=>`<span class="num">${esc(r.prio||"")}</span>`],["title","Punkt"],["who","Wer"],["due","Bis",r=>dueCell(r.due,r.status==="erledigt")],["status","Status",r=>stPill(r.status)],["chat","Chat",r=>`<span class="small">${esc(r.chat||"")}</span>`]]);
};

  if(a)a.onchange=up;if(b)b.onchange=up;

  const board=cols.map(c=>{

/* Übernahme aus dem Eingang: Status, Datum, Inhalt und Vorschlag bleiben erhalten */
const PF_KIND_COLL={aufgabe:"tasks",entscheidung:"tasks",aenderung:"changes"};
const PF_STAT={"offen":"offen","in Arbeit":"in Arbeit","erledigt":"erledigt","entfallen":"entfallen","bestätigt":"erledigt","beantwortet":"erledigt","abgesagt":"entfallen","geklärt":"erledigt"};
function pfAltRecord(p){
  const a=p.alt||{};const c=p.altColl;const st=PF_STAT[p.stand]||PF_STAT[a.status]||"offen";const dt=p.date||a.date||a.resolved||"";
  if(c==="tasks")return {coll:"tasks",obj:Object.assign({},a,{status:st,date:dt})};
  if(c==="decisions")return {coll:"tasks",obj:{typ:"entscheidung",title:a.text||"",note:"",who:"",due:"",prio:a.prio||"2",status:st,by:a.by||"",reason:a.reason||"",date:dt,source:a.source||"",docs:a.docs||"",refs:a.refs||"",topic:""}};
  if(c==="questions")return {coll:"tasks",obj:{typ:"entscheidung",title:a.q||"",note:a.answer||"",who:a.entscheider||"",due:a.due||"",prio:a.prio||"1",status:st,by:"",reason:"",date:dt,source:"Frage an den Betrieb"+(a.source?" ("+a.source+")":""),docs:"",refs:a.refs||"",topic:a.topic||""}};
  if(c==="conflicts")return {coll:"tasks",obj:{typ:"entscheidung",title:a.text||"",note:a.note||"",who:"",due:"",prio:"1",status:st,by:"",reason:"",date:dt,source:"Widerspruch",docs:a.between||"",refs:a.refs||"",topic:""}};
  return null;
}
async function pfAccept(id,pre){
  const p=pre||S.data.postfach.find(x=>x.id===id);if(!p)return;
  let target=null,obj=null;
  if(p.alt){const r=pfAltRecord(p);if(r&&PF_KIND_COLL[p.kind]===r.coll){target=r.coll;obj=r.obj;}}
  if(!obj){
    const base={title:p.title||"",note:p.detail||"",source:p.vorschlag||"",date:p.date||"",status:p.stand||"offen",prio:"2",who:"",due:"",by:"",reason:"",topic:"",docs:"",refs:""};
    const map={
      aufgabe:["tasks",Object.assign({},base,{who:"Janek",chat:""})],
      entscheidung:["tasks",Object.assign({},base,{typ:"entscheidung"})],
      aenderung:["changes",{ver:"",date:p.date||"",chap:"",change:p.title||"",reason:p.detail||"",by:p.vorschlag||""}]
    };
    const m=map[p.kind];
    if(!m){alert2("Diese Art ist unbekannt. Bitte im Eintrag die Zielkategorie wählen.");return;}
    target=m[0];obj=m[1];
  }
  if(target==="tasks"){if(p.who)obj.who=p.who;if(p.ask)obj.ask=p.ask;if(p.due)obj.due=p.due;if(p.prio)obj.prio=p.prio;}
  const newId=nid();
  const ok=await save(target,newId,obj);
  if(ok)await save("postfach",id,Object.assign({},p,{status:"übernommen",ziel:target+"/"+newId}));
}

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
function icsFold(l){const o=[];let s=l;while(s.length>60){o.push(s.slice(0,60));s=" "+s.slice(60);}o.push(s);return o.join("\r\n");}
function buildIcs(){
  const ymd=s=>s.replace(/-/g,"");
  const nextDay=s=>{const d=pd(s);d.setDate(d.getDate()+1);return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");};
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//TA-Cockpit//Technikerarbeit//DE","CALSCALE:GREGORIAN","X-WR-CALNAME:Technikerarbeit Termine"];
  S.data.deadlines.filter(d=>d.date&&d.status!=="erledigt").forEach(d=>{
    L.push("BEGIN:VEVENT","UID:"+d.id+"@ta-cockpit","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(d.date),"DTEND;VALUE=DATE:"+nextDay(d.date),"SUMMARY:"+icsEsc((d.approx?"ca. ":"")+d.title),"DESCRIPTION:"+icsEsc((d.kind==="betrieb"?"Betrieb":"Schule")+(d.note?" – "+d.note:"")),"END:VEVENT");});
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}
VIEWS_after.zeitleiste=()=>{const b=$("#icsbtn");if(b)b.onclick=async()=>{b.disabled=true;try{await saveBlob("Termine_Technikerarbeit.ics",new Blob([buildIcs()],{type:"text/calendar"}));}catch(e){alert2("Kalenderdatei konnte nicht erstellt werden.");}b.disabled=false;};};

/* ---------- Verknüpfungen: Fragen, Entscheidungen, Widersprüche, Anforderungen ---------- */
function refTokens(s){return String(s||"").split(/[,;]/).map(t=>t.trim().toLowerCase().replace(/^anf\.?\s*/,"")).filter(Boolean);}
function linkedFor(q){
  const toks=refTokens(q.refs);const out=[];
  (S.data.decisions||[]).forEach(d=>{if(toks.includes(String(d.id).toLowerCase()))out.push({c:"decisions",id:d.id,kind:"Entscheidung",label:d.text,status:d.status,opts:[["entfallen","Entfällt"],["bestätigt","Bestätigt"]]});});
  (S.data.conflicts||[]).forEach(c=>{if(toks.includes(String(c.id).toLowerCase()))out.push({c:"conflicts",id:c.id,kind:"Widerspruch",label:c.text,status:c.status,opts:[["geklärt","Geklärt"]]});});
  (S.data.reqs||[]).forEach(r=>{if(toks.includes(String(r.nr||"").toLowerCase()))out.push({c:"reqs",id:r.id,kind:"Anforderung",label:(r.nr?r.nr+" ":"")+(r.text||""),status:r.status,opts:[["bestätigt","Bestätigt"]]});});
  return out;
}
function openAbgleich(qid){
  S.abglQ=qid;const q=S.data.questions.find(x=>x.id===qid);if(!q)return;
  const items=linkedFor(q);
  const body=items.length?items.map(it=>`<li style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="small muted">${esc(it.kind)} · ${stPill(it.status)}</div><div style="margin:4px 0">${nl(it.label)}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${it.opts.map(([s,l])=>`<button class="btn sm" data-abset="${esc(it.c)}|${esc(it.id)}|${esc(s)}">${esc(l)}</button>`).join("")}</div></li>`).join(""):'<p class="muted">Keine verknüpften Einträge. Trage unter „Verknüpft mit“ die IDs ein, z. B. e13 (Entscheidung), w02 (Widerspruch) oder 2.4 (Anforderung).</p>';
  $("#modal").innerHTML=`<div class="modal-bg" data-close="1"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Abgleich">
    <div class="toolbar" style="justify-content:space-between;align-items:flex-start"><div><span class="tag">Frage ${stPill(q.status)}</span><h2 style="margin:6px 0">${esc(q.q)}</h2><p class="small muted" style="margin:0">${q.answer?"Antwort: "+esc(q.answer):"Keine Antwort eingetragen."}</p></div><button class="btn" data-close="1">Schließen</button></div>
    <h3 style="margin-top:12px">Was dadurch wegfällt oder geklärt wird</h3><ul class="clean">${body}</ul></div></div>`;
  S.modalOpen=true;
}
async function setLinked(c,id,status){
  const r=(S.data[c]||[]).find(x=>x.id===id);if(!r)return;
  const obj=Object.assign({},r,{status});
  if(c==="conflicts"&&status==="geklärt")obj.resolved=new Date().toISOString().slice(0,10);
  await save(c,id,obj);
}
VIEWS.fragen=()=>{
  const f=lsGet("qFilter",{st:"offen"});
  const sorted=S.data.questions.slice().sort((x,y)=>(x.status===y.status?0:x.status==="offen"?-1:1)||(x.prio||"9").localeCompare(y.prio||"9"));
  const rows=f.st==="alle"?sorted:sorted.filter(q=>q.status===f.st);

VIEWS.entscheidungen=()=>{
  const can=S.canWrite&&!S.offline;
  const all=S.data.tasks.filter(t=>t.typ==="entscheidung");
  const openN=all.filter(t=>(t.status||"offen")==="offen"||t.status==="in Arbeit").length;
  const cols=["offen","in Arbeit","erledigt","entfallen"];
  const sortIt=(x,y)=>(x.due||"9999").localeCompare(y.due||"9999");
  const card=d=>`<div class="bcard" ${can?'draggable="true"':""} data-dec="${esc(d.id)}" data-edit="decisions" data-id="${esc(d.id)}"><div>${esc(d.title||"(ohne Text)")}</div><div class="small muted">${d.who?"Wer: "+esc(d.who):"ohne Zuständige/r"}${d.by?" · entschieden von "+esc(d.by):""}${d.due?" · bis "+fd(d.due):""}${d.topic?" · "+esc(d.topic):""}</div>${d.source?`<div class="small muted">${esc(d.source)}</div>`:""}</div>`;
  const board=cols.map(c=>{
    const list=all.filter(d=>(d.status||"offen")===c).sort(c==="erledigt"?(x,y)=>String(y.date||"").localeCompare(String(x.date||"")):sortIt);
    const shown=c==="erledigt"?list.slice(0,10):list;
    return `<div class="bcol" data-col="${c}"><div class="bh"><b>${c}</b><span class="muted small">${list.length}</span></div>${shown.map(card).join("")||'<div class="empty small">–</div>'}${list.length>shown.length?`<div class="small muted" style="padding:4px">… ${list.length-shown.length} weitere</div>`:""}</div>`;
  }).join("");
  return `<div class="head"><div><span class="tag">Postfach</span><h1>Entscheidungen</h1><p>Alles, was entschieden werden muss, inklusive Fragen an den Betrieb und Widersprüche. Dieselben Karten wie unter Aufgaben. Für „erledigt“ braucht es „Entschieden von“ und „Begründung“ (Karte antippen).</p></div>${newBtn("decisions","Neue Entscheidung")}</div>
  <div class="toolbar"><span class="pill p-warn">${openN} offen</span></div>
  <div class="board">${board}</div>`;
};
VIEWS_after.entscheidungen=()=>{
  if(!(S.canWrite&&!S.offline))return;
  document.querySelectorAll(".bcard[draggable]").forEach(c=>{
    c.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",c.dataset.dec);e.dataTransfer.effectAllowed="move";c.classList.add("drag");});
    c.addEventListener("dragend",()=>c.classList.remove("drag"));});
  document.querySelectorAll(".bcol").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over");});
    col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",async e=>{e.preventDefault();col.classList.remove("over");
      const id=e.dataTransfer.getData("text/plain");const d=S.data.tasks.find(x=>x.id===id);const target=col.dataset.col;
      if(!d||(d.status||"offen")===target)return;
      if(target==="erledigt"&&(!d.by||!d.reason)){alert2("Vor „erledigt“ den Eintrag antippen und „Entschieden von“ und „Begründung“ eintragen.");return;}

};

const MAT={nitinol:{n:"Nitinol (austenitisch)",E:75,rho:6.45},nitinolM:{n:"Nitinol (martensitisch)",E:35,rho:6.45},steel:{n:"Edelstahl 1.4404/316L",E:193,rho:8.0},tantal:{n:"Tantal",E:186,rho:16.6}};
const CASES={ss:{n:"Zwei Stützen, gelenkig (Einfeldträger)",k:5/384},ff:{n:"Beidseitig eingespannt",k:1/384},cont:{n:"Viele Stützen, Innenfeld (Durchlaufträger, Näherung)",k:1/384*1.0},cant:{n:"Kragarm (überstehendes Ende)",k:1/8}};
VIEWS.rechner=()=>{
  const c=lsGet("calc",{mat:"nitinol",E:"",D:6.5,s:0.3,L:300,cs:"ss",fz:0.01,len:3000,dx:2,tq:1.5,tv:0.3,th:30,dmin:1.0,dmax:6.5,tol:10});
  return `<div class="head"><div><span class="tag">Lösungsphase</span><h1>Rechner</h1><p>Zur Kontrolle deiner eigenen Rechnungen. In der Doku stehen dein Rechenweg und deine Quellen, nicht dieses Ergebnis. Werkstoffwerte sind Richtwerte und müssen mit einer Quelle belegt werden.</p></div></div>
  <div class="grid g2">
   <div class="panel calc"><h3>Durchbiegung durch Eigengewicht</h3>
    <div class="in"><label for="c_mat">Werkstoff<select id="c_mat">${Object.entries(MAT).map(([k,m])=>`<option value="${k}" ${c.mat===k?"selected":""}>${m.n}</option>`).join("")}</select></label>
    <label for="c_E">E-Modul eigener Wert (GPa)<input id="c_E" type="number" step="any" value="${esc(c.E)}" placeholder="Richtwert"></label>
    <label for="c_D">Außen-Ø D (mm)<input id="c_D" type="number" step="any" value="${esc(c.D)}"></label>
    <label for="c_s">Wandstärke s (mm)<input id="c_s" type="number" step="any" value="${esc(c.s)}"></label>
    <label for="c_L">Stützabstand L (mm)<input id="c_L" type="number" step="any" value="${esc(c.L)}"></label>
    <label for="c_fz">Zulässige Durchbiegung (mm)<input id="c_fz" type="number" step="any" value="${esc(c.fz)}"></label></div>
    <label for="c_cs" class="calc"><span class="note">Lagerung</span><select id="c_cs">${Object.entries(CASES).map(([k,m])=>`<option value="${k}" ${c.cs===k?"selected":""}>${m.n}</option>`).join("")}</select></label>
    <div class="res" id="r_bend"></div>
    <p class="note">Modell: Kreisring I = π(D⁴−d⁴)/64, Streckenlast q = ρ·A·g, f = k·q·L⁴/(E·I). k: 5/384 gelenkig, 1/384 eingespannt (Innenfeld eines Durchlaufträgers näherungsweise ebenso), 1/8 Kragarm. Nitinol: E stark temperatur- und phasenabhängig.</p></div>
   <div class="panel calc"><h3>Taktzeit pro Rohr</h3>

VIEWS_after.rechner=()=>{
  const ids=["mat","E","D","s","L","cs","fz","len","dx","tq","tv","th","dmin","dmax","tol"];
  const run=()=>{
    const c={};ids.forEach(k=>{const el=$("#c_"+k);if(el)c[k]=el.value;});lsSet("calc",c);
    const m=MAT[c.mat];const E=(isFinite(num(c.E))&&num(c.E)>0?num(c.E):m.E)*1000;// N/mm²
    const D=num(c.D),s=num(c.s),L=num(c.L),fz=num(c.fz),k=CASES[c.cs].k;
    const d=D-2*s;let h;
    if(!(D>0)||!(s>0)||d<0||!(L>0))h=`<span class="muted">Bitte D, s und L eingeben (s kleiner als D/2).</span>`;
    else{const A=Math.PI/4*(D*D-d*d),I=Math.PI/64*(Math.pow(D,4)-Math.pow(d,4));const qN=m.rho*1e-6*A*9.81;const f=k*qN*Math.pow(L,4)/(E*I);
      const Lmax=fz>0?Math.pow(fz*E*I/(k*qN),0.25):NaN;
      h=`<div>Durchbiegung f = <span class="v">${f2(f*1000,1)} µm</span> <span class="muted">(${f2(f,4)} mm)</span></div>
      <div class="small">Masse je Meter ${f2(qN/9.81*1000*1000,1)} g/m · I = ${f2(I,4)} mm⁴ · E = ${f2(E/1000,0)} GPa</div>
      ${fz>0?`<div>Größter Stützabstand für f ≤ ${f2(fz,3)} mm: <span class="v">${f2(Lmax,0)} mm</span> → bei ${f2(num(c.len)||3000,0)} mm Rohrlänge etwa ${f2(Math.ceil((num(c.len)||3000)/Lmax)+1,0)} Stützen</div>`:""}
      ${fz>0?(f<=fz?pill("zulässig","p-ok"):pill("zu groß","p-bad")):""}`;}
    $("#r_bend").innerHTML=h;
    const len=num(c.len),dx=num(c.dx),tq=num(c.tq),tv=num(c.tv),th=num(c.th);
    if(len>0&&dx>0){const n=Math.floor(len/dx)+1;const t=n*((tq||0)+(tv||0))+(th||0);
      $("#r_takt").innerHTML=`<div>Querschnitte n = <span class="v">${f2(n,0)}</span></div><div>Taktzeit ≈ <span class="v">${f2(t/60,1)} min</span> <span class="muted">(${f2(t,0)} s)</span></div><div class="small">Rohre pro 8-h-Schicht ≈ ${f2(Math.floor(8*3600/t),0)}</div>`;}
    else $("#r_takt").innerHTML=`<span class="muted">Rohrlänge und Messpunktabstand eingeben.</span>`;
    const dmin=num(c.dmin),dmax=num(c.dmax),tol=num(c.tol);
    const ss=S.data.sensors;
    $("#r_sens").innerHTML=ss.length?`<div class="tbl"><table><thead><tr><th>Sensor</th><th>Bereich</th><th>Ø-Bereich</th><th>Genauigkeit</th></tr></thead><tbody>${ss.map(x=>{
      const rok=isFinite(x.rmin)&&isFinite(x.rmax)&&x.rmin!==""&&x.rmax!==""?(x.rmin<=dmin&&x.rmax>=dmax?pill("deckt ab","p-ok"):pill("deckt nicht ab","p-bad")):pill("Daten fehlen");
      const a=num(x.acc);const aok=isFinite(a)&&tol>0?(a<=tol/10?pill("≤ T/10","p-ok"):a<=tol/5?pill("≤ T/5","p-warn"):pill("> T/5","p-bad")):pill("Daten fehlen");
      return `<tr><td>${esc(x.maker)} ${esc(x.model)}</td><td class="num">${x.rmin!==""&&x.rmin!=null?f2(x.rmin)+"–"+f2(x.rmax)+" mm":"–"}</td><td>${rok}</td><td>${aok}</td></tr>`;}).join("")}</tbody></table></div>`:`<div class="empty">Noch keine Sensoren angelegt.</div>`;
  };
  ids.forEach(k=>{const el=$("#c_"+k);if(el){el.oninput=run;el.onchange=run;}});run();
};

function xlsxCol(i){let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function xmlEsc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
async function buildXlsx(sheetName,headers,rows){
  const JSZip=await loadZip();const z=new JSZip();
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const cell=(v,ref)=>{if(typeof v==="number"&&isFinite(v))return `<c r="${ref}"><v>${v}</v></c>`;if(v===""||v==null)return "";return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;};
  const sd=[headers,...rows].map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>cell(v,xlsxCol(ci)+(ri+1))).join("")}</row>`).join("");
  z.file("[Content_Types].xml",H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>');
  z.file("_rels/.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file("xl/workbook.xml",H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xmlEsc(sheetName)+'" sheetId="1" r:id="rId1"/></sheets></workbook>');
  z.file("xl/_rels/workbook.xml.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>');
  z.file("xl/worksheets/sheet1.xml",H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+sd+'</sheetData></worksheet>');
  return z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

  const docs=r=>{const fs=(r.docs||[]).map(fById).filter(Boolean);if(!fs.length)return `<span class="muted">–</span>`;
    const pg=f=>(r.pages||{})[f.id]||"";const lb=f=>pg(f)?(/manual|micrometers/i.test(f.name)?"Handbuch":"Katalog"):undefined;
    if(fs.length===1)return `<div data-noedit>${chip(fs[0],pg(fs[0]),lb(fs[0]))}</div>`;
    return `<details class="fmore" data-noedit><summary>${chip(fs[0],pg(fs[0]),lb(fs[0]))} <span class="fcount">+${fs.length-1}</span></summary><div class="fpop">${fs.slice(1).map(f=>chip(f,pg(f),lb(f))).join("")}</div></details>`;};
  const kat=getTool("sensorkat",{items:[],hint:""});
  const katHtml=(kat.items||[]).map(k=>{const f=fById(k.file);if(!f)return "";
    const jumps=(k.pages||[]).map(([t,p])=>chip(f,p,t)).join("");
    return `<div class="kat"><div class="small muted">${esc(k.label)}</div>${chip(f)}${jumps?`<details class="fmore" data-noedit><summary class="small">Seiten im Katalog (${k.pages.length})</summary><div class="fpop">${jumps}</div></details>`:""}</div>`;}).join("");
  const rng=r=>r.rmin!==""&&r.rmin!=null?f2(r.rmin)+"–"+f2(r.rmax)+" mm":"–";
  const fit=r=>r.rmin!==""&&r.rmin!=null&&r.rmax!==""&&r.rmax!=null?(r.rmin<=1&&r.rmax>=6.5?pill("ja","p-ok"):pill("nein","p-bad")):pill("offen");
  let prev="";
  const fitP=r=>{const t=String(r.fittxt||"");if(!t)return fit(r);const c=/^ja/i.test(t)?(/knapp/i.test(t)?"p-warn":"p-ok"):/^nein/i.test(t)?"p-bad":"";return `<span title="${esc(t)}">${pill(/^ja/i.test(t)?(/knapp/i.test(t)?"knapp":"ja"):/^nein/i.test(t)?"nein":"offen",c)}</span>`;};
  const det=r=>{const L=[["1 Messbereich",r.range],["Ø 1,0–6,5 mm",r.fittxt],["2 Wiederholgenauigkeit",r.rep],["2 Bedingungen",r.repcond],["3 Genauigkeit/Linearität",r.lin],["4 Lage im Messfeld",r.pos],["5 Abtastrate",r.rate],["6 Messachsen",r.axes],["7 Bauform/Durchgang",r.build],["8 Trigger/Encoder",r.trig],["9 Lichtquelle/Laserklasse",r.light],["Quelle",r.source],["Notiz",r.note]].filter(z=>z[1]!=null&&z[1]!=="");
    if(!L.length)return `<span class="muted">–</span>`;
    return `<details class="fmore dmore" data-noedit><summary>9 Punkte</summary><div class="fpop dpop"><dl>${L.map(z=>`<dt>${esc(z[0])}</dt><dd>${esc(z[1])}</dd>`).join("")}</dl></div></details>`;};
  const cols=[["nr","Nr.",r=>`<span class="num">${esc(r.nr||"")}</span>`],
    ["maker","Hersteller",r=>{const m=r.maker===prev?"":esc(r.maker);prev=r.maker;return m;}],
    ["model","Modell",r=>`<b>${esc(r.model)}</b>${r.variant?`<div class="small muted">${esc(r.variant)}</div>`:""}`],
    ["docs","Datenblatt",docs],
    ["r","1 Messbereich",r=>`<span class="small clamp w150" title="${esc(r.range||"")}">${esc(r.range||rng(r))}</span>`],
    ["fit","Ø 1,0–6,5",fitP],
    ["rep","2 Wiederhol&shy;genauigkeit",r=>`<span class="small clamp w150" title="${esc((r.rep||"")+(r.repcond?" – "+r.repcond:""))}"><b>${esc(r.rep||"–")}</b>${r.repcond&&r.repcond!=="–"?` <span class="muted">(${esc(r.repcond)})</span>`:""}</span>`],
    ["lin","3 Genauig&shy;keit",r=>`<span class="small clamp w150" title="${esc(r.lin||"")}">${esc(r.lin||"–")}</span>`],
    ["rate","5 Abtastrate",r=>`<span class="small clamp w150" title="${esc(r.rate||"")}">${esc(r.rate||"–")}</span>`],
    ["det","Alle Werte",det]];
  const restCols=[["maker","Hersteller"],["model","Modell",r=>`<b>${esc(r.model)}</b>`],["principle","Prinzip",r=>`<span class="small">${esc(r.principle)}</span>`],["r","Messbereich",r=>`<span class="num">${rng(r)}</span>`],["fit","Ø 1,0–6,5",fit],["source","Quelle",r=>`<span class="small">${esc(r.source)}</span>`],["note","Notiz",r=>`<span class="small clamp" title="${esc(r.note||"")}">${esc(r.note||"")}</span>`]];
  return `<div class="head"><div><span class="tag">Lösungsphase · Chat 05</span><h1>Sensorvergleich</h1><p>Alle Sensoren aus den vorliegenden Datenblättern und Katalogen, die Ø 1,0–6,5 mm abdecken. Grundmodell = ganze Nummer, Varianten = x.1, x.2 … Datei-Chip öffnet direkt auf der Katalogseite. Zeile anklicken zum Bearbeiten.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sxlsx">Als Excel-Datei speichern</button>${newBtn("sensors","Neuer Sensor")}</div></div>
  <div class="katrow">${katHtml}</div>
  ${kat.hint?`<details class="hintbox"><summary>Auswahlregel und was aus jedem Datenblatt herausgelesen wird</summary><p class="small">${esc(kat.hint)}</p></details>`:""}
  <div class="sensT">${listTable("sensors",on,cols)}</div>
  ${rest.length?`<details class="restbox"><summary>Weitere Sensoren ohne Nummer (${rest.length})</summary>${listTable("sensors",rest,restCols)}</details>`:""}
  ${(kat.excluded||[]).length?`<details class="restbox"><summary>Nicht aufgenommen – Messbereich deckt Ø 1,0–6,5 mm nicht ab (${kat.excluded.length})</summary><table class="small"><tbody>${kat.excluded.map(e=>`<tr><td><b>${esc(e[0])}</b></td><td>${esc(e[1])}</td></tr>`).join("")}</tbody></table></details>`:""}`;
};

/* ---------- Morphologischer Kasten ---------- */
const MORPH_DEF={rows:[],variants:[]};
/* Abhängigkeiten: r.deps = IDs anderer Teilfunktionen (beidseitig). Alte Gruppen-Kennungen (r.dep) werden einmalig übernommen. */
function mkNorm(m){if(m.rows.every(r=>Array.isArray(r.deps)))return m;
  m.rows.forEach(r=>{if(!Array.isArray(r.deps)){const g=String(r.dep||"").trim().toLowerCase();r.deps=g?m.rows.filter(o=>o!==r&&String(o.dep||"").trim().toLowerCase()===g).map(o=>o.id):[];}});
  return m;}
VIEWS.morpho=()=>{
  const m=mkNorm(getTool("morph",MORPH_DEF));const ro=!S.canWrite||S.offline;
  const nrOf=id=>m.rows.findIndex(o=>o.id===id)+1;
  const cols=Math.max(3,...m.rows.map(r=>r.ideas.length));
  let h=`<div class="head"><div><span class="tag">Lösungsphase · Chat 06</span><h1>Morphologischer Kasten</h1><p>Zeilen = Teilfunktionen, Spalten = Lösungsideen. Unter „Abhängig von“ die Nummern der Teilfunktionen anklicken, die nur gemeinsam mit dieser Zeile entschieden werden dürfen (UP4) – die Verknüpfung gilt automatisch in beide Richtungen. Gespeichert wird automatisch.</p></div>
  ${ro?"":`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="mk_addcol">Ideen-Spalte +</button><button class="btn pri" id="mk_addrow">Teilfunktion +</button></div>`}</div>
  <div class="tbl mk"><table><thead><tr><th>Nr.</th><th>Teilfunktion</th><th>Abhängig von</th>${Array.from({length:cols},(_,i)=>`<th>Idee ${i+1}</th>`).join("")}<th></th></tr></thead><tbody>`;
  if(!m.rows.length)h+=`<tr><td colspan="${cols+4}" class="empty">Noch keine Teilfunktionen. Leg mit „Teilfunktion +“ die erste an.</td></tr>`;
  m.rows.forEach((r,ri)=>{h+=`<tr><td class="nr">TF${ri+1}</td><td><textarea rows="1" data-mk="fn" data-r="${ri}" ${ro?"readonly":""} aria-label="Teilfunktion">${esc(r.fn)}</textarea></td><td><div class="deps" role="group" aria-label="Abhängig von">${m.rows.length<2?'<span class="small muted">–</span>':m.rows.map((o,oi)=>o===r?"":`<button type="button" class="depchip ${r.deps.includes(o.id)?"on":""}" data-mkdep="${ri}|${oi}" aria-pressed="${r.deps.includes(o.id)}" ${ro?"disabled":""} title="${esc(o.fn||"Teilfunktion "+(oi+1))}">TF${oi+1}</button>`).join("")}</div></td>${Array.from({length:cols},(_,i)=>`<td><textarea rows="1" data-mk="idea" data-r="${ri}" data-i="${i}" ${ro?"readonly":""} aria-label="Idee ${i+1}">${esc(r.ideas[i]||"")}</textarea></td>`).join("")}<td style="white-space:nowrap">${ro?"":`<button class="btn sm" data-mkmv="${ri}|-1" ${ri===0?"disabled":""} aria-label="Zeile nach oben" title="nach oben">↑</button> <button class="btn sm" data-mkmv="${ri}|1" ${ri===m.rows.length-1?"disabled":""} aria-label="Zeile nach unten" title="nach unten">↓</button> <button class="btn sm" data-mkins="${ri}" aria-label="Neue Zeile darunter einfügen" title="Zeile darunter einfügen">+</button> <button class="btn sm" data-mkdel="${ri}" aria-label="Zeile löschen" title="löschen">×</button>`}</td></tr>`;});
  h+=`</tbody></table></div>
  <div class="head" style="margin-top:22px"><div><h2>Gesamtvarianten</h2><p>Je Variante pro Teilfunktion eine Idee wählen. Die Namen übernimmt die Bewertung.</p></div>${ro?"":`<button class="btn pri" id="mk_addvar">Variante +</button>`}</div>
  <div class="grid g2">${m.variants.map((v,vi)=>`<div class="panel"><div class="toolbar"><input data-mv="name" data-v="${vi}" value="${esc(v.name)}" ${ro?"readonly":""} aria-label="Variantenname" style="font:inherit;font-weight:600;flex:1;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--ink)">${ro?"":`<button class="btn sm" data-mvdel="${vi}">Löschen</button>`}</div>
   ${m.rows.map((r,ri)=>`<label class="small muted" style="display:grid;gap:2px;margin-bottom:6px">TF${ri+1} · ${esc(r.fn||"Teilfunktion "+(ri+1))}${r.deps.length?` <span title="abhängig">(↔ ${r.deps.map(nrOf).filter(n=>n).map(n=>"TF"+n).join(", ")})</span>`:""}<select data-mv="pick" data-v="${vi}" data-r="${ri}" ${ro?"disabled":""} style="font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--ink)"><option value="">– wählen –</option>${r.ideas.map((id_,ii)=>id_?`<option value="${ii}" ${String(v.pick&&v.pick[r.id])===String(ii)?"selected":""}>${esc(id_)}</option>`:"").join("")}</select></label>`).join("")}</div>`).join("")||'<div class="empty">Noch keine Varianten.</div>'}</div>`;
  return h;
};
VIEWS_after.morpho=()=>{
  const get=()=>mkNorm(getTool("morph",MORPH_DEF));
  const put=(m,re)=>{saveTool("morph",m);if(re)render();};
  const fit=el=>{el.style.height="auto";el.style.height=el.scrollHeight+2+"px";};
  document.querySelectorAll("textarea[data-mk]").forEach(el=>{fit(el);el.addEventListener("input",()=>fit(el));});
  document.querySelectorAll("[data-mk]").forEach(el=>{el.oninput=()=>{fit(el);const m=get();const r=m.rows[+el.dataset.r];if(el.dataset.mk==="idea"){while(r.ideas.length<=+el.dataset.i)r.ideas.push("");r.ideas[+el.dataset.i]=el.value;}else r[el.dataset.mk]=el.value;put(m);};});
  document.querySelectorAll("[data-mkdel]").forEach(b=>b.onclick=()=>{const m=get();const [gone]=m.rows.splice(+b.dataset.mkdel,1);m.rows.forEach(r=>{r.deps=r.deps.filter(id=>id!==gone.id);});put(m,1);});
  document.querySelectorAll("[data-mkdep]").forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.mkdep.split("|").map(Number);const m=get();const a=m.rows[i],o=m.rows[j];if(!a||!o)return;const on=a.deps.includes(o.id);
    if(on){a.deps=a.deps.filter(x=>x!==o.id);o.deps=o.deps.filter(x=>x!==a.id);}else{a.deps.push(o.id);if(!o.deps.includes(a.id))o.deps.push(a.id);}put(m,1);});
  document.querySelectorAll("[data-mkmv]").forEach(b=>b.onclick=()=>{const [i,dd]=b.dataset.mkmv.split("|").map(Number);const m=get();const j=i+dd;if(j<0||j>=m.rows.length)return;const t=m.rows[i];m.rows[i]=m.rows[j];m.rows[j]=t;put(m,1);});
  document.querySelectorAll("[data-mkins]").forEach(b=>b.onclick=()=>{const m=get();const n=Math.max(3,...m.rows.map(r=>r.ideas.length));m.rows.splice(+b.dataset.mkins+1,0,{id:nid(),fn:"",deps:[],ideas:Array(n).fill("")});put(m,1);const el=document.querySelector(`textarea[data-mk="fn"][data-r="${+b.dataset.mkins+1}"]`);if(el)el.focus();});
  const ar=$("#mk_addrow");if(ar)ar.onclick=()=>{const m=get();m.rows.push({id:nid(),fn:"",deps:[],ideas:["","",""]});put(m,1);};
  const ac=$("#mk_addcol");if(ac)ac.onclick=()=>{const m=get();const n=Math.max(3,...m.rows.map(r=>r.ideas.length))+1;m.rows.forEach(r=>{while(r.ideas.length<n)r.ideas.push("");});put(m,1);};
  const av=$("#mk_addvar");if(av)av.onclick=()=>{const m=get();m.variants.push({id:nid(),name:"Variante "+String.fromCharCode(65+m.variants.length),pick:{}});put(m,1);};
  document.querySelectorAll("[data-mv]").forEach(el=>{const h=()=>{const m=get();const v=m.variants[+el.dataset.v];if(el.dataset.mv==="name")v.name=el.value;else{v.pick=v.pick||{};v.pick[m.rows[+el.dataset.r].id]=el.value;}put(m);};el.oninput=h;el.onchange=h;});
  document.querySelectorAll("[data-mvdel]").forEach(b=>b.onclick=()=>{const m=get();m.variants.splice(+b.dataset.mvdel,1);put(m,1);});
};

/* ---------- Bewertung ---------- */
const EVAL_DEF={criteria:[],pair:{},variants:[],hzul:""};
function weights(e){const n=e.criteria.length;if(!n)return[];const sc=e.criteria.map(()=>0);let any=false;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const v=e.pair[e.criteria[i].id+"|"+e.criteria[j].id];if(v===undefined||v==="")continue;any=true;const p=Number(v);sc[i]+=p;sc[j]+=2-p;}
  const tot=sc.reduce((a,b)=>a+b,0);return !any||!tot?e.criteria.map(()=>1/n):sc.map(s=>s/tot);}
function scoreVar(e,v,w){let s=0;e.criteria.forEach((c,i)=>{const g=Number(v.scores&&v.scores[c.id]);if(isFinite(g))s+=w[i]*g;});return s;}
VIEWS.bewertung=()=>{
  const e=getTool("eval",EVAL_DEF);const ro=!S.canWrite||S.offline;const w=weights(e);
  const fReqs=S.data.reqs.filter(r=>r.art==="F").sort(byNr);
  const res=e.variants.map(v=>{const nw=scoreVar(e,v,w);const x=nw/4;const H=num(v.cost),hz=num(e.hzul);const y=H>0&&hz>0?Math.min(1,0.7*hz/H):NaN;return {v,nw,x,y,ok:v.fOk!==false};});
  const ranked=res.filter(r=>r.ok).sort((a,b)=>b.nw-a.nw);
  let sens="";if(ranked.length>1&&e.criteria.length>1){const top=ranked[0].v.id;const flips=[];
    e.criteria.forEach((c,i)=>{[1.2,0.8].forEach(fac=>{const w2=w.map((x,j)=>j===i?x*fac:x);const t=w2.reduce((a,b)=>a+b,0)||1;const wn=w2.map(x=>x/t);const best=res.filter(r=>r.ok).map(r=>({id:r.v.id,s:scoreVar(e,r.v,wn)})).sort((a,b)=>b.s-a.s)[0];if(best.id!==top)flips.push(`${c.name} ${fac>1?"+":"−"}20 %`);});});
    sens=flips.length?`<div class="banner">Das Ergebnis kippt, wenn sich diese Gewichte ändern: ${esc(flips.join(", "))}. Gewichtung mit dem Betrieb absichern.</div>`:`<p>${pill("robust","p-ok")} Die beste Variante bleibt vorn, auch wenn jedes Gewicht um ±20 % schwankt.</p>`;}
  const n=e.criteria.length;
  let h=`<div class="head"><div><span class="tag">Lösungsphase · Chat 07</span><h1>Bewertung der Varianten</h1><p>Ablauf: 1. Festanforderungen prüfen (Ausschluss), 2. Kriterien aus M-/W-Anforderungen, 3. paarweiser Vergleich für Gewichte, 4. Punkte 0–4 nach VDI 2225, 5. Ergebnis und Empfindlichkeit. Die Entscheidung trifft der Betrieb.</p></div>
  ${ro?"":`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ev_impv">Varianten aus Morph. Kasten</button><button class="btn" id="ev_impc">Kriterien aus M/W-Anforderungen</button></div>`}</div>
  <div class="grid g2">
  <div class="panel"><h3>1. Festanforderungen je Variante</h3><p class="note">Eine Variante, die eine Festanforderung verletzt, scheidet aus. Festanforderungen werden nicht gewichtet.</p>
   ${fReqs.length?`<details><summary class="small">Festanforderungen anzeigen (${fReqs.length})</summary><ul class="small">${fReqs.map(r=>`<li>${esc(r.nr)} ${esc(r.text)}</li>`).join("")}</ul></details>`:""}
   ${e.variants.map((v,vi)=>`<label class="chk small" style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" data-ev="fok" data-v="${vi}" ${v.fOk!==false?"checked":""} ${ro?"disabled":""}>${esc(v.name)} erfüllt alle Festanforderungen</label>`).join("")||'<div class="empty">Noch keine Varianten.</div>'}
   ${ro?"":`<div class="toolbar" style="margin-top:10px"><input id="ev_newv" placeholder="Variante hinzufügen" aria-label="Neue Variante"><button class="btn sm" id="ev_addv">+</button></div>`}</div>
  <div class="panel"><h3>2. Bewertungskriterien</h3>
   ${e.criteria.map((c,ci)=>`<div class="toolbar"><span class="num" style="width:22px">K${ci+1}</span><input data-ev="cname" data-c="${ci}" value="${esc(c.name)}" ${ro?"readonly":""} aria-label="Kriterium" style="flex:1;min-width:0"><span class="num small">${f2((w[ci]||0)*100,1)} %</span>${ro?"":`<button class="btn sm" data-evdelc="${ci}" aria-label="Kriterium löschen">×</button>`}</div>`).join("")||'<div class="empty">Noch keine Kriterien.</div>'}
   ${ro?"":`<div class="toolbar"><input id="ev_newc" placeholder="Kriterium hinzufügen" aria-label="Neues Kriterium"><button class="btn sm" id="ev_addc">+</button></div>`}</div>
  </div>
  <div class="panel" style="margin-top:14px"><h3>3. Paarweiser Vergleich</h3><p class="note">Je Paar: Welches Kriterium ist wichtiger? 2 Punkte für das wichtigere, je 1 bei Gleichstand. Gewicht = Punkte / Summe. Ein Kriterium mit 0 Punkten hat Gewicht 0 – prüfen, ob es dann überhaupt nötig ist.</p>
   ${n>1?`<div class="tbl"><table><tbody>${(()=>{let r="";for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const k=e.criteria[i].id+"|"+e.criteria[j].id;const v=e.pair[k];r+=`<tr><td class="small">K${i+1} ${esc(e.criteria[i].name)}</td><td><select data-ev="pair" data-k="${k}" ${ro?"disabled":""} aria-label="Vergleich K${i+1} mit K${j+1}"><option value="" ${v===undefined||v===""?"selected":""}>–</option><option value="2" ${v==2?"selected":""}>wichtiger als</option><option value="1" ${v==1?"selected":""}>gleich wichtig wie</option><option value="0" ${v==0&&v!==""?"selected":""}>weniger wichtig als</option></select></td><td class="small">K${j+1} ${esc(e.criteria[j].name)}</td></tr>`;}return r;})()}</tbody></table></div>`:'<div class="empty">Mindestens zwei Kriterien anlegen.</div>'}</div>
  <div class="panel" style="margin-top:14px"><h3>4. Punkte je Variante (0 = unbefriedigend … 4 = ideal)</h3>
   ${e.variants.length&&n?`<div class="tbl"><table><thead><tr><th>Kriterium</th><th>Gewicht</th>${e.variants.map(v=>`<th>${esc(v.name)}</th>`).join("")}</tr></thead><tbody>${e.criteria.map((c,ci)=>`<tr><td>K${ci+1} ${esc(c.name)}</td><td class="num">${f2(w[ci]*100,1)} %</td>${e.variants.map((v,vi)=>`<td><select data-ev="score" data-v="${vi}" data-c="${c.id}" ${ro?"disabled":""} aria-label="Punkte"><option value="">–</option>${[0,1,2,3,4].map(g=>`<option ${String(v.scores&&v.scores[c.id])===String(g)?"selected":""}>${g}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}
   <tr><td>Herstellkosten H (€) für wirtsch. Wertigkeit</td><td></td>${e.variants.map((v,vi)=>`<td><input data-ev="cost" data-v="${vi}" type="number" step="any" value="${esc(v.cost||"")}" ${ro?"readonly":""} style="width:100px" aria-label="Kosten"></td>`).join("")}</tr></tbody></table></div>

const XMIME={pdf:"application/pdf",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",xls:"application/vnd.ms-excel",doc:"application/msword",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",txt:"text/plain",csv:"text/csv",md:"text/markdown",json:"application/json",zip:"application/zip"};
const NATIVE=/^(application\/pdf|image\/(png|jpeg|gif|webp)|text\/(plain|csv|markdown)|application\/json)$/;
const VIEWABLE=/^(application\/pdf|image\/)/;
const fext=n=>{const m=/\.([a-z0-9]+)$/i.exec(n||"");return m?m[1].toLowerCase():"";};
const verNum=v=>{const m=/(\d+)/.exec(v||"");return m?+m[1]:0;};
const fsize=b=>!b?"":b>=1048576?f2(b/1048576,1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const fileMime=f=>f.mime||XMIME[fext(f.name)]||"";
const PAGES="https://janekbauer02-cell.github.io/Technikerarbeit/",RAWB="https://raw.githubusercontent.com/janekbauer02-cell/Technikerarbeit/main/docs/";
const encPath=p=>p.split("/").map(encodeURIComponent).join("/");
function fileUrl(f){if(f.url)return f.url;if(f.path)return (location.protocol==="file:"?PAGES:"")+encPath(f.path);return "";}
function archRows(){return S.data.files.map(f=>Object.assign({},f,{folder:f.folder||(f.deadline?"9 Uploads zu Terminen":"9 Sonstiges"),family:f.family||f.name||"Datei",seq:(f.seq!==""&&f.seq!=null&&isFinite(+f.seq))?+f.seq:verNum(f.ver)}));}
function archTree(){const t={};archRows().forEach(r=>{const fo=t[r.folder]=t[r.folder]||{};(fo[r.family]=fo[r.family]||[]).push(r);});
  Object.values(t).forEach(fams=>Object.values(fams).forEach(v=>v.sort((a,b)=>(b.seq-a.seq)||(b.date||"").localeCompare(a.date||"")||(b.updated||"").localeCompare(a.updated||""))));return t;}
const newest=vers=>vers.find(v=>!v.missing)||null;
const famOrder=fams=>Object.keys(fams).sort((a,b)=>{const oa=Math.min(...fams[a].map(x=>x.order==null?999:x.order)),ob=Math.min(...fams[b].map(x=>x.order==null?999:x.order));return (oa-ob)||a.localeCompare(b,"de");});
function nextVer(folder,family){const t=archTree();const v=(t[folder]&&t[folder][family])||[];if(!v.length)return "V1";const mx=Math.max(...v.map(x=>x.seq||0));return "V"+(mx+1);}

async function storeFile(file,o){

async function getBlob(f){
  if(!fileUrl(f))throw new Error("Die Datei liegt im PC-Archiv, nicht in der Web-Fassung.");let r=await fetch(fileUrl(f));if(!r.ok&&f.path)r=await fetch(RAWB+encPath(f.path));if(!r.ok)throw new Error("Datei nicht erreichbar ("+r.status+"). Frisch hochgeladene Dateien sind nach ca. 1 Minute da.");
  if(f.enc==="b64"){const bin=atob((await r.text()).trim());const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:fileMime(f)});}
  return await r.blob();
}

    await saveBlob(n,b);}catch(e){alert2("Download hat nicht geklappt: "+(e&&e.message||"unbekannter Fehler"));}

async function dlZip(folders,all,btn){const o=btn.textContent;btn.disabled=true;

/* ---------- Suchpalette ---------- */
const pal=document.createElement("div");pal.id="palette";
pal.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-label="Suche"><input id="palq" type="text" placeholder="Suchen oder Befehl eingeben …" autocomplete="off" aria-label="Suche"><ul id="pall"></ul><div class="hint">Pfeiltasten wählen · Enter öffnen · Esc schließen</div></div>';
document.body.appendChild(pal);
let palSel=0,palItems=[];
function palOpen(c,view,id){
  if(c==="tasks"){openTask(id);return;}
  if(c==="deadlines"){openTermin(id);return;}
  if(S.canWrite&&!S.offline&&LISTS[c]){openEditor(c,id);return;}
  location.hash="#"+view;
}
function palBuild(q){
  const nrm=s=>String(s||"").toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const t=nrm(q).trim().split(/\s+/).filter(Boolean);
  const hit=(label,extra)=>{const l=nrm(label);const h=l+" "+extra.map(nrm).join(" ");if(!t.every(w=>h.includes(w)))return -1;return t.every(w=>l.includes(w))?2:1;};
  const out=[];
  NAV.forEach(g=>g[1].forEach(([k,l])=>{if(!t.length||hit(l,[])>=0)out.push({k:"Seite",label:l,score:3,go:()=>{location.hash="#"+k;}});}));
  if(S.canWrite&&!S.offline)NEWS.forEach(([c,l])=>{if(!t.length||hit(l,[])>=0)out.push({k:"Neu anlegen",label:l,score:t.length?1.5:0,go:()=>openEditor(c,null)});});
  if(t.length)SRC.forEach(([c,kind,view,lab,ext])=>{(S.data[c]||[]).forEach(r=>{const s=hit(lab(r),ext(r));if(s>=0)out.push({k:kind,label:String(lab(r)||"(ohne Titel)").slice(0,140),score:s,go:()=>palOpen(c,view,r.id)});});});
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,40);
}
function palRender(){
  palItems=palBuild($("#palq").value);palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $("#pall").innerHTML=palItems.length?palItems.map((it,i)=>`<li data-pi="${i}" class="${i===palSel?"sel":""}"><span class="k">${esc(it.k)}</span><span class="t">${esc(it.label)}</span></li>`).join(""):'<li style="cursor:default" class="muted">Nichts gefunden.</li>';
  const el=$("#pall .sel");if(el)el.scrollIntoView({block:"nearest"});
}
function palOpenUi(){if(S.modalOpen)return;pal.classList.add("on");const q=$("#palq");q.value="";palSel=0;palRender();q.focus();}
function palClose(){pal.classList.remove("on");}
function palGo(i){const it=palItems[i];if(!it)return;palClose();it.go();}
pal.addEventListener("click",e=>{if(e.target===pal){palClose();return;}const li=e.target.closest("[data-pi]");if(li)palGo(+li.dataset.pi);});
$("#palq").addEventListener("input",()=>{palSel=0;palRender();});
$("#palq").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);palRender();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);palRender();}
  else if(e.key==="Enter"){e.preventDefault();palGo(palSel);}
  else if(e.key==="Escape"){e.preventDefault();palClose();}});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||"")&&!S.modalOpen){e.preventDefault();palOpenUi();}});
boot();
})();
</script>

</body></html>
